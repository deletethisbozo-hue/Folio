name: Apply Folio 2.0 packaged smoke update

on:
  push:
    branches: [release/v2.0.0]
    paths:
      - scripts/patch-v2-packaged-smoke.mjs
      - .github/workflows/v2-packaged-smoke-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Update packaged UI smoke for Folio 2.0
        run: node scripts/patch-v2-packaged-smoke.mjs
      - name: Commit packaged smoke update and remove one-shot machinery
        run: |
          git config user.name "deletethisbozo-hue"
          git config user.email "deletethisbozo@gmail.com"
          git add -A
          git commit -m "Update packaged UI smoke for Folio 2.0"
          git push origin HEAD:release/v2.0.0
