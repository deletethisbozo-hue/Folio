name: Folio 2.0 composition test patch

on:
  push:
    branches:
      - release/v2.0.0
    paths:
      - .github/workflows/v2-fix-composition-flake.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - name: Patch lazy composition wait
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/ui-runtime.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '      paragraph.dataset.folioQaPolish = "true";\n      if (!paragraph.classList.contains("folio-composed")) return false;\n      const lines = [...paragraph.querySelectorAll<HTMLElement>(":scope > .folio-composed-line")];'
          new = '      paragraph.dataset.folioQaPolish = "true";\n      if (!paragraph.classList.contains("folio-composed")) {\n        // The authoritative preview can replace the iframe after the paragraph was first made visible.\n        // Bring the replacement into view again so the lazy compositor observes and composes it.\n        paragraph.scrollIntoView({ block: "center" });\n        return false;\n      }\n      const lines = [...paragraph.querySelectorAll<HTMLElement>(":scope > .folio-composed-line")];'
          if old not in text:
              raise SystemExit('Polish composition wait block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit regression-test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui-runtime.test.ts
          git commit -m "Stabilize lazy Polish composition regression test"
          git push origin HEAD:release/v2.0.0
