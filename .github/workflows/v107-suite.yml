name: Folio 1.0.7 full suite

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-suite.yml"
      - "scripts/v107-qa-trigger.txt"
      - "web/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: folio-v107-suite
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 40 percent hyphen target with 45 percent hard ceiling
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path: str, terminal: str):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              old = f'''  let bestKey = -1;
  let bestCost = Number.POSITIVE_INFINITY;
  let bestSectionRate = Number.POSITIVE_INFINITY;
  let foundWithinSectionBudget = false;
  for (const [key, state] of {terminal}) {{
    const decoded = decodeState(key);
    const paragraphJustifiedLines = Math.max(0, decoded.line - 1);
    const sectionJustifiedLines = sectionStats.justifiedLines + paragraphJustifiedLines;
    const sectionHyphenatedLines = sectionStats.hyphenatedLines + state.hyphenCount;
    const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);
    const withinBudget = sectionRate <= 0.45 + 1e-9;
    if (withinBudget) {{
      if (!foundWithinSectionBudget || state.cost < bestCost) {{
        foundWithinSectionBudget = true;
        bestCost = state.cost;
        bestSectionRate = sectionRate;
        bestKey = key;
      }}
    }} else if (!foundWithinSectionBudget
      && (sectionRate < bestSectionRate - 1e-9
        || (Math.abs(sectionRate - bestSectionRate) <= 1e-9 && state.cost < bestCost))) {{
      bestCost = state.cost;
      bestSectionRate = sectionRate;
      bestKey = key;
    }}
  }}'''
              new = f'''  let bestKey = -1;
  let bestCost = Number.POSITIVE_INFINITY;
  let bestSectionRate = Number.POSITIVE_INFINITY;
  let bestHyphenBudgetPriority = 3;
  for (const [key, state] of {terminal}) {{
    const decoded = decodeState(key);
    const paragraphJustifiedLines = Math.max(0, decoded.line - 1);
    const sectionJustifiedLines = sectionStats.justifiedLines + paragraphJustifiedLines;
    const sectionHyphenatedLines = sectionStats.hyphenatedLines + state.hyphenCount;
    const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);
    // 0.45 is a release ceiling, not a composition target. Prefer a 0.40
    // operating target when the strict graph can achieve it, leaving enough
    // headroom for platform font-metric differences without accepting looser
    // spacing, emergency lines, or a weaker QA threshold.
    const hyphenBudgetPriority = sectionRate <= 0.40 + 1e-9
      ? 0
      : sectionRate <= 0.45 + 1e-9 ? 1 : 2;
    const betterSamePriority = hyphenBudgetPriority < 2
      ? state.cost < bestCost
      : sectionRate < bestSectionRate - 1e-9
        || (Math.abs(sectionRate - bestSectionRate) <= 1e-9 && state.cost < bestCost);
    if (hyphenBudgetPriority < bestHyphenBudgetPriority
      || (hyphenBudgetPriority === bestHyphenBudgetPriority && betterSamePriority)) {{
      bestHyphenBudgetPriority = hyphenBudgetPriority;
      bestCost = state.cost;
      bestSectionRate = sectionRate;
      bestKey = key;
    }}
  }}'''
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one selection block, got {count}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          patch('web/src/compositor.ts', 'states[count]')

          p = Path('server/pipeline/compositor.ts')
          s = p.read_text(encoding='utf-8')
          old = '''      let bestKey = -1;
      let bestCost = Number.POSITIVE_INFINITY;
      let bestSectionRate = Number.POSITIVE_INFINITY;
      let foundWithinSectionBudget = false;
      for (const [key, state] of states[words.length]) {
        const decoded = decodeState(key);
        const paragraphJustifiedLines = Math.max(0, decoded.line - 1);
        const sectionJustifiedLines = sectionStats.justifiedLines + paragraphJustifiedLines;
        const sectionHyphenatedLines = sectionStats.hyphenatedLines + state.hyphenCount;
        const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);
        const withinBudget = sectionRate <= 0.45 + 1e-9;
        if (withinBudget) {
          if (!foundWithinSectionBudget || state.cost < bestCost) {
            foundWithinSectionBudget = true;
            bestCost = state.cost;
            bestSectionRate = sectionRate;
            bestKey = key;
          }
        } else if (!foundWithinSectionBudget
          && (sectionRate < bestSectionRate - 1e-9
            || (Math.abs(sectionRate - bestSectionRate) <= 1e-9 && state.cost < bestCost))) {
          bestCost = state.cost;
          bestSectionRate = sectionRate;
          bestKey = key;
        }
      }'''
          new = '''      let bestKey = -1;
      let bestCost = Number.POSITIVE_INFINITY;
      let bestSectionRate = Number.POSITIVE_INFINITY;
      let bestHyphenBudgetPriority = 3;
      for (const [key, state] of states[words.length]) {
        const decoded = decodeState(key);
        const paragraphJustifiedLines = Math.max(0, decoded.line - 1);
        const sectionJustifiedLines = sectionStats.justifiedLines + paragraphJustifiedLines;
        const sectionHyphenatedLines = sectionStats.hyphenatedLines + state.hyphenCount;
        const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);
        // Keep PDF/print on the same 0.40 operating target as live preview.
        // The immutable release gate remains 0.45; this only prefers cleaner
        // feasible states before platform metrics push the result to that edge.
        const hyphenBudgetPriority = sectionRate <= 0.40 + 1e-9
          ? 0
          : sectionRate <= 0.45 + 1e-9 ? 1 : 2;
        const betterSamePriority = hyphenBudgetPriority < 2
          ? state.cost < bestCost
          : sectionRate < bestSectionRate - 1e-9
            || (Math.abs(sectionRate - bestSectionRate) <= 1e-9 && state.cost < bestCost);
        if (hyphenBudgetPriority < bestHyphenBudgetPriority
          || (hyphenBudgetPriority === bestHyphenBudgetPriority && betterSamePriority)) {
          bestHyphenBudgetPriority = hyphenBudgetPriority;
          bestCost = state.cost;
          bestSectionRate = sectionRate;
          bestKey = key;
        }
      }'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'server compositor: expected one selection block, got {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/compositor.ts server/pipeline/compositor.ts
          git diff --cached --check
          git commit -m "Add hyphenation headroom below release ceiling"
          git push origin HEAD:fix/v1.0.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
          "$PANDOC_BIN" --version | head -n 1
      - name: Typecheck
        run: npm run typecheck
      - name: Full formatter and UI suite
        run: npm test
      - name: Build web and server
        run: npm run build
