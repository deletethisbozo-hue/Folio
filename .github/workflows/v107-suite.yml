name: Folio 1.0.7 full suite

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-suite.yml"
      - "scripts/v107-qa-trigger.txt"
      - "web/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: folio-v107-suite
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make authoritative preview replacement deterministic
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('web/src/App.tsx')
          s = app.read_text(encoding='utf-8')
          replacements = [
            (
              '      onPreviewLoad(scrollTop);\n      return;',
              '      // Replacing body invalidates every compositor marker even when the Markdown\n      // snapshot itself is unchanged. Force a fresh lazy composition pass so a late\n      // authoritative server response can never leave the newly inserted DOM inert.\n      onPreviewLoad(scrollTop, false, true);\n      return;'
            ),
            (
              '  function onPreviewLoad(restoreScroll?: number, geometryOnly = false) {',
              '  function onPreviewLoad(restoreScroll?: number, geometryOnly = false, forceRecompose = false) {'
            ),
            (
              '      && (geometryOnly || calibrationChanged || compositionModeChanged)) {',
              '      && (forceRecompose || geometryOnly || calibrationChanged || compositionModeChanged)) {'
            ),
          ]
          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'App.tsx patch target mismatch for {old!r}: {count}')
            s = s.replace(old, new, 1)
          app.write_text(s, encoding='utf-8')

          test = Path('tests/ui-runtime.test.ts')
          s = test.read_text(encoding='utf-8')
          old = '''      const doc = document.querySelector("iframe")?.contentDocument;
      const paragraph = doc?.querySelector<HTMLElement>('section.chapter > p[data-folio-qa-polish="true"]');
      if (!doc || !paragraph?.classList.contains("folio-composed")) return false;
      const lines = [...paragraph.querySelectorAll<HTMLElement>(":scope > .folio-composed-line")];'''
          new = '''      const doc = document.querySelector("iframe")?.contentDocument;
      if (!doc) return false;
      // A slow authoritative preview may legitimately replace the iframe body after
      // this stage first tagged the target paragraph. Reacquire the same semantic
      // Polish paragraph instead of treating a replaced test-only data attribute as
      // missing book content. The composition requirements below stay unchanged.
      const paragraph = [...doc.querySelectorAll<HTMLElement>("section.chapter > p")]
        .find((candidate) => candidate.textContent
          ?.replace(/\\u00ad/g, "")
          .replace(/\\u00a0/g, " ")
          .includes("W Polsce i na świecie najprawdopodobniej"));
      if (!paragraph) return false;
      paragraph.dataset.folioQaPolish = "true";
      if (!paragraph.classList.contains("folio-composed")) return false;
      const lines = [...paragraph.querySelectorAll<HTMLElement>(":scope > .folio-composed-line")];'''
          count = s.count(old)
          if count != 1:
            raise SystemExit(f'ui-runtime reacquire target mismatch: {count}')
          test.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx tests/ui-runtime.test.ts
          git diff --cached --check
          git commit -m "Stabilize late authoritative preview composition"
          git push origin HEAD:fix/v1.0.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
          "$PANDOC_BIN" --version | head -n 1
      - name: Typecheck
        run: npm run typecheck
      - name: Full formatter and UI suite
        run: npm test
      - name: Build web and server
        run: npm run build