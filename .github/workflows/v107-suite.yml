name: Folio 1.0.7 full suite

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-suite.yml"
      - "web/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: folio-v107-suite
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install preview conversion engine
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Typecheck
        run: npm run typecheck
      - name: Full formatter and UI suite
        run: npm test
      - name: Build web and server
        run: npm run build
