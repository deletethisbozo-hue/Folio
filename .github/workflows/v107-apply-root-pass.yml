name: Apply v1.0.7 root-cause pass

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - scripts/apply-v107-typography-blues-pass.py
      - .github/workflows/v107-apply-root-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Apply targeted pass
        run: python3 scripts/apply-v107-typography-blues-pass.py
      - name: Validate patch shape
        run: git diff --check
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Commit product changes
        run: |
          rm scripts/apply-v107-typography-blues-pass.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/blues.ts server/pipeline/render-blues.ts server/pipeline/theme-fonts.ts web/src/compositor.ts tests/ui-runtime.test.ts scripts/apply-v107-typography-blues-pass.py
          git commit -m "Fix v1.0.7 pagination and typography edge cases"
          git push origin HEAD:fix/v1.0.7
