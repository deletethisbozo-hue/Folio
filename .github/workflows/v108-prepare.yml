name: Prepare Folio 1.0.8 release

on:
  push:
    branches: [release/v1.0.8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-v108-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.8
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Bump package metadata to 1.0.8
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if [ "$current" = "1.0.8" ]; then
            echo "Already at 1.0.8"
          elif [ "$current" = "1.0.7" ]; then
            npm version 1.0.8 --no-git-tag-version
          else
            echo "Unexpected package version: $current" >&2
            exit 1
          fi

      - name: Scope Windows release workflow to 1.0.8
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/windows-release.yml')
          text = path.read_text(encoding='utf-8')
          old_check = 'if ($version -ne "1.0.7") { throw "Windows release is scoped to Folio 1.0.7, found $version." }'
          new_check = 'if ($version -ne "1.0.8") { throw "Windows release is scoped to Folio 1.0.8, found $version." }'
          if old_check in text:
              text = text.replace('Verify Folio 1.0.7 version consistency', 'Verify Folio 1.0.8 version consistency')
              text = text.replace(old_check, new_check)
          elif new_check not in text:
              raise SystemExit('Could not find expected 1.0.7/1.0.8 release version guard')

          lines = text.splitlines()
          replaced_notes = False
          for i, line in enumerate(lines):
              if line.strip().startswith('--notes "Folio 1.0.7'):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + '--notes "Folio 1.0.8 promotes the fully qualified compositor word-spacing state fix on top of 1.0.7. The Windows release remains gated by typecheck, the complete formatter/UI suite, visual and typesetting QA across all 30 book themes, packaged executable smoke tests, EPUB/PDF/print export checks and SHA-256 hashing."'
                  replaced_notes = True
                  break
          if not replaced_notes and 'Folio 1.0.8 promotes the fully qualified compositor word-spacing state fix' not in '\n'.join(lines):
              raise SystemExit('Could not update v1.0.8 release notes')

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='1.0.8'||l.version!=='1.0.8'||l.packages[''].version!=='1.0.8') throw new Error('v1.0.8 package metadata mismatch')"
          grep -F 'if ($version -ne "1.0.8")' .github/workflows/windows-release.yml
          grep -F 'Folio 1.0.8 promotes the fully qualified compositor word-spacing state fix' .github/workflows/windows-release.yml

      - name: Commit prepared release state and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "folio-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v108-prepare.yml
          git add package.json package-lock.json .github/workflows/windows-release.yml
          if git diff --cached --quiet; then
            echo "No release-preparation changes to commit."
            exit 0
          fi
          git commit -m "Prepare Folio v1.0.8 release"
          git push origin HEAD:release/v1.0.8
