name: Folio Wails decision benchmark

on:
  workflow_dispatch:
  push:
    branches: ["migration/wails"]
    paths:
      - "wails-poc/**"
      - "web/**"
      - ".github/workflows/wails-decision-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: folio-wails-decision-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\benchmark\chromium

    steps:
      - name: Check out Folio
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: wails-poc/go.mod

      - name: Install Folio dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the exact current React frontend
        run: npm run build:web

      - name: Copy production React output into the Wails shell
        shell: pwsh
        run: |
          Remove-Item wails-poc\frontend\dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force wails-poc\frontend\dist | Out-Null
          Copy-Item web\dist\* wails-poc\frontend\dist -Recurse -Force

      - name: Install Wails 2.16 and resolve Go modules
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          Push-Location wails-poc
          go mod tidy
          Pop-Location
          wails version

      - name: Build Wails shell with system WebView2 strategy
        shell: pwsh
        run: |
          Push-Location wails-poc
          wails build -clean -s -platform windows/amd64 -webview2 embed -o Folio-Wails-Benchmark.exe
          Pop-Location
          if (-not (Test-Path "wails-poc\build\bin\Folio-Wails-Benchmark.exe")) {
            throw "Wails benchmark executable was not produced."
          }

      - name: Download official Electron 2.1.2 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force benchmark\electron | Out-Null
          gh release download v2.1.2 --repo $env:GITHUB_REPOSITORY --pattern "Folio-2.1.2-*.exe" --dir benchmark\electron
          if (-not (Test-Path "benchmark\electron\Folio-2.1.2-portable.exe") -or -not (Test-Path "benchmark\electron\Folio-2.1.2-setup.exe")) {
            throw "Could not download both official Folio 2.1.2 Windows baselines."
          }

      - name: Materialise current heavyweight runtime resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force benchmark\pandoc-unpack | Out-Null
          $pandocUrl = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $pandocUrl -OutFile benchmark\pandoc.zip
          $actual = (Get-FileHash benchmark\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") {
            throw "Pandoc checksum mismatch: $actual"
          }
          Expand-Archive benchmark\pandoc.zip benchmark\pandoc-unpack -Force
          npx puppeteer browsers install chrome-headless-shell

      - name: Benchmark installed Electron against Wails potential
        timeout-minutes: 12
        shell: pwsh
        run: |
          function DirBytes([string]$Path) {
            if (-not (Test-Path $Path)) { return [int64]0 }
            $item = Get-Item $Path
            if (-not $item.PSIsContainer) { return [int64]$item.Length }
            return [int64]((Get-ChildItem $Path -File -Recurse | Measure-Object Length -Sum).Sum)
          }

          function SnapshotIds {
            return @(Get-Process -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          }

          function NewMatchingMemoryMB([int[]]$Before, [string]$Pattern) {
            $bytes = 0L
            Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $Before -notcontains $_.Id -and $_.Name -match $Pattern } |
              ForEach-Object { $bytes += [int64]$_.WorkingSet64 }
            return [math]::Round($bytes / 1MB, 1)
          }

          function StopFolioProcesses {
            Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "^(Folio|Folio-Wails-Benchmark|Folio-2\.1\.2-portable|chrome-headless-shell)$" } |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

          $setupExe = (Resolve-Path "benchmark\electron\Folio-2.1.2-setup.exe").Path
          $portableExe = (Resolve-Path "benchmark\electron\Folio-2.1.2-portable.exe").Path
          $wailsExe = (Resolve-Path "wails-poc\build\bin\Folio-Wails-Benchmark.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "Folio-2.1.2-Installed-Benchmark"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue

          # Install the actual official release. This removes portable self-extraction
          # from the startup comparison.
          $installer = Start-Process -FilePath $setupExe -ArgumentList @("/S", "/D=$installDir") -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Folio 2.1.2 installer failed with exit code $($installer.ExitCode)." }
          $installedExe = Join-Path $installDir "Folio.exe"
          if (-not (Test-Path $installedExe)) {
            $candidate = Get-ChildItem $installDir -Filter Folio.exe -Recurse | Select-Object -First 1
            if (-not $candidate) { throw "Installed Folio.exe was not found." }
            $installedExe = $candidate.FullName
          }

          $installedBytes = DirBytes $installDir
          $installedPandocBytes = DirBytes (Join-Path $installDir "resources\pandoc")
          $installedChromiumBytes = DirBytes (Join-Path $installDir "resources\chromium")

          # Installed Electron cold start: server + renderer debug page ready.
          StopFolioProcesses
          Start-Sleep -Seconds 1
          $electronBefore = SnapshotIds
          $env:FOLIO_E2E_PORT = "43221"
          $env:FOLIO_E2E_DEBUG_PORT = "43222"
          $electronClock = [Diagnostics.Stopwatch]::StartNew()
          $electronProcess = Start-Process -FilePath $installedExe -PassThru
          $electronReady = $false
          for ($i = 0; $i -lt 160; $i++) {
            if ($electronProcess.HasExited) { throw "Installed Electron Folio exited before ready." }
            try {
              $health = Invoke-RestMethod "http://127.0.0.1:43221/api/health" -TimeoutSec 1
              $pages = Invoke-RestMethod "http://127.0.0.1:43222/json" -TimeoutSec 1
              if ($health.ok -and ($pages | Where-Object { $_.url -match "43221" })) {
                $electronReady = $true
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 125
          }
          if (-not $electronReady) { throw "Installed Electron baseline never became renderer-ready." }
          $electronReadyMs = $electronClock.ElapsedMilliseconds
          Start-Sleep -Seconds 3
          $electronMemoryMB = NewMatchingMemoryMB $electronBefore "^(Folio|chrome|chrome-headless-shell|msedgewebview2)$"
          StopFolioProcesses
          Remove-Item Env:FOLIO_E2E_PORT -ErrorAction SilentlyContinue
          Remove-Item Env:FOLIO_E2E_DEBUG_PORT -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # Wails best-case shell with the exact same React/Vite production output.
          $wailsBefore = SnapshotIds
          $readyFile = Join-Path $env:RUNNER_TEMP "folio-wails-ready-installed-comparison.txt"
          Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
          $env:FOLIO_WAILS_READY_FILE = $readyFile
          $wailsClock = [Diagnostics.Stopwatch]::StartNew()
          $wailsProcess = Start-Process -FilePath $wailsExe -PassThru
          for ($i = 0; $i -lt 160 -and -not (Test-Path $readyFile); $i++) {
            if ($wailsProcess.HasExited) { throw "Wails shell exited before DOM ready." }
            Start-Sleep -Milliseconds 125
          }
          if (-not (Test-Path $readyFile)) { throw "Wails shell never reached DOM ready." }
          $wailsReadyMs = $wailsClock.ElapsedMilliseconds
          Start-Sleep -Seconds 3
          $wailsMemoryMB = NewMatchingMemoryMB $wailsBefore "^(Folio-Wails-Benchmark|msedgewebview2)$"
          Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "^(Folio-Wails-Benchmark|msedgewebview2)$" -and $wailsBefore -notcontains $_.Id } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item Env:FOLIO_WAILS_READY_FILE -ErrorAction SilentlyContinue

          $setupBytes = DirBytes $setupExe
          $portableBytes = DirBytes $portableExe
          $wailsBytes = DirBytes $wailsExe
          $reactBytes = DirBytes "web\dist"

          # What an installed Wails Folio would occupy if we changed only the shell
          # and kept today's exact Pandoc + Chromium resources unchanged.
          $projectedLegacyInstalledBytes = $wailsBytes + $installedPandocBytes + $installedChromiumBytes

          # Produce a compressed distribution estimate using the same real resources.
          $stage = Join-Path $env:RUNNER_TEMP "folio-wails-legacy-stage"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $wailsExe (Join-Path $stage "Folio.exe")
          if (Test-Path (Join-Path $installDir "resources\pandoc")) {
            Copy-Item (Join-Path $installDir "resources\pandoc") (Join-Path $stage "pandoc") -Recurse
          }
          if (Test-Path (Join-Path $installDir "resources\chromium")) {
            Copy-Item (Join-Path $installDir "resources\chromium") (Join-Path $stage "chromium") -Recurse
          }
          New-Item -ItemType Directory -Force benchmark\results | Out-Null
          $archive = (Resolve-Path "benchmark\results").Path + "\wails-legacy-runtime.7z"
          & 7z a -t7z -mx=5 $archive "$stage\*" | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) { throw "Could not compress projected Wails distribution." }
          $projectedLegacyDownloadBytes = DirBytes $archive

          $installedSizeReduction = [math]::Round((1 - ($projectedLegacyInstalledBytes / $installedBytes)) * 100, 1)
          $downloadReduction = [math]::Round((1 - ($projectedLegacyDownloadBytes / $setupBytes)) * 100, 1)
          $shellOnlyReduction = [math]::Round((1 - ($wailsBytes / $installedBytes)) * 100, 1)
          $startupReduction = [math]::Round((1 - ($wailsReadyMs / $electronReadyMs)) * 100, 1)
          $memoryReduction = if ($electronMemoryMB -gt 0) { [math]::Round((1 - ($wailsMemoryMB / $electronMemoryMB)) * 100, 1) } else { 0 }

          # A full migration only becomes plausible if even the best-case runtime
          # shows clear performance potential. Keeping today's Chromium is assessed
          # separately, because that one resource may erase most size savings.
          $performancePotential = ($startupReduction -ge 30) -or ($memoryReduction -ge 25)
          $worthItWithoutPrintRewrite = ($installedSizeReduction -ge 40) -and ($downloadReduction -ge 40) -and $performancePotential

          $result = [ordered]@{
            electronInstalled = [ordered]@{
              setupBytes = $setupBytes
              portableBytes = $portableBytes
              installedBytes = $installedBytes
              installedPandocBytes = $installedPandocBytes
              installedChromiumBytes = $installedChromiumBytes
              readyMs = $electronReadyMs
              idleMemoryMB = $electronMemoryMB
            }
            wailsBestCase = [ordered]@{
              shellBytes = $wailsBytes
              readyMs = $wailsReadyMs
              idleMemoryMB = $wailsMemoryMB
            }
            projectedWailsKeepingCurrentPrintRuntime = [ordered]@{
              installedBytes = $projectedLegacyInstalledBytes
              compressedDistributionBytes = $projectedLegacyDownloadBytes
            }
            reductionsPercent = [ordered]@{
              shellVersusInstalledFootprint = $shellOnlyReduction
              installedFootprintKeepingCurrentPrintRuntime = $installedSizeReduction
              compressedDownloadKeepingCurrentPrintRuntime = $downloadReduction
              startupBestCase = $startupReduction
              idleMemoryBestCase = $memoryReduction
            }
            gates = [ordered]@{
              performancePotential = $performancePotential
              worthMigratingWithoutPrintRuntimeRewrite = $worthItWithoutPrintRewrite
            }
            notes = @(
              "Wails best-case does not yet include the Folio backend; it is an upper bound on performance gains.",
              "Projected Wails footprint keeps the exact Pandoc and Chromium resources from the installed Electron release.",
              "A full migration is not authorised by this benchmark alone."
            )
          }

          $result | ConvertTo-Json -Depth 8 | Set-Content benchmark\results\wails-decision-v2.json -Encoding utf8

          @"
          # Folio Wails installed-app decision benchmark

          | Metric | Installed Electron 2.1.2 | Wails best-case |
          | --- | ---: | ---: |
          | Installed/shell footprint | $([math]::Round($installedBytes / 1MB, 1)) MB | $([math]::Round($wailsBytes / 1MB, 1)) MB |
          | Cold renderer ready | $electronReadyMs ms | $wailsReadyMs ms |
          | Idle process memory | $electronMemoryMB MB | $wailsMemoryMB MB |

          Current installed resources:
          - Pandoc: $([math]::Round($installedPandocBytes / 1MB, 1)) MB
          - Chromium/Puppeteer: $([math]::Round($installedChromiumBytes / 1MB, 1)) MB

          If Wails keeps those exact resources:
          - Installed footprint: $([math]::Round($projectedLegacyInstalledBytes / 1MB, 1)) MB ($installedSizeReduction% smaller)
          - Compressed distribution estimate: $([math]::Round($projectedLegacyDownloadBytes / 1MB, 1)) MB vs $([math]::Round($setupBytes / 1MB, 1)) MB current setup ($downloadReduction% smaller)

          Decision:
          - Performance potential: **$performancePotential**
          - Worth migrating without rewriting print runtime: **$worthItWithoutPrintRewrite**
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

          Get-Content benchmark\results\wails-decision-v2.json
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Wails-Decision-Benchmark
          path: |
            benchmark/results/wails-decision-v2.json
            wails-poc/build/bin/Folio-Wails-Benchmark.exe
          if-no-files-found: error
