name: Apply and qualify Folio 2.0.2 hotfix

on:
  push:
    branches: ["fix/v2.0.2-ui-print-images"]
    paths:
      - "scripts/apply-v202-hotfix.mjs"
      - "scripts/v202-remove-revenant-leftovers.mjs"
      - ".github/workflows/apply-v202-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-v202-hotfix
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.2-ui-print-images
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
          "$PANDOC_BIN" --version | head -n 1
      - name: Remove remaining Revenant references
        run: node scripts/v202-remove-revenant-leftovers.mjs
      - name: Apply 2.0.2 corrections
        run: node scripts/apply-v202-hotfix.mjs
      - name: Typecheck corrected product
        run: npm run typecheck
      - name: Run formatter and UI regression suite
        run: npm test
      - name: Build corrected web and server
        run: npm run build
      - name: Commit qualified product changes
        shell: bash
        run: |
          git restore scripts/apply-v202-hotfix.mjs scripts/v202-remove-revenant-leftovers.mjs .github/workflows/apply-v202-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Fix Folio 2.0.2 UI, print preview and image pages"
          git push origin HEAD:fix/v2.0.2-ui-print-images
