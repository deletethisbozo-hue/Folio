name: Temporary v1.0.7 blocked-fit diagnostic

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-paperwhite-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
      BASE_FONT: "16.75"
      SIDE: "25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Instrument exact blocked line fit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("web/src/compositor.ts")
          text = path.read_text(encoding="utf-8")

          needle = '    if (Math.abs(residualPx) > 1.7) continue;\n\n    const spaceRatio = wordSpacing / Math.max(0.5, spaceWidth);'
          replacement = (
              '    if (Math.abs(residualPx) > 1.7) continue;\n'
              '    const semanticGapEm = ((spaceWidth + wordSpacing + tracking) * glyphScale) / Math.max(1, fontSize);\n'
              '    if (semanticGapEm > 0.369) continue;\n\n'
              '    const spaceRatio = wordSpacing / Math.max(0.5, spaceWidth);'
          )
          if text.count(needle) != 1:
              raise SystemExit(f"semantic gate marker count={text.count(needle)}")
          text = text.replace(needle, replacement, 1)

          anchor = '\nconst FITNESS_COUNT = 4;\n'
          if text.count(anchor) != 1:
              raise SystemExit("fitLine anchor missing")
          probe = r'''
function probeLineFit(
  adjustment: number,
  gaps: number,
  trackingOps: number,
  spaceWidth: number,
  fontSize: number,
  naturalWidth: number,
  previousGlyphScale: number,
  emergency: boolean,
): Record<string, unknown> {
  const maxWordSpacing = emergency ? fontSize * 0.120 : fontSize * 0.10;
  const minWordSpacing = -(fontSize * (emergency ? 0.120 : 0.099));
  const maxTracking = fontSize * 0.003;
  const minTracking = -fontSize * (emergency ? 0.003 : 0.0025);
  const available = naturalWidth + adjustment;
  const rows: Array<Record<string, unknown>> = [];
  for (let step = -20; step <= 20; step++) {
    const glyphScale = 1 + step * 0.0005;
    if (Math.abs(glyphScale - previousGlyphScale) > 0.012) {
      rows.push({ step, glyphScale, reject: "scale-jump" });
      continue;
    }
    const scaledAdjustment = available / glyphScale - naturalWidth;
    let wordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, scaledAdjustment / gaps));
    const remaining = scaledAdjustment - wordSpacing * gaps;
    let tracking = trackingOps > 0 ? remaining / trackingOps : 0;
    if (tracking > maxTracking || tracking < minTracking) {
      tracking = Math.max(minTracking, Math.min(maxTracking, tracking));
      wordSpacing = (scaledAdjustment - tracking * trackingOps) / gaps;
    }
    wordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, wordSpacing));
    tracking = Math.max(minTracking, Math.min(maxTracking, tracking));
    const residualPx = (scaledAdjustment - wordSpacing * gaps - tracking * trackingOps) * glyphScale;
    const semanticGapEm = ((spaceWidth + wordSpacing + tracking) * glyphScale) / Math.max(1, fontSize);
    const reject = Math.abs(residualPx) > 1.7 ? "residual" : semanticGapEm > 0.369 ? "semantic-gap" : "accepted";
    rows.push({ step, glyphScale, scaledAdjustment, wordSpacing, tracking, residualPx, semanticGapEm, reject });
  }
  return {
    emergency,
    adjustment,
    gaps,
    trackingOps,
    spaceWidth,
    fontSize,
    naturalWidth,
    available,
    previousGlyphScale,
    maxWordSpacing,
    minWordSpacing,
    maxTracking,
    minTracking,
    rows,
  };
}
'''
          text = text.replace(anchor, probe + anchor, 1)

          nofit = text.index('reason: "no-fit"')
          field = '            previousGlyphScale: previous.glyphScale, previousHyphenStreak, previousHyphenCount,\n'
          field_pos = text.index(field, nofit)
          insert = field + (
              '            fitProbe: start === 53 && end === 62\n'
              '              ? {\n'
              '                  strict: probeLineFit(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, false),\n'
              '                  relaxed: probeLineFit(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, true),\n'
              '                }\n'
              '              : undefined,\n'
          )
          text = text[:field_pos] + text[field_pos:].replace(field, insert, 1)
          path.write_text(text, encoding="utf-8")
          print("Instrumented start=53/end=62 with all 41 scale outcomes")
          PY
      - name: Patch controlled Paperwhite geometry and Polish sample language
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          preview = Path("web/src/preview-runtime.ts")
          text = preview.read_text(encoding="utf-8")
          pattern = r'("kindle-paperwhite": \{ width: 412, height: 549, baseFont: )\d+(?:\.\d+)?(, padding: \[34, )\d+(, 46, )\d+(\], wordsPerPage: 270 \},)'
          replacement = rf'\g<1>{os.environ["BASE_FONT"]}\g<2>{os.environ["SIDE"]}\g<3>{os.environ["SIDE"]}\g<4>'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Paperwhite profile not found exactly once")
          preview.write_text(text, encoding="utf-8")
          sample = Path("samples/clockwork-garden/book.yaml")
          sample_text = sample.read_text(encoding="utf-8")
          if "language: en" not in sample_text:
              raise SystemExit("Sample language marker missing")
          sample.write_text(sample_text.replace("language: en", "language: pl", 1), encoding="utf-8")
          PY
      - name: Trim visual harness to Polish composition only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/v107-visual-qa.ts")
          text = path.read_text(encoding="utf-8")
          if '  await setLanguage("pl");\n' in text:
              text = text.replace('  await setLanguage("pl");\n', '', 1)
          marker = '  await setDropcap(true);\n'
          finally_marker = '} finally {\n'
          if marker not in text or finally_marker not in text:
              raise SystemExit("Polish-only harness markers missing")
          prefix = text.split(marker, 1)[0]
          suffix = finally_marker + text.split(finally_marker, 1)[1]
          path.write_text(prefix + '  console.log(JSON.stringify({ dimensions, polishReport }, null, 2));\n' + suffix, encoding="utf-8")
          PY
      - run: npm run typecheck
      - run: npm run build
      - name: Run diagnostic corpus
        shell: bash
        run: |
          set +e
          node --import tsx scripts/v107-visual-qa.ts > build/blocked-fit.log 2>&1
          echo "QA exit: $?"
          tail -n 80 build/blocked-fit.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperwhite-blocked-fit-diagnostic
          path: |
            build/qa-v107/typesetting-polish.json
            build/blocked-fit.log
          if-no-files-found: warn
