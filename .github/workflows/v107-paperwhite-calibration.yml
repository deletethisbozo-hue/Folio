name: Temporary v1.0.7 exhaustive fit frontier

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-paperwhite-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: exhaustive-frontier-side-25
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
      BASE_FONT: "16.75"
      SIDE: "25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Enumerate every legal glyph-scale fit in runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("web/src/compositor.ts")
          text = path.read_text(encoding="utf-8")

          start = text.index("function fitLine(")
          end = text.index("\nconst FITNESS_COUNT = 4;", start)
          fn = "\n".join([
            "function fitLineCandidates(",
            "  adjustment: number,",
            "  gaps: number,",
            "  trackingOps: number,",
            "  spaceWidth: number,",
            "  fontSize: number,",
            "  naturalWidth: number,",
            "  previousGlyphScale = 1,",
            "  emergency = false,",
            "  finalCompression = false,",
            "  language = \"en\",",
            "): LineFit[] {",
            "  if (gaps <= 0) return [];",
            "",
            "  const maxWordSpacing = emergency ? fontSize * 0.120 : fontSize * 0.10;",
            "  const normalizedLanguage = language.toLowerCase();",
            "  const relaxedCompressionEm = 0.120;",
            "  const strictCompressionEm = normalizedLanguage.startsWith(\"pl\") ? 0.099 : 0.06;",
            "  const minWordSpacing = emergency || finalCompression",
            "    ? -(fontSize * relaxedCompressionEm)",
            "    : -(fontSize * strictCompressionEm);",
            "  const maxTracking = fontSize * 0.003;",
            "  const minTracking = -fontSize * (emergency || finalCompression ? 0.003 : 0.0025);",
            "  const maxGlyphScaleDelta = 0.01;",
            "  const available = naturalWidth + adjustment;",
            "  const candidates: LineFit[] = [];",
            "",
            "  for (let step = -20; step <= 20; step++) {",
            "    const glyphScale = 1 + step * 0.0005;",
            "    if (Math.abs(glyphScale - 1) > maxGlyphScaleDelta + 0.000001) continue;",
            "    if (Math.abs(glyphScale - previousGlyphScale) > 0.012) continue;",
            "    const scaledAdjustment = available / glyphScale - naturalWidth;",
            "    let wordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, scaledAdjustment / gaps));",
            "    let remaining = scaledAdjustment - wordSpacing * gaps;",
            "    let tracking = trackingOps > 0 ? remaining / trackingOps : 0;",
            "",
            "    if (tracking > maxTracking || tracking < minTracking) {",
            "      tracking = Math.max(minTracking, Math.min(maxTracking, tracking));",
            "      wordSpacing = (scaledAdjustment - tracking * trackingOps) / gaps;",
            "    }",
            "    wordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, wordSpacing));",
            "    tracking = Math.max(minTracking, Math.min(maxTracking, tracking));",
            "    const residualPx = (scaledAdjustment - wordSpacing * gaps - tracking * trackingOps) * glyphScale;",
            "    if (Math.abs(residualPx) > 1.7) continue;",
            "    const semanticGapEm = ((spaceWidth + wordSpacing + tracking) * glyphScale) / Math.max(1, fontSize);",
            "    if (semanticGapEm > 0.355) continue;",
            "",
            "    const spaceRatio = wordSpacing / Math.max(0.5, spaceWidth);",
            "    const trackingRatio = tracking / Math.max(1, fontSize);",
            "    const scaleRatio = Math.abs(glyphScale - 1) / 0.01;",
            "    const scaleJumpRatio = Math.abs(glyphScale - previousGlyphScale) / 0.01;",
            "    const badness = 100 * Math.pow(Math.abs(spaceRatio) / 0.20, 3)",
            "      + 55 * Math.pow(Math.abs(trackingRatio) / 0.0035, 3)",
            "      + 42 * Math.pow(scaleRatio, 3)",
            "      + 90 * Math.pow(scaleJumpRatio, 2)",
            "      + 80 * Math.pow(Math.abs(residualPx) / 1.7, 2);",
            "    const fitness = spaceRatio < -0.04 ? 0 : spaceRatio <= 0.10 ? 1 : spaceRatio <= 0.22 ? 2 : 3;",
            "    candidates.push({ wordSpacing, tracking, glyphScale, badness, fitness });",
            "  }",
            "  return candidates;",
            "}",
            "",
          ])
          text = text[:start] + fn + text[end:]

          needle = '        const hyphenWidow = last && semanticWordsOnLine === 1 && previous.hyphenated;\n'
          if text.count(needle) != 1:
              raise SystemExit(f"tail marker count={text.count(needle)}")
          text = text.replace(needle, needle + '        if (last && start > 0 && semanticWordsOnLine === 1) continue;\n', 1)

          block_start = text.index("        const finalCompressionFit = last")
          block_end = text.index("        if (!last && !fitOptions.length && !rescueNatural) {", block_start)
          replacement = "\n".join([
            "        const finalCompressionCandidates = last",
            "          && semanticWordsOnLine >= 2",
            "          && adjustment < -0.75",
            "          ? fitLineCandidates(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, false, true, language)",
            "          : [];",
            "        const strictCandidates = !last",
            "          ? fitLineCandidates(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, false, false, language)",
            "          : finalCompressionCandidates;",
            "        const relaxedCandidates = emergency && !last && strictCandidates.length === 0",
            "          ? fitLineCandidates(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, true, false, language)",
            "          : [];",
            "        const candidateFits = strictCandidates.length ? strictCandidates : relaxedCandidates;",
            "        if (!canBreak) continue;",
            "        if (natural > available + 0.75 && candidateFits.length === 0 && (end > start || last)) {",
            "          if (canBreak && rejectedBreaks.length < 160) rejectedBreaks.push({",
            "            reason: \"overfull-break\", start, end, line, hyphenBreak, natural, available, adjustment, gaps, characters,",
            "            startText: (words[start].node.textContent ?? \"\").replace(/\\u00ad/g, \"\"),",
            "            endText: (words[end].node.textContent ?? \"\").replace(/\\u00ad/g, \"\"),",
            "            nextText: (words[end + 1]?.node.textContent ?? \"\").replace(/\\u00ad/g, \"\"),",
            "            previousGlyphScale: previous.glyphScale, previousHyphenStreak, previousHyphenCount,",
            "          });",
            "          break;",
            "        }",
            "        const dropcapRescue = false;",
            "        const emergencyRescue = allowNaturalRescue && !last && candidateFits.length === 0 && natural <= available + 0.75;",
            "        const rescueNatural = emergencyRescue;",
            "        const fitOptions: Array<LineFit | null> = [...candidateFits];",
            "        if (!fitOptions.length && (last || rescueNatural)) fitOptions.push(null);",
            "        const hasStrictFit = strictCandidates.length > 0;",
            "",
          ])
          text = text[:block_start] + replacement + text[block_end:]
          path.write_text(text, encoding="utf-8")
          print("Enumerating all legal line fits instead of locally pruning scales")
          PY
      - name: Patch controlled Paperwhite geometry and Polish sample language
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          preview = Path("web/src/preview-runtime.ts")
          text = preview.read_text(encoding="utf-8")
          pattern = r'("kindle-paperwhite": \{ width: 412, height: 549, baseFont: )\d+(?:\.\d+)?(, padding: \[34, )\d+(, 46, )\d+(\], wordsPerPage: 270 \},)'
          replacement = rf'\g<1>{os.environ["BASE_FONT"]}\g<2>{os.environ["SIDE"]}\g<3>{os.environ["SIDE"]}\g<4>'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Paperwhite profile not found exactly once")
          preview.write_text(text, encoding="utf-8")
          sample = Path("samples/clockwork-garden/book.yaml")
          sample_text = sample.read_text(encoding="utf-8")
          if "language: en" not in sample_text:
              raise SystemExit("Sample language marker missing")
          sample.write_text(sample_text.replace("language: en", "language: pl", 1), encoding="utf-8")
          PY
      - name: Trim visual harness to Polish composition only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/v107-visual-qa.ts")
          text = path.read_text(encoding="utf-8")
          if '  await setLanguage("pl");\n' in text:
              text = text.replace('  await setLanguage("pl");\n', '', 1)
          marker = '  await setDropcap(true);\n'
          finally_marker = '} finally {\n'
          if marker not in text or finally_marker not in text:
              raise SystemExit("Polish-only harness markers missing")
          prefix = text.split(marker, 1)[0]
          suffix = finally_marker + text.split(finally_marker, 1)[1]
          path.write_text(prefix + '  console.log(JSON.stringify({ dimensions, polishReport }, null, 2));\n' + suffix, encoding="utf-8")
          PY
      - run: npm run typecheck
      - run: npm run build
      - name: Run Polish reference corpus
        shell: bash
        run: |
          set +e
          node --import tsx scripts/v107-visual-qa.ts > build/exhaustive-frontier.log 2>&1
          status=$?
          echo "QA exit: $status"
          tail -n 50 build/exhaustive-frontier.log
          exit 0
      - name: Print compact Polish metrics
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'build/qa-v107/typesetting-polish.json';
          if (!fs.existsSync(p)) {
            console.log(JSON.stringify({missing:true}));
            process.exit(0);
          }
          const q = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            measurePx:q.measurePx,
            emergencyLines:q.emergencyLines,
            oneWordFinalLines:q.oneWordFinalLines,
            relaxedLines:q.relaxedLines,
            hyphenRate:q.hyphenRate,
            maxHyphenStreak:q.maxHyphenStreak,
            maxRightErrorPx:q.maxRightErrorPx,
            maxWordSpacingEm:q.maxWordSpacingEm,
            maxTrackingEm:q.maxTrackingEm,
            maxGlyphScaleDelta:q.maxGlyphScaleDelta,
            maxAdjacentGlyphScaleDelta:q.maxAdjacentGlyphScaleDelta,
            maxSemanticGapEm:q.maxSemanticGapEm,
            maxAdjacentSpacingDeltaEm:q.maxAdjacentSpacingDeltaEm,
            emergencyText:(q.emergencyDetails||[]).map(x=>x.text)
          }));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperwhite-exhaustive-frontier-25
          path: |
            build/qa-v107/typesetting-polish.json
            build/qa-v107/reader-polish.png
            build/exhaustive-frontier.log
          if-no-files-found: warn
