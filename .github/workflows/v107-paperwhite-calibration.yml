name: Temporary v1.0.7 Paperwhite solver calibration

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-paperwhite-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: solver-font-${{ matrix.font }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        font: [16.5, 16.625, 16.75, 16.875, 17.0]
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Patch solver constraints in working tree only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("web/src/compositor.ts")
          text = path.read_text(encoding="utf-8")

          needle = '    if (Math.abs(residualPx) > 1.7) continue;\n'
          insert = needle + '''    // Gate the actual semantic inter-word gap before a candidate enters
              // the paragraph graph. QA measures the rendered gap, not merely the
              // extra CSS word-spacing, so leave rasterisation headroom here.
              const semanticGapEm = ((spaceWidth + wordSpacing + tracking) * glyphScale) / Math.max(1, fontSize);
              if (semanticGapEm > 0.355) continue;
'''
          if text.count(needle) != 1:
              raise SystemExit(f"fitLine insertion point count={text.count(needle)}")
          text = text.replace(needle, insert, 1)

          needle = '        const hyphenWidow = last && semanticWordsOnLine === 1 && previous.hyphenated;\n'
          insert = needle + '''        // A single semantic word stranded on the final line of a prose
              // paragraph is a hard composition defect, not a cost preference.
              if (last && start > 0 && semanticWordsOnLine === 1) continue;
'''
          if text.count(needle) != 1:
              raise SystemExit(f"final-line insertion point count={text.count(needle)}")
          text = text.replace(needle, insert, 1)

          needle = '        for (const lineFit of fitOptions) {\n'
          insert = needle + '''          if (lineFit && previous.justified) {
                const adjacentSpacingDeltaEm = Math.abs(lineFit.wordSpacing - previous.wordSpacing) / Math.max(1, fontSize);
                // Keep neighbouring justified lines from visibly pulsing between
                // compressed and expanded spacing. Reserve a little QA headroom.
                if (adjacentSpacingDeltaEm > 0.155) continue;
              }
'''
          if text.count(needle) != 1:
              raise SystemExit(f"adjacent-spacing insertion point count={text.count(needle)}")
          text = text.replace(needle, insert, 1)

          path.write_text(text, encoding="utf-8")
          print("Applied semantic-gap, one-word-tail, and adjacent-spacing graph gates")
          PY
      - name: Patch Paperwhite calibration in working tree only
        shell: bash
        env:
          BASE_FONT: ${{ matrix.font }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("web/src/preview-runtime.ts")
          text = path.read_text(encoding="utf-8")
          pattern = r'("kindle-paperwhite": \{ width: 412, height: 549, baseFont: )\d+(?:\.\d+)?(, padding: \[34, )\d+(, 46, )\d+(\], wordsPerPage: 270 \},)'
          replacement = rf'\g<1>{os.environ["BASE_FONT"]}\g<2>23\g<3>23\g<4>'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Paperwhite profile not found exactly once")
          path.write_text(text, encoding="utf-8")
          print(f"Paperwhite: font {os.environ['BASE_FONT']}, side inset 23")
          PY
      - run: npm run typecheck
      - run: npm run build
      - name: Run reference corpus and retain failing metrics
        shell: bash
        run: |
          set +e
          node --import tsx scripts/v107-visual-qa.ts > "build/calibration-${{ matrix.font }}.log" 2>&1
          status=$?
          echo "QA exit: $status"
          cat "build/calibration-${{ matrix.font }}.log"
          exit 0
      - name: Print compact Polish metrics
        if: always()
        shell: bash
        env:
          BASE_FONT: ${{ matrix.font }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const font = process.env.BASE_FONT;
          const path = 'build/qa-v107/typesetting-polish.json';
          if (!fs.existsSync(path)) {
            console.log(JSON.stringify({font, missing: true}));
            process.exit(0);
          }
          const q = JSON.parse(fs.readFileSync(path, 'utf8'));
          console.log(JSON.stringify({
            font,
            measurePx: q.measurePx,
            emergencyLines: q.emergencyLines,
            oneWordFinalLines: q.oneWordFinalLines,
            relaxedLines: q.relaxedLines,
            hyphenRate: q.hyphenRate,
            maxHyphenStreak: q.maxHyphenStreak,
            maxWordSpacingEm: q.maxWordSpacingEm,
            maxStrictWordSpacingEm: q.maxStrictWordSpacingEm,
            maxRelaxedWordSpacingEm: q.maxRelaxedWordSpacingEm,
            maxTrackingEm: q.maxTrackingEm,
            maxGlyphScaleDelta: q.maxGlyphScaleDelta,
            maxAdjacentGlyphScaleDelta: q.maxAdjacentGlyphScaleDelta,
            maxSemanticGapEm: q.maxSemanticGapEm,
            maxAdjacentSpacingDeltaEm: q.maxAdjacentSpacingDeltaEm,
            emergencyText: (q.emergencyDetails || []).map(x => x.text),
          }));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperwhite-solver-calibration-${{ matrix.font }}
          path: |
            build/qa-v107/**
            build/calibration-${{ matrix.font }}.log
          if-no-files-found: warn
