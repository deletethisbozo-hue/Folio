name: Temporary v1.0.7 bounded Paperwhite calibration

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-paperwhite-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - base_font: "17.25"
            side: "36"
          - base_font: "17.25"
            side: "37"
          - base_font: "17.25"
            side: "38"
          - base_font: "17.50"
            side: "36"
          - base_font: "17.50"
            side: "37"
          - base_font: "17.50"
            side: "38"
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
      BASE_FONT: ${{ matrix.base_font }}
      SIDE: ${{ matrix.side }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply bounded fitter candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("web/src/compositor.ts")
          text = path.read_text(encoding="utf-8")
          old_spacing = "  const maxWordSpacing = emergency\n    ? fontSize * 0.120\n    : fontSize * 0.10;\n"
          if text.count(old_spacing) != 1:
              raise SystemExit("word spacing marker missing")
          text = text.replace(old_spacing, "  const maxWordSpacing = fontSize * 0.075;\n", 1)
          old_residual = "    if (Math.abs(residualPx) > 1.7) continue;"
          if text.count(old_residual) != 1:
              raise SystemExit("residual marker missing")
          text = text.replace(old_residual, "    if (Math.abs(residualPx) > 1.705) continue;", 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Patch Paperwhite geometry and Polish sample language
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          preview = Path("web/src/preview-runtime.ts")
          text = preview.read_text(encoding="utf-8")
          pattern = r'("kindle-paperwhite": \{ width: 412, height: 549, baseFont: )\d+(?:\.\d+)?(, padding: \[34, )\d+(, 46, )\d+(\], wordsPerPage: 270 \},)'
          replacement = rf'\g<1>{os.environ["BASE_FONT"]}\g<2>{os.environ["SIDE"]}\g<3>{os.environ["SIDE"]}\g<4>'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Paperwhite profile not found exactly once")
          preview.write_text(text, encoding="utf-8")
          sample = Path("samples/clockwork-garden/book.yaml")
          sample_text = sample.read_text(encoding="utf-8")
          if "language: en" not in sample_text:
              raise SystemExit("Sample language marker missing")
          sample.write_text(sample_text.replace("language: en", "language: pl", 1), encoding="utf-8")
          PY
      - name: Trim visual harness to Polish composition only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/v107-visual-qa.ts")
          text = path.read_text(encoding="utf-8")
          if '  await setLanguage("pl");\n' in text:
              text = text.replace('  await setLanguage("pl");\n', '', 1)
          marker = '  await setDropcap(true);\n'
          finally_marker = '} finally {\n'
          if marker not in text or finally_marker not in text:
              raise SystemExit("Polish-only harness markers missing")
          prefix = text.split(marker, 1)[0]
          suffix = finally_marker + text.split(finally_marker, 1)[1]
          path.write_text(prefix + '  console.log(JSON.stringify({ dimensions, polishReport }, null, 2));\n' + suffix, encoding="utf-8")
          PY
      - run: npm run typecheck
      - run: npm run build
      - name: Run Polish reference corpus
        shell: bash
        run: |
          set +e
          node --import tsx scripts/v107-visual-qa.ts > build/bounded-calibration.log 2>&1
          status=$?
          echo "QA exit: $status"
          if [ -f build/qa-v107/typesetting-polish.json ]; then
            node -e 'const r=require("./build/qa-v107/typesetting-polish.json"); console.log(JSON.stringify({baseFont:process.env.BASE_FONT,side:process.env.SIDE,measurePx:r.measurePx,emergencyLines:r.emergencyLines,oneWordFinalLines:r.oneWordFinalLines,hyphenRate:r.hyphenRate,maxSemanticGapEm:r.maxSemanticGapEm,maxWordSpacingEm:r.maxWordSpacingEm,maxStrictWordSpacingEm:r.maxStrictWordSpacingEm,maxRelaxedWordSpacingEm:r.maxRelaxedWordSpacingEm,relaxedLines:r.relaxedLines,maxAdjacentSpacingDeltaEm:r.maxAdjacentSpacingDeltaEm,maxGlyphScaleDelta:r.maxGlyphScaleDelta,maxAdjacentGlyphScaleDelta:r.maxAdjacentGlyphScaleDelta,maxRightErrorPx:r.maxRightErrorPx,maxTrackingEm:r.maxTrackingEm},null,2));'
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperwhite-bounded-${{ matrix.base_font }}-side-${{ matrix.side }}
          path: |
            build/qa-v107/typesetting-polish.json
            build/qa-v107/reader-polish.png
            build/bounded-calibration.log
          if-no-files-found: warn
