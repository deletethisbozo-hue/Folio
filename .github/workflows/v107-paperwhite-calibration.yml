name: Temporary v1.0.7 Paperwhite fit frontier

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-paperwhite-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: frontier-side-${{ matrix.side }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        side: [23, 25]
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
      BASE_FONT: "16.75"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply candidate-frontier compositor in runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("web/src/compositor.ts")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} count={count}")
              text = text.replace(old, new, 1)

          replace_once(
              '  selection: "badness" | "continuity" = "badness",\n',
              '  selection: "badness" | "continuity" | "min-scale" | "max-scale" | "neutral-spacing" = "badness",\n',
              "fitLine selection union",
          )

          replace_once(
              '    if (Math.abs(residualPx) > 1.7) continue;\n\n    const spaceRatio = wordSpacing / Math.max(0.5, spaceWidth);',
              '    if (Math.abs(residualPx) > 1.7) continue;\n'
              '    const semanticGapEm = ((spaceWidth + wordSpacing + tracking) * glyphScale) / Math.max(1, fontSize);\n'
              '    if (semanticGapEm > 0.355) continue;\n\n'
              '    const spaceRatio = wordSpacing / Math.max(0.5, spaceWidth);',
              "semantic gap gate",
          )

          replace_once(
              '    const rank = selection === "continuity"\n      ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness\n      : candidate.badness;',
              '    const rank = selection === "continuity"\n'
              '      ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness\n'
              '      : selection === "min-scale"\n'
              '        ? glyphScale * 1_000_000_000 + candidate.badness\n'
              '        : selection === "max-scale"\n'
              '          ? -glyphScale * 1_000_000_000 + candidate.badness\n'
              '          : selection === "neutral-spacing"\n'
              '            ? Math.abs(wordSpacing / Math.max(1, fontSize)) * 100_000_000 + candidate.badness\n'
              '            : candidate.badness;',
              "frontier ranking modes",
          )

          replace_once(
              '        const hyphenWidow = last && semanticWordsOnLine === 1 && previous.hyphenated;\n',
              '        const hyphenWidow = last && semanticWordsOnLine === 1 && previous.hyphenated;\n'
              '        if (last && start > 0 && semanticWordsOnLine === 1) continue;\n',
              "one-word final gate",
          )

          strict_marker = (
              '        const strictContinuityFit = !last\n'
              '          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, false, false, language, "continuity")\n'
              '          : finalCompressionContinuityFit;\n'
          )
          strict_extra = strict_marker + (
              '        const strictMinScaleFit = !last\n'
              '          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, false, false, language, "min-scale")\n'
              '          : null;\n'
              '        const strictMaxScaleFit = !last\n'
              '          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, false, false, language, "max-scale")\n'
              '          : null;\n'
              '        const strictNeutralFit = !last\n'
              '          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, false, false, language, "neutral-spacing")\n'
              '          : null;\n'
              '        const anyStrictFit = Boolean(strictFit || strictContinuityFit || strictMinScaleFit || strictMaxScaleFit || strictNeutralFit);\n'
          )
          replace_once(strict_marker, strict_extra, "strict frontier insertion")

          replace_once(
              '        const fit = strictFit ?? (emergency && !last\n',
              '        const fit = strictFit ?? (!anyStrictFit && emergency && !last\n',
              "strict badness fallback",
          )
          replace_once(
              '        const continuityFit = strictContinuityFit ?? (emergency && !last\n',
              '        const continuityFit = strictContinuityFit ?? (!anyStrictFit && emergency && !last\n',
              "strict continuity fallback",
          )

          continuity_block = (
              '        const continuityFit = strictContinuityFit ?? (!anyStrictFit && emergency && !last\n'
              '          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, true, false, language, "continuity")\n'
              '          : null);\n'
          )
          frontier_block = continuity_block + (
              '        const minScaleFit = strictMinScaleFit ?? (!anyStrictFit && emergency && !last\n'
              '          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, true, false, language, "min-scale")\n'
              '          : null);\n'
              '        const maxScaleFit = strictMaxScaleFit ?? (!anyStrictFit && emergency && !last\n'
              '          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, true, false, language, "max-scale")\n'
              '          : null);\n'
              '        const neutralFit = strictNeutralFit ?? (!anyStrictFit && emergency && !last\n'
              '          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, true, false, language, "neutral-spacing")\n'
              '          : null);\n'
          )
          replace_once(continuity_block, frontier_block, "relaxed frontier insertion")

          replace_once(
              '        if (natural > available + 0.75 && !fit && !continuityFit && (end > start || last)) {',
              '        if (natural > available + 0.75 && !fit && !continuityFit && !minScaleFit && !maxScaleFit && !neutralFit && (end > start || last)) {',
              "overfull gate",
          )
          replace_once(
              '        const emergencyRescue = allowNaturalRescue && !last && !fit && !continuityFit && natural <= available + 0.75;',
              '        const emergencyRescue = allowNaturalRescue && !last && !fit && !continuityFit && !minScaleFit && !maxScaleFit && !neutralFit && natural <= available + 0.75;',
              "rescue gate",
          )

          old_options = (
              '        const fitOptions: Array<LineFit | null> = [];\n'
              '        if (fit) fitOptions.push(fit);\n'
              '        if (continuityFit && !fitOptions.some((candidate) =>\n'
              '          candidate\n'
              '          && Math.abs(candidate.glyphScale - continuityFit.glyphScale) < 0.000001\n'
              '          && Math.abs(candidate.wordSpacing - continuityFit.wordSpacing) < 0.000001\n'
              '          && Math.abs(candidate.tracking - continuityFit.tracking) < 0.000001\n'
              '        )) fitOptions.push(continuityFit);\n'
              '        if (!fitOptions.length && (last || rescueNatural)) fitOptions.push(null);\n'
              '        const hasStrictFit = Boolean(strictFit || strictContinuityFit);\n'
          )
          new_options = (
              '        const fitOptions: Array<LineFit | null> = [];\n'
              '        const addFit = (candidate: LineFit | null): void => {\n'
              '          if (!candidate) return;\n'
              '          if (!fitOptions.some((existing) => existing\n'
              '            && Math.abs(existing.glyphScale - candidate.glyphScale) < 0.000001\n'
              '            && Math.abs(existing.wordSpacing - candidate.wordSpacing) < 0.000001\n'
              '            && Math.abs(existing.tracking - candidate.tracking) < 0.000001)) fitOptions.push(candidate);\n'
              '        };\n'
              '        addFit(fit);\n'
              '        addFit(continuityFit);\n'
              '        addFit(minScaleFit);\n'
              '        addFit(maxScaleFit);\n'
              '        addFit(neutralFit);\n'
              '        if (!fitOptions.length && (last || rescueNatural)) fitOptions.push(null);\n'
              '        const hasStrictFit = anyStrictFit;\n'
          )
          replace_once(old_options, new_options, "fit frontier options")

          path.write_text(text, encoding="utf-8")
          print("Applied frontier compositor patch")
          PY
      - name: Patch Paperwhite geometry and sample language in runner only
        shell: bash
        env:
          SIDE: ${{ matrix.side }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          preview = Path("web/src/preview-runtime.ts")
          text = preview.read_text(encoding="utf-8")
          pattern = r'("kindle-paperwhite": \{ width: 412, height: 549, baseFont: )\d+(?:\.\d+)?(, padding: \[34, )\d+(, 46, )\d+(\], wordsPerPage: 270 \},)'
          replacement = rf'\g<1>{os.environ["BASE_FONT"]}\g<2>{os.environ["SIDE"]}\g<3>{os.environ["SIDE"]}\g<4>'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("Paperwhite profile not found exactly once")
          preview.write_text(text, encoding="utf-8")

          sample = Path("samples/clockwork-garden/book.yaml")
          sample_text = sample.read_text(encoding="utf-8")
          if "language: en" not in sample_text:
              raise SystemExit("Sample language marker missing")
          sample.write_text(sample_text.replace("language: en", "language: pl", 1), encoding="utf-8")
          PY
      - name: Trim visual harness to Polish composition only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/v107-visual-qa.ts")
          text = path.read_text(encoding="utf-8")
          if '  await setLanguage("pl");\n' not in text:
              raise SystemExit("setLanguage marker missing")
          text = text.replace('  await setLanguage("pl");\n', '', 1)
          marker = '  await setDropcap(true);\n'
          finally_marker = '} finally {\n'
          if marker not in text or finally_marker not in text:
              raise SystemExit("Polish-only harness markers missing")
          prefix = text.split(marker, 1)[0]
          suffix = finally_marker + text.split(finally_marker, 1)[1]
          path.write_text(prefix + '  console.log(JSON.stringify({ dimensions, polishReport }, null, 2));\n' + suffix, encoding="utf-8")
          PY
      - run: npm run typecheck
      - run: npm run build
      - name: Run Polish reference corpus
        shell: bash
        run: |
          set +e
          node --import tsx scripts/v107-visual-qa.ts > "build/frontier-${{ matrix.side }}.log" 2>&1
          status=$?
          echo "QA exit: $status"
          tail -n 35 "build/frontier-${{ matrix.side }}.log"
          exit 0
      - name: Print compact Polish metrics
        if: always()
        shell: bash
        env:
          SIDE: ${{ matrix.side }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const side = process.env.SIDE;
          const p = 'build/qa-v107/typesetting-polish.json';
          if (!fs.existsSync(p)) {
            console.log(JSON.stringify({side, missing: true}));
            process.exit(0);
          }
          const q = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            side,
            measurePx: q.measurePx,
            emergencyLines: q.emergencyLines,
            oneWordFinalLines: q.oneWordFinalLines,
            relaxedLines: q.relaxedLines,
            hyphenRate: q.hyphenRate,
            maxHyphenStreak: q.maxHyphenStreak,
            maxRightErrorPx: q.maxRightErrorPx,
            maxWordSpacingEm: q.maxWordSpacingEm,
            maxStrictWordSpacingEm: q.maxStrictWordSpacingEm,
            maxRelaxedWordSpacingEm: q.maxRelaxedWordSpacingEm,
            maxTrackingEm: q.maxTrackingEm,
            maxGlyphScaleDelta: q.maxGlyphScaleDelta,
            maxAdjacentGlyphScaleDelta: q.maxAdjacentGlyphScaleDelta,
            maxSemanticGapEm: q.maxSemanticGapEm,
            maxAdjacentSpacingDeltaEm: q.maxAdjacentSpacingDeltaEm,
            emergencyText: (q.emergencyDetails || []).map(x => x.text),
          }));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Paperwhite-fit-frontier-${{ matrix.side }}
          path: |
            build/qa-v107/typesetting-polish.json
            build/qa-v107/reader-polish.png
            build/frontier-${{ matrix.side }}.log
          if-no-files-found: warn
