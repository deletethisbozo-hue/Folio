name: Patch v1.0.7 language preview synchronization

on:
  push:
    branches:
      - fix/v1.0.7
    paths:
      - .github/workflows/v107-fix-language-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
          fetch-depth: 0

      - name: Patch language preview synchronization
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/v107-theme-matrix.ts")
          text = path.read_text(encoding="utf-8")

          target = '''    await page.evaluate((value) => {
      const row = [...document.querySelectorAll(".dialog-field")].find((node) => node.querySelector("span")?.textContent === "Language");
      const input = row?.querySelector("input") as HTMLInputElement | null;
      if (!input) throw new Error("Language field is missing");
      const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value")!.set!;'''

          replacement = '''    const currentLanguage = await page.evaluate(() => {
      const row = [...document.querySelectorAll(".dialog-field")].find((node) => node.querySelector("span")?.textContent === "Language");
      const input = row?.querySelector("input") as HTMLInputElement | null;
      if (!input) throw new Error("Language field is missing");
      return input.value;
    });
    const previewStarted = currentLanguage === language ? null : page.waitForSelector(".preview-loading", { visible: true });
    await page.evaluate((value) => {
      const row = [...document.querySelectorAll(".dialog-field")].find((node) => node.querySelector("span")?.textContent === "Language");
      const input = row?.querySelector("input") as HTMLInputElement | null;
      if (!input) throw new Error("Language field is missing");
      const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value")!.set!;'''

          tail = '''    if (!bookDetailsClosed) throw new Error("Book Details dialog did not close after 3 programmatic attempts");
    await settlePreview();'''
          tail_replacement = '''    if (!bookDetailsClosed) throw new Error("Book Details dialog did not close after 3 programmatic attempts");
    if (previewStarted) await previewStarted;
    await settlePreview();'''

          if text.count(target) != 1:
              raise SystemExit(f"expected one language setter target, found {text.count(target)}")
          if text.count(tail) != 1:
              raise SystemExit(f"expected one language settle target, found {text.count(tail)}")

          text = text.replace(target, replacement, 1).replace(tail, tail_replacement, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/v107-fix-language-sync.yml").unlink()
          PY

      - name: Commit synchronization fix and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v107-theme-matrix.ts .github/workflows/v107-fix-language-sync.yml
          git diff --cached --check
          git commit -m "Fix v1.0.7 language preview synchronization"
          git push origin HEAD:fix/v1.0.7
