name: Prepare Folio 2.1.3 theme patch
# rerun after 19-theme UI contract update

on:
  push:
    branches:
      - release/2.1.3-themes
    paths:
      - .github/workflows/prepare-v213-themes.yml

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[skip prepare]') }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\\build\\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\\build\\pandoc\\pandoc.exe
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Embed approved theme artwork
        shell: python
        run: |
          import base64
          import pathlib
          import urllib.request

          assets = {
              "amour": "https://cdn.pixabay.com/photo/2022/12/30/02/22/design-7686051_1280.png",
              "seance": "https://cdn.pixabay.com/photo/2022/08/14/01/32/hand-7384733_1280.png",
              "memoir": "https://cdn.pixabay.com/photo/2019/05/27/23/56/vintage-4234040_1280.png",
              "gothic": "https://cdn.pixabay.com/photo/2022/09/28/17/22/ornament-7485579_1280.png",
              "scriptorium": "https://cdn.pixabay.com/photo/2020/05/11/03/40/vintage-5156335_1280.png",
              "arcana": "https://cdn.pixabay.com/photo/2022/06/16/01/32/knight-7264868_1280.png",
          }
          for theme, url in assets.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              if len(data) < 1000:
                  raise RuntimeError(f"{theme} artwork download is suspiciously small: {len(data)}")
              p = pathlib.Path("themes") / theme / "theme.css"
              css = p.read_text(encoding="utf-8")
              if "__ASSET_DATA__" not in css:
                  raise RuntimeError(f"Missing asset placeholder in {p}")
              uri = "data:image/png;base64," + base64.b64encode(data).decode("ascii")
              p.write_text(css.replace("__ASSET_DATA__", uri), encoding="utf-8")
              print(theme, len(data))

      - name: Bump package version
        run: npm version 2.1.3 --no-git-tag-version

      - name: Update Windows release gate and notes
        shell: python
        run: |
          import pathlib
          p = pathlib.Path(".github/workflows/windows-release.yml")
          s = p.read_text(encoding="utf-8")
          s = s.replace("Verify Folio 2.1.2 version consistency", "Verify Folio 2.1.3 version consistency")
          s = s.replace('if ($version -ne "2.1.2")', 'if ($version -ne "2.1.3")')
          s = s.replace('if ($themes.Count -ne 13)', 'if ($themes.Count -ne 19)')
          s = s.replace('exactly 13 curated themes', 'exactly 19 curated themes')
          lines = s.splitlines()
          note = '          --notes "Folio 2.1.3 adds six new curated book themes: Amour for airy romance, Séance for occult fiction, Memoir for archival and biographical interiors, Gothic for ecclesiastical blackletter styling, Scriptorium for codex-inspired manuscript design, and Arcana for dark fantasy. The new themes use isolated drop-cap sizing so existing themes and the global compositor remain unchanged. Gothic preserves the Cathedral arch language, Scriptorium preserves Blackletter display typography, and the approved illustrated openers are embedded directly in the packaged theme CSS for offline reliability. The release remains gated by typecheck, the complete formatter/UI suite, visual/typesetting QA, Print PDF matrix, packaged smoke tests, export checks and SHA-256 hashing."'
          lines = [note if '--notes "' in line else line for line in lines]
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Verify release inputs
        shell: bash
        run: |
          ! grep -R "__ASSET_DATA__" themes/amour themes/seance themes/memoir themes/gothic themes/scriptorium themes/arcana
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='2.1.3'||l.version!=='2.1.3'||l.packages[''].version!=='2.1.3') process.exit(1)"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable missing." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install Chromium runtime
        shell: pwsh
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit prepared patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/windows-release.yml
          git add package.json package-lock.json themes/amour/theme.css themes/seance/theme.css themes/memoir/theme.css themes/gothic/theme.css themes/scriptorium/theme.css themes/arcana/theme.css
          git commit -m "Prepare Folio 2.1.3 theme patch"
          git push origin HEAD:release/2.1.3-themes
