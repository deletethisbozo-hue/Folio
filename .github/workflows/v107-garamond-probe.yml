name: Folio 1.0.7 EB Garamond probe

on:
  push:
    branches: ["ops/v107-hyphen-density"]
    paths:
      - ".github/workflows/v107-garamond-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName build\pandoc\pandoc.exe
      - name: Install pinned Chromium runtime
        run: npx puppeteer browsers install chrome-headless-shell
      - name: Harden final-line widow rule
        run: python scripts/probe-hard-final-widow.py
      - name: Probe bundled EB Garamond
        shell: pwsh
        run: |
          $fontPath = "build\EBGaramond.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf" -OutFile $fontPath
          if ((Get-Item $fontPath).Length -lt 100000) { throw "EB Garamond download looks invalid" }
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $fontPath)))
          $path = "themes/decorative/theme.css"
          $original = Get-Content $path -Raw
          $needle = 'body {' + "`n" + '  font-family: "Hoefler Text", Baskerville, "Palatino Linotype", Palatino,' + "`n" + '    Georgia, serif;' + "`n" + '}'
          if (-not $original.Contains($needle)) { throw "Decorative body font stack target missing" }
          $replacement = '@font-face {' + "`n" + '  font-family: "Folio EB Garamond";' + "`n" + '  src: url("data:font/ttf;base64,' + $b64 + '") format("truetype");' + "`n" + '  font-style: normal;' + "`n" + '  font-weight: 400 800;' + "`n" + '}' + "`n`n" + 'body {' + "`n" + '  font-family: "Folio EB Garamond", serif;' + "`n" + '}'
          $content = $original.Replace($needle, $replacement)
          [IO.File]::WriteAllText((Resolve-Path $path), $content, [Text.UTF8Encoding]::new($false))
          npm run build:web
          node --import tsx scripts/v107-visual-qa.ts
