name: Apply v1.0.7 product fixes

on:
  push:
    branches:
      - fix/v1.0.7
    paths:
      - .github/workflows/v107-apply-product.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
          fetch-depth: 0
      - name: Apply product patch
        run: python3 scripts/apply-v107-stability.py
      - name: Keep workflow files unchanged
        run: git restore .github/workflows/v107-windows-qualification.yml .github/workflows/windows-release.yml
      - name: Remove patch script
        run: rm -f scripts/apply-v107-stability.py
      - name: Commit and push product fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/compositor.ts scripts/v107-visual-qa.ts scripts/v107-theme-matrix.ts tests/ui-runtime.test.ts server/pipeline/render-blues.ts scripts/apply-v107-stability.py
          git diff --cached --check
          git commit -m "Stabilize v1.0.7 composition and qualification"
          git push origin HEAD:fix/v1.0.7
