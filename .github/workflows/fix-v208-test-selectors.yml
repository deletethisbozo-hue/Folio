name: Update v2.0.8 browser test selectors

on:
  push:
    branches:
      - fix/v2.0.8-ui-style-image-export

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.8-ui-style-image-export
          fetch-depth: 0
      - name: Replace obsolete top Add selectors in tests
        shell: python
        run: |
          from pathlib import Path
          changed = []
          for path in Path('tests').rglob('*.ts'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('[data-command="add"]', '.library-add-section')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('changed:', ', '.join(changed) or 'none')
          leftovers = []
          for path in Path('tests').rglob('*.ts'):
              if '[data-command="add"]' in path.read_text(encoding='utf-8'):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('obsolete Add selector remains in: ' + ', '.join(leftovers))
      - name: Commit test updates if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests; then
            echo "No test selector updates needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Update browser tests for sidebar Add Section"
          git push origin HEAD:fix/v2.0.8-ui-style-image-export
