name: Folio 1.0.7 Windows geometry probe

on:
  push:
    branches: ["ops/v107-hyphen-density"]
    paths:
      - ".github/workflows/v107-windows-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-v107-windows-geometry-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName build\pandoc\pandoc.exe
      - name: Install pinned Chromium runtime
        run: npx puppeteer browsers install chrome-headless-shell
      - name: Probe Paperwhite side insets on Windows
        shell: pwsh
        run: |
          $path = "web/src/preview-runtime.ts"
          $original = Get-Content $path -Raw
          $needle = '"kindle-paperwhite": { width: 412, height: 549, baseFont: 17.5, padding: [34, 28, 46, 28], wordsPerPage: 270 }'
          if (-not $original.Contains($needle)) { throw "Paperwhite profile probe target missing" }
          foreach ($pad in @(30, 34, 38, 42)) {
            Write-Host "===== PROBE pad=$pad ====="
            $replacement = '"kindle-paperwhite": { width: 412, height: 549, baseFont: 17.5, padding: [34, ' + $pad + ', 46, ' + $pad + '], wordsPerPage: 270 }'
            $content = $original.Replace($needle, $replacement)
            [IO.File]::WriteAllText((Resolve-Path $path), $content, [Text.UTF8Encoding]::new($false))
            npm run build:web | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "build:web failed for pad=$pad" }
            $log = "build\geometry-probe-pad-$pad.log"
            node --import tsx scripts/v107-visual-qa.ts *> $log
            $code = $LASTEXITCODE
            $match = Select-String -Path $log -Pattern 'typesetting-polish failed typographic QA|hyphenRate|Node.js v' | Select-Object -Last 3
            if ($match) { $match | ForEach-Object { Write-Host $_.Line } }
            if ($code -eq 0) { Write-Host "PROBE_RESULT pad=$pad PASS" } else { Write-Host "PROBE_RESULT pad=$pad FAIL" }
          }
          [IO.File]::WriteAllText((Resolve-Path $path), $original, [Text.UTF8Encoding]::new($false))
          exit 0
      - name: Upload probe logs
        uses: actions/upload-artifact@v4
        with:
          name: v107-windows-geometry-probe
          path: build/geometry-probe-*.log
          if-no-files-found: error
