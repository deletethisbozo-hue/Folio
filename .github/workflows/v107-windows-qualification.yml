name: Folio 1.0.7 Windows hyphenation probe

on:
  push:
    branches: ["ops/v107-hyphen-density"]
    paths:
      - ".github/workflows/v107-windows-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-v107-windows-hyphenation-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName build\pandoc\pandoc.exe
      - name: Install pinned Chromium runtime
        run: npx puppeteer browsers install chrome-headless-shell
      - name: Probe Polish hyphenation limits on Windows
        shell: pwsh
        run: |
          $path = "web/src/hyphenation.ts"
          $original = Get-Content $path -Raw
          $needle = 'pl: { minimumWord: 4, left: 2, right: 2 },'
          if (-not $original.Contains($needle)) { throw "Polish hyphenation probe target missing" }
          $variants = @(
            @{ Name = "l3-r2-m4"; Line = 'pl: { minimumWord: 4, left: 3, right: 2 },' },
            @{ Name = "l2-r3-m4"; Line = 'pl: { minimumWord: 4, left: 2, right: 3 },' },
            @{ Name = "l3-r3-m4"; Line = 'pl: { minimumWord: 4, left: 3, right: 3 },' },
            @{ Name = "l3-r2-m5"; Line = 'pl: { minimumWord: 5, left: 3, right: 2 },' }
          )
          foreach ($variant in $variants) {
            Write-Host "===== PROBE $($variant.Name) ====="
            $content = $original.Replace($needle, $variant.Line)
            [IO.File]::WriteAllText((Resolve-Path $path), $content, [Text.UTF8Encoding]::new($false))
            npm run build:web | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "build:web failed for $($variant.Name)" }
            $log = "build\hyphenation-probe-$($variant.Name).log"
            node --import tsx scripts/v107-visual-qa.ts *> $log
            $code = $LASTEXITCODE
            $match = Select-String -Path $log -Pattern 'failed typographic QA|hyphenRate|oneWordFinalLines|TimeoutError|Error:' | Select-Object -Last 4
            if ($match) { $match | ForEach-Object { Write-Host $_.Line } }
            if ($code -eq 0) { Write-Host "PROBE_RESULT $($variant.Name) PASS" } else { Write-Host "PROBE_RESULT $($variant.Name) FAIL" }
          }
          [IO.File]::WriteAllText((Resolve-Path $path), $original, [Text.UTF8Encoding]::new($false))
          exit 0
      - name: Upload probe logs
        uses: actions/upload-artifact@v4
        with:
          name: v107-windows-hyphenation-probe
          path: build/hyphenation-probe-*.log
          if-no-files-found: error
