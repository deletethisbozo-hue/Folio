name: Folio editorial grid v5 preview

on:
  push:
    branches: ["design/folio-editorial-grid-v5"]
    paths:
      - "web/**"
      - "scripts/capture-editorial-grid-v5.ts"
      - ".github/workflows/editorial-grid-v5-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-editorial-grid-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Writing Studio smoke
        run: node --import tsx tests/write-studio-ui.test.ts
      - name: Capture editorial grid preview
        run: node --import tsx scripts/capture-editorial-grid-v5.ts
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Folio-editorial-grid-v5
          path: artifacts/folio-editorial-grid-v5.png
          if-no-files-found: error
          retention-days: 14
