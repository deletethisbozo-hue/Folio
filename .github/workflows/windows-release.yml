name: Build and Release Folio for Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/prepare-v1012.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe
