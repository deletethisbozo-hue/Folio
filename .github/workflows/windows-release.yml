name: Build and Release Folio for Windows

on:
  push:
    branches: [main, fix/2.3.2-icons-split-alignment, experiment/ulysses-liquid-glass, fix/midnight-2.5]
    paths-ignore:
      - .github/workflows/prepare-v1012.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-windows-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out Folio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Folio 2.8.5 version consistency
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "2.8.5") { throw "Windows release is scoped to Folio 2.8.5, found $version." }
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!==l.version||p.version!==l.packages[''].version) throw new Error('package.json/package-lock.json version mismatch')"
          if ($LASTEXITCODE -ne 0) { throw "Version consistency check failed." }
          node -e "const p=require('./package.json'); if(p.build.win.icon!=='build/folio.ico' || !p.build.files.includes('build/folio.ico') || p.build.fileAssociations.some(a=>a.icon!=='folio.ico')) throw new Error('Windows icon wiring is not using the generated Folio ICO')"
          if ($LASTEXITCODE -ne 0) { throw "Windows ICO configuration validation failed." }
          if (-not (Test-Path "assets\najnowszaikona.ico")) { throw "Approved Folio ICO is missing." }
          $glyphHash = (Get-FileHash "assets\najnowszaikona.ico" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($glyphHash -ne "cefa1effb655c1c6f63db9d06143dea4d4e137bdbcf6b48d6347c51fe389b0a9") { throw "Approved Folio ICO checksum mismatch: $glyphHash" }
          "FOLIO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Refuse an existing immutable version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:FOLIO_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Refusing to delete or replace it; bump the version." }
          $global:LASTEXITCODE = 0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists. Refusing to move or replace it; bump the version." }
          $global:LASTEXITCODE = 0

      - name: Download pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc 3.11 checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable was not found after extraction." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe
          $license = Get-ChildItem build\pandoc-unpack -Include COPYING*,LICENSE* -File -Recurse | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName build\pandoc\PANDOC_LICENSE.txt }
          & build\pandoc\pandoc.exe --version | Select-Object -First 1

      - name: Download pinned Chromium runtime
        shell: pwsh
        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "152\.0\.7977\.75" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell 152.0.7977.75 was not installed." }
          $chrome.FullName

      - name: Typecheck
        run: npm run typecheck

      - name: Full formatter and UI suite on Windows
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Full test suite attempt $attempt/$maxAttempts"
            npm test
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) { throw "Full formatter/UI suite failed after $maxAttempts attempts." }
            Write-Warning "Transient browser-test failure; retrying the complete suite."
            Start-Sleep -Seconds 5
          }

      - name: Build web and server
        run: npm run build

      - name: Writing Studio interaction and screenshot QA
        run: node --import tsx scripts/v210-writing-studio-preview.ts

      - name: Capture visual and typesetting QA on Windows
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Visual/typesetting QA attempt $attempt/$maxAttempts"
            node --import tsx scripts/v107-visual-qa.ts
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) { throw "Visual/typesetting QA failed after $maxAttempts attempts." }
            Write-Warning "Transient render timing failure; retrying visual QA."
            Start-Sleep -Seconds 5
          }

      - name: Upload UI screenshots
        if: always() && (github.ref == 'refs/heads/experiment/ulysses-liquid-glass' || github.ref == 'refs/heads/fix/midnight-2.5')
        uses: actions/upload-artifact@v4
        with:
          name: Folio-UI-Preview
          path: |
            build/qa-v210-writing-studio/*.png
            build/qa-v107/*.png
          if-no-files-found: error

      - name: Full Print PDF trim matrix with physical gap gate
        run: node --import tsx scripts/print-matrix-qa.ts

      - name: Stage and validate approved Folio ICO
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item "assets\najnowszaikona.ico" "build\folio.ico" -Force
          $expected = "cefa1effb655c1c6f63db9d06143dea4d4e137bdbcf6b48d6347c51fe389b0a9"
          $source = (Get-FileHash "assets\najnowszaikona.ico" -Algorithm SHA256).Hash.ToLowerInvariant()
          $staged = (Get-FileHash "build\folio.ico" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($source -ne $expected -or $staged -ne $expected) { throw "Folio ICO changed during staging. source=$source staged=$staged" }
          $bytes = [IO.File]::ReadAllBytes("build\folio.ico")
          if ($bytes.Length -lt 6 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0 -or [BitConverter]::ToUInt16($bytes, 2) -ne 1 -or [BitConverter]::ToUInt16($bytes, 4) -ne 9) { throw "Approved Folio ICO header/frame count is invalid." }
          Write-Host "Using exact approved Folio ICO ($staged)"

      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Smoke-test packaged Folio
        shell: pwsh
        run: |
          $env:FOLIO_E2E_PORT = "43127"
          $env:FOLIO_E2E_DEBUG_PORT = "43128"
          $exe = Resolve-Path "release\Folio-$env:FOLIO_VERSION-portable.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $base = "http://127.0.0.1:43127"
            $health = $null
            for ($i = 0; $i -lt 120; $i++) {
              try { $health = Invoke-RestMethod "$base/api/health"; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $health -or -not $health.ok -or -not $health.pandoc.ok) { throw "Packaged /api/health did not become ready with bundled Pandoc." }

            node scripts\packaged-ui-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Packaged UI smoke failed." }

            $themes = Invoke-RestMethod "$base/api/themes"
            if ($themes.Count -ne 13) { throw "Folio packaged app must expose exactly 13 curated themes, found $($themes.Count)." }

            $sample = Invoke-RestMethod -Method Post -ContentType "application/json" -Body "{}" "$base/api/sample"
            $chapter = $sample.sections | Where-Object { $_.kind -eq "chapter" } | Select-Object -First 1
            if (-not $chapter) { throw "Packaged sample has no chapter." }

            $coverPath = Join-Path $env:TEMP "folio-packaged-cover.png"
            [IO.File]::WriteAllBytes($coverPath, [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="))
            $covered = Invoke-RestMethod -Method Post -Form @{ cover = Get-Item $coverPath } "$base/api/projects/$($sample.projectId)/cover"
            if (-not $covered.hasCover) { throw "Packaged cover upload failed." }

            $sectionId = [uri]::EscapeDataString($chapter.id)
            $draft = "Packaged preview probe: live text before autosave."
            $previewBody = @{ meta = $sample.meta; theme = "blackletter"; typography = @{}; previewSectionId = $chapter.id; draft = $draft } | ConvertTo-Json -Depth 10
            $preview = Invoke-RestMethod -Method Post -ContentType "application/json" -Body $previewBody "$base/api/projects/$($sample.projectId)/preview"
            if ($preview.html -notmatch "ackaged preview probe" -or $preview.html -notmatch "Folio Grenze Gotisch") { throw "Packaged live preview omitted draft text or theme CSS." }

            $saveBody = @{ markdown = "$draft`n`nSaved copy-on-write." } | ConvertTo-Json
            $saved = Invoke-RestMethod -Method Put -ContentType "application/json" -Body $saveBody "$base/api/projects/$($sample.projectId)/sections/$sectionId"
            if ($saved.markdown -notmatch "Saved copy-on-write") { throw "Packaged sample PUT failed." }

            $addBody = @{ title = "Packaged Added Chapter"; meta = $sample.meta } | ConvertTo-Json -Depth 10
            $withAdded = Invoke-RestMethod -Method Post -ContentType "application/json" -Body $addBody "$base/api/projects/$($sample.projectId)/chapters"
            $added = $withAdded.sections | Where-Object { $_.title -eq "Packaged Added Chapter" } | Select-Object -First 1
            if (-not $added) { throw "Packaged chapter add failed." }
            $addedId = [uri]::EscapeDataString($added.id)
            $renameBody = @{ title = "Packaged Renamed Chapter" } | ConvertTo-Json
            $renamed = Invoke-RestMethod -Method Patch -ContentType "application/json" -Body $renameBody "$base/api/projects/$($sample.projectId)/sections/$addedId"
            if ($renamed.title -ne "Packaged Renamed Chapter") { throw "Packaged chapter rename failed." }
            $renamedId = [uri]::EscapeDataString($renamed.id)
            $deleted = Invoke-RestMethod -Method Delete "$base/api/projects/$($sample.projectId)/sections/$renamedId"
            if (-not $deleted.ok) { throw "Packaged chapter delete failed." }

            $current = Invoke-RestMethod -Method Post -ContentType "application/json" -Body "{}" "$base/api/projects/$($sample.projectId)/reload"
            $currentChapter = $current.sections | Where-Object { $_.kind -eq "chapter" -and $_.title -eq $saved.title } | Select-Object -First 1
            if (-not $currentChapter) { throw "Packaged sample lost the originally edited chapter after structural mutations." }
            $printBody = @{ meta = $current.meta; theme = "literary"; typography = @{}; previewSectionId = $currentChapter.id; draft = $draft; print = @{ trim = "6x9"; binding = "paperback"; startChaptersRecto = $true; layout = "author-title-bottom" } } | ConvertTo-Json -Depth 10
            $printPreview = Invoke-RestMethod -Method Post -ContentType "application/json" -Body $printBody "$base/api/projects/$($sample.projectId)/preview-print"
            if ($printPreview.pages -lt 1 -or [string]$printPreview.html -notmatch "pagedjs_page") { throw "Packaged print-preview endpoint did not return paginated pages." }

            foreach ($format in @("epub", "pdf", "print")) {
              $body = @{ format = $format; meta = $current.meta; theme = "literary" }
              if ($format -eq "epub") { $body["preset"] = "kdp" }
              if ($format -eq "print") { $body["print"] = @{ trim = "6x9"; binding = "paperback"; startChaptersRecto = $true; layout = "author-title-bottom" } }
              $export = Invoke-RestMethod -Method Post -ContentType "application/json" -Body ($body | ConvertTo-Json -Depth 10) "$base/api/projects/$($sample.projectId)/export"
              if ($export.bytes -lt 1000 -or [string]::IsNullOrWhiteSpace($export.dataBase64)) { throw "Packaged $format export is empty." }
            }
          }
          finally {
            Get-Process Folio -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Hash release binaries
        shell: pwsh
        run: |
          $required = @("release\Folio-$env:FOLIO_VERSION-setup.exe", "release\Folio-$env:FOLIO_VERSION-portable.exe")
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing release asset: $file" }
            if ((Get-Item $file).Length -lt 1MB) { throw "Release asset is unexpectedly small: $file" }
          }
          $lines = Get-FileHash $required -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" }
          $lines | Set-Content -Encoding ascii release\sha256.txt
          Get-Content release\sha256.txt

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Folio-${{ env.FOLIO_VERSION }}-Windows
          path: |
            release/Folio-${{ env.FOLIO_VERSION }}-setup.exe
            release/Folio-${{ env.FOLIO_VERSION }}-portable.exe
            release/sha256.txt
            build/qa-v107/*
            build/qa-print-matrix/*
            build/qa-v210-writing-studio/*
          if-no-files-found: error

      - name: Publish immutable GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:FOLIO_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag appeared during the build. Refusing to delete or replace it." }
          $global:LASTEXITCODE = 0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag appeared during the build. Refusing to move or replace it." }
          $global:LASTEXITCODE = 0
          gh release create $tag `
            "release\Folio-$env:FOLIO_VERSION-setup.exe" `
            "release\Folio-$env:FOLIO_VERSION-portable.exe" `
            "release\sha256.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target "$env:GITHUB_SHA" `
            --title "Folio $env:FOLIO_VERSION for Windows" `
            --notes "Folio 2.8.5 balances Typewriter Sound and fixes two Writing Studio/Halo layout regressions. Output at 100% is substantially louder, Classic/Soft/Mechanical are deliberately separated by rate and EQ, and the harsh over-loud Backspace ratchet path has been retired in favor of lower-gain style-specific Backspace profiles. Writing Studio now stacks above editor chrome and Folio Halo, while Halo is shell-rooted with viewport coordinates so Light/Midnight switching cannot change its position or size. The Windows build is gated by typecheck, the formatter/UI suite with retries, Writing Studio QA, Windows visual/typesetting QA, the Print PDF matrix, packaged-app smoke tests, export checks and SHA-256 hashing."
