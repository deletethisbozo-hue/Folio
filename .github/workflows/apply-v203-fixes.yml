name: Apply Folio 2.0.3 fixes

on:
  push:
    branches:
      - fix/v2.0.3-ui-frontmatter-cover

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        run: |
          curl -fsSL https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz -o /tmp/pandoc.tar.gz
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          echo "PANDOC_BIN=/tmp/pandoc-3.11/bin/pandoc" >> "$GITHUB_ENV"
          /tmp/pandoc-3.11/bin/pandoc --version | head -n 1
      - run: node scripts/apply-v203-fixes.mjs
      - run: node scripts/apply-v203-typefix.mjs
      - run: npm run typecheck
      - run: npm run build:web
      - name: Focused regression tests
        run: npm test -- image-page ui-runtime
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api.ts web/src/api.ts web/src/rich-text.ts web/src/App.tsx web/src/main.tsx themes/base.css
          git commit -m "Fix workspace UI, cover preview and front matter illustrations"
          git push
