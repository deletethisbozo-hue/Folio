name: Apply Folio 2.0 cover workspace patch

on:
  push:
    branches: ["release/v2.0.0"]
    paths:
      - ".github/workflows/v2-cover-patch.yml"
      - "scripts/apply-v2-cover-workspace.mjs"

permissions:
  contents: write

concurrency:
  group: folio-v2-cover-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply deterministic App patch
        run: node scripts/apply-v2-cover-workspace.mjs
      - name: Commit patched workspace
        shell: bash
        run: |
          if git diff --quiet -- web/src/App.tsx; then
            echo "No App.tsx changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx
          git commit -m "Add cover workspace and preview to Folio 2.0"
          git push origin HEAD:release/v2.0.0
