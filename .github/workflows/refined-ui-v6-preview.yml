name: Folio refined UI v6 preview

on:
  push:
    branches: ["design/folio-refined-ui-v6"]
    paths:
      - "web/**"
      - "scripts/capture-refined-ui-v6.ts"
      - ".github/workflows/refined-ui-v6-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-refined-ui-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Writing Studio smoke
        run: node --import tsx tests/write-studio-ui.test.ts
      - name: Capture refined UI preview
        run: node --import tsx scripts/capture-refined-ui-v6.ts
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Folio-refined-ui-v6
          path: artifacts/folio-refined-ui-v6.png
          if-no-files-found: error
          retention-days: 14
