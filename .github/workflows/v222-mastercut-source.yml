name: Capture Folio Mastercut Source

on:
  push:
    branches:
      - promo/v2.2.2-mastercut
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out Folio
        uses: actions/checkout@v4

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable missing." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install Chromium
        shell: pwsh
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Build Folio
        run: npm run build

      - name: Capture clean source scenes
        run: node --import tsx scripts/v222-mastercut-source.ts

      - name: Ensure FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }

      - name: Encode source scenes
        shell: pwsh
        run: |
          $root = "build/promo-mastercut-source"
          Get-ChildItem $root -Directory | ForEach-Object {
            $name = $_.Name
            ffmpeg -y -framerate 30 -i "$($_.FullName)/frame-%05d.jpg" -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p -movflags +faststart "$root/$name.mp4"
          }

      - name: Upload source scenes
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Mastercut-Source
          path: |
            build/promo-mastercut-source/*.mp4
            build/promo-mastercut-source/poster-source.png
            build/promo-mastercut-source/themes.json
          if-no-files-found: error
          compression-level: 0
