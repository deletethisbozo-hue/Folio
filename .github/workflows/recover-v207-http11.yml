name: Recover Folio 2.0.7 Release over HTTP1

on:
  push:
    branches:
      - release/v2.0.7-http11-recovery

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_RUN: "35247596282"
      PREVIOUS_RECOVERY_RUN: "35250826861"
      RECOVERY_RELEASE_ID: "390905988"
      TAG: "v2.0.7"
      TARGET_SHA: "16d57b5cb2b39293af9a5788686d7b18f5eef6ee"
      EXPECTED_SETUP_SHA: "17c2401fb9a52419e8b6c0b8805698c62e2e547f67d387b79fb32f42461566b7"
      EXPECTED_PORTABLE_SHA: "2233b26a7e4c930a7fa71cab104130ed832e592b8b647173e47d350be10dde00"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for previous recovery run to stop
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            status="$(gh run view "$PREVIOUS_RECOVERY_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
            echo "previous recovery status: $status"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Previous recovery run did not stop within 30 minutes" >&2
          exit 1

      - name: Download already-qualified Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "Folio-2.0.7-Windows" --dir recovered
          find recovered -maxdepth 6 -type f -printf '%p %s bytes\n' | sort

      - name: Verify recovered binaries
        shell: bash
        run: |
          set -euo pipefail
          setup="$(find recovered -type f -name 'Folio-2.0.7-setup.exe' -print -quit)"
          portable="$(find recovered -type f -name 'Folio-2.0.7-portable.exe' -print -quit)"
          sums="$(find recovered -type f -name 'sha256.txt' -print -quit)"
          test -n "$setup" && test -s "$setup"
          test -n "$portable" && test -s "$portable"
          test -n "$sums" && test -s "$sums"

          actual_setup="$(sha256sum "$setup" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')"
          actual_portable="$(sha256sum "$portable" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')"

          echo "setup sha256: $actual_setup"
          echo "portable sha256: $actual_portable"

          test "$actual_setup" = "$EXPECTED_SETUP_SHA"
          test "$actual_portable" = "$EXPECTED_PORTABLE_SHA"
          test "$(stat -c%s "$setup")" = "372564687"
          test "$(stat -c%s "$portable")" = "372330472"
          grep -qi "$EXPECTED_SETUP_SHA" "$sums"
          grep -qi "$EXPECTED_PORTABLE_SHA" "$sums"

          printf 'SETUP=%s\nPORTABLE=%s\nSUMS=%s\nSETUP_SHA=%s\nPORTABLE_SHA=%s\n' \
            "$setup" "$portable" "$sums" "$actual_setup" "$actual_portable" >> "$GITHUB_ENV"

      - name: Validate exact recovery draft
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID" > release.json
          jq -e --arg tag "$TAG" --arg target "$TARGET_SHA" '
            .tag_name == $tag and
            .target_commitish == $target and
            .draft == true and
            .prerelease == false and
            .name == "Folio 2.0.7 for Windows"
          ' release.json >/dev/null

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists unexpectedly before publication" >&2
            exit 1
          fi

      - name: Clear incomplete recovery assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID/assets" > assets-before.json
          jq -r '.[] | .id' assets-before.json | while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            echo "Deleting stale recovery asset $asset_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done

          count="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID/assets" --jq 'length')"
          test "$count" = "0"

      - name: Upload verified assets over HTTP1.1
        shell: bash
        run: |
          set -euo pipefail

          upload_asset() {
            local file="$1"
            local content_type="$2"
            local name
            local response
            name="$(basename "$file")"
            response="response-${name}.json"

            for attempt in 1 2 3; do
              echo "Uploading $name over HTTP/1.1, attempt $attempt/3"

              existing_ids="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID/assets" --jq ".[] | select(.name == \"$name\") | .id" || true)"
              if [ -n "$existing_ids" ]; then
                while read -r asset_id; do
                  [ -n "$asset_id" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                done <<< "$existing_ids"
              fi

              rm -f "$response"
              if curl --http1.1 \
                --fail-with-body --silent --show-error \
                --connect-timeout 30 --max-time 900 \
                --retry 1 --retry-all-errors --retry-delay 3 \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: $content_type" \
                -H "Expect:" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID/assets?name=$name" \
                -o "$response"; then
                if jq -e --arg name "$name" '.name == $name and .state == "uploaded"' "$response" >/dev/null; then
                  echo "Uploaded $name successfully"
                  jq '{name,state,size,digest,browser_download_url}' "$response"
                  return 0
                fi
              fi

              echo "Upload failed for $name on attempt $attempt" >&2
              [ -f "$response" ] && cat "$response" >&2 || true
              sleep $((attempt * 7))
            done

            echo "Giving up on $name after 3 HTTP/1.1 attempts" >&2
            return 1
          }

          upload_asset "$SUMS" "text/plain"
          upload_asset "$PORTABLE" "application/x-msdownload"
          upload_asset "$SETUP" "application/x-msdownload"

      - name: Verify uploaded release assets and publish
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID/assets" > assets-final.json

          jq -e '
            length == 3 and
            all(.state == "uploaded") and
            ([.[].name] | sort) == (["Folio-2.0.7-portable.exe", "Folio-2.0.7-setup.exe", "sha256.txt"] | sort)
          ' assets-final.json >/dev/null

          setup_size="$(jq -r '.[] | select(.name == "Folio-2.0.7-setup.exe") | .size' assets-final.json)"
          portable_size="$(jq -r '.[] | select(.name == "Folio-2.0.7-portable.exe") | .size' assets-final.json)"
          test "$setup_size" = "372564687"
          test "$portable_size" = "372330472"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID" -F draft=false >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > published.json
          jq -e --arg target "$TARGET_SHA" '
            .draft == false and
            .prerelease == false and
            .target_commitish == $target and
            (.assets | length) == 3 and
            all(.assets[]; .state == "uploaded")
          ' published.json >/dev/null

          jq '{tag_name,target_commitish,draft,published_at,html_url,assets:[.assets[]|{name,state,size,digest,browser_download_url}]}' published.json
