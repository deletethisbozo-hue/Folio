name: Prepare Folio 2.0.6 branch metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-v206-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Folio 2.0.6 branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.0.6-media-fit-and-workspaces
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Bump branch package metadata to 2.0.6
        shell: bash
        run: |
          current="$(node -p "require('./package.json').version")"
          if [ "$current" = "2.0.6" ]; then
            echo "Branch already carries Folio 2.0.6 metadata."
            exit 0
          fi
          test "$current" = "2.0.5" || { echo "Unexpected source version: $current" >&2; exit 1; }
          npm version 2.0.6 --no-git-tag-version
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='2.0.6'||l.version!=='2.0.6'||l.packages[''].version!=='2.0.6') throw new Error('2.0.6 version bump incomplete')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump Folio to 2.0.6"
          git push origin HEAD:fix/v2.0.6-media-fit-and-workspaces
