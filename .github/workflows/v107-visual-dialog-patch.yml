name: Temporary v1.0.7 visual dialog patch

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-visual-dialog-patch.yml"
      - "scripts/patch-v107-visual-book-dialog.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden visual QA Book Details opening
        run: python3 scripts/patch-v107-visual-book-dialog.py
      - name: Commit corrected QA harness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v107-visual-qa.ts
          git diff --cached --quiet && exit 0
          git commit -m "Harden visual QA Book Details opening"
          git push origin HEAD:fix/v1.0.7
