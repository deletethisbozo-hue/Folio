name: Prepare Folio 2.0.7 release workflow

on:
  push:
    branches: [fix/v2.0.7-cover-button-image-title]
    paths:
      - .github/workflows/prepare-v207-release.yml

permissions:
  contents: write

jobs:
  patch-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.7-cover-button-image-title
      - name: Patch Windows release metadata
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/windows-release.yml')
          text = p.read_text(encoding='utf-8')
          pairs = [
              ('Verify Folio 2.0.6 version consistency', 'Verify Folio 2.0.7 version consistency'),
              ('if ($version -ne "2.0.6") { throw "Windows release is scoped to Folio 2.0.6, found $version." }', 'if ($version -ne "2.0.7") { throw "Windows release is scoped to Folio 2.0.7, found $version." }'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'Expected release metadata not found: {old}')
              text = text.replace(old, new, 1)
          old_start = '--notes "Folio 2.0.6 is a UI typography and fixed-artwork correction release.'
          idx = text.find(old_start)
          if idx < 0:
              raise SystemExit('Existing Folio 2.0.6 release notes were not found')
          line_end = text.find('\n', idx)
          if line_end < 0:
              line_end = len(text)
          new_notes = '--notes "Folio 2.0.7 is a professional UI and artwork-presentation release. The Folio wordmark uses the supplied Pelagiad face at a larger, consistent size on the start screen and workspace, while application chrome uses Source Sans 3. The command bar, manuscript navigator, editor canvas, device preview, status bar, Export and Replace Cover controls now follow one coherent desktop system. Cover and Full-page Image artwork uses contain-fit without destructive cropping; Full-page Image filenames are no longer shown as visible titles. The sidebar gains functional Add Section and book-details controls without introducing dead UI, Cover alignment is corrected, and the chapter header is tightened to return more space to the manuscript. The release is gated by typecheck, the full formatter/UI suite, Windows browser interaction smoke, visual/typesetting QA, the full Print PDF matrix, packaged executable smoke tests, EPUB/PDF/print export checks and SHA-256 hashing."'
          text = text[:idx] + new_notes + text[line_end:]
          p.write_text(text, encoding='utf-8')
      - name: Commit release workflow patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-release.yml
          git commit -m "Prepare Windows release for 2.0.7"
          git push origin HEAD:fix/v2.0.7-cover-button-image-title
