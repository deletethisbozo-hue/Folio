name: v1.0.7 word-spacing DP state probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-font-size-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Preserve word-spacing continuity in DP state
        shell: python
        run: |
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches: {count}')
              return text.replace(old, new, 1)

          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          s = one(
              s,
              'const HYPHEN_BUCKET_COUNT = 9;\n\nfunction hyphenCountBucket(hyphenCount: number): number {\n',
              'const HYPHEN_BUCKET_COUNT = 9;\nconst WORD_SPACING_BUCKET_MIN_EM = -0.12;\nconst WORD_SPACING_BUCKET_STEP_EM = 0.02;\nconst WORD_SPACING_BUCKET_COUNT = 13;\n\nfunction wordSpacingBucket(wordSpacing: number, fontSize: number): number {\n  const em = wordSpacing / Math.max(1, fontSize);\n  return Math.max(0, Math.min(\n    WORD_SPACING_BUCKET_COUNT - 1,\n    Math.round((em - WORD_SPACING_BUCKET_MIN_EM) / WORD_SPACING_BUCKET_STEP_EM),\n  ));\n}\n\nfunction hyphenCountBucket(hyphenCount: number): number {\n',
              'word-spacing bucket constants',
          )
          s = one(
              s,
              '  glyphScale: number,\n  hyphenCount: number,\n): number {\n  const base = (line * HYPHEN_STREAK_COUNT + hyphenStreak) * FITNESS_COUNT + fitness;\n  const packed = base * GLYPH_SCALE_COUNT + glyphScaleBucket(glyphScale);\n  return packed * HYPHEN_BUCKET_COUNT + hyphenCountBucket(hyphenCount);\n}\n\nfunction decodeState(key: number): { line: number; hyphenStreak: number; fitness: number; glyphScale: number; hyphenBucket: number } {\n  const hyphenBucket = key % HYPHEN_BUCKET_COUNT;\n  const packed = Math.floor(key / HYPHEN_BUCKET_COUNT);\n  const glyphBucket = packed % GLYPH_SCALE_COUNT;\n  const base = Math.floor(packed / GLYPH_SCALE_COUNT);\n',
              '  glyphScale: number,\n  hyphenCount: number,\n  wordSpacing = 0,\n  fontSize = 16,\n): number {\n  const base = (line * HYPHEN_STREAK_COUNT + hyphenStreak) * FITNESS_COUNT + fitness;\n  const glyphPacked = base * GLYPH_SCALE_COUNT + glyphScaleBucket(glyphScale);\n  const spacingPacked = glyphPacked * WORD_SPACING_BUCKET_COUNT + wordSpacingBucket(wordSpacing, fontSize);\n  return spacingPacked * HYPHEN_BUCKET_COUNT + hyphenCountBucket(hyphenCount);\n}\n\nfunction decodeState(key: number): { line: number; hyphenStreak: number; fitness: number; glyphScale: number; hyphenBucket: number } {\n  const hyphenBucket = key % HYPHEN_BUCKET_COUNT;\n  const spacingPacked = Math.floor(key / HYPHEN_BUCKET_COUNT);\n  const glyphPacked = Math.floor(spacingPacked / WORD_SPACING_BUCKET_COUNT);\n  const glyphBucket = glyphPacked % GLYPH_SCALE_COUNT;\n  const base = Math.floor(glyphPacked / GLYPH_SCALE_COUNT);\n',
              'word-spacing state encoding',
          )
          s = one(
              s,
              '        const nextKey = encodeState(nextLine, nextStreak, currentFitness, lineFit?.glyphScale ?? 1, nextHyphenCount);\n',
              '        const nextKey = encodeState(nextLine, nextStreak, currentFitness, lineFit?.glyphScale ?? 1, nextHyphenCount, lineFit?.wordSpacing ?? 0, fontSize);\n',
              'word-spacing next state',
          )
          p.write_text(s, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          old = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          new = '  const probeNames = new Set(["decorative", "editorial", "cloister", "scholar"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 4) throw new Error(`Expected exactly 4 probe themes, found ${themes.length}`);\n'
          if t.count(old) != 1:
              raise SystemExit('matrix theme selector changed unexpectedly')
          q.write_text(t.replace(old, new, 1), encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Reference corpus
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: 12-case targeted matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          if not p.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          out = {
              'matrix': '${{ steps.matrix.outcome }}',
              'passed': d['passed'],
              'failed': d['failed'],
              'failuresByTheme': d['failuresByTheme'],
          }
          Path('build/qa-v107/word-spacing-state-probe.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-word-spacing-state-probe
          path: build/qa-v107/word-spacing-state-probe.json
          if-no-files-found: error
