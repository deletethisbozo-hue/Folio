name: v1.0.7 body-size typography probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-font-size-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Limit matrix to representative reading faces
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/v107-theme-matrix.ts')
          s = p.read_text(encoding='utf-8')
          old = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          new = '  const probeNames = new Set(["modern", "decorative", "editorial", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 4) throw new Error(`Expected exactly 4 probe themes, found ${themes.length}`);\n'
          if s.count(old) != 1:
              raise SystemExit('matrix theme selector changed unexpectedly')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Run body-size variants
        shell: bash
        run: |
          set -u
          mkdir -p build/qa-v107/body-size-probe
          : > build/qa-v107/body-size-probe/summary.txt
          for size in 0.98 0.96 0.94; do
            git checkout -- themes/decorative/theme.css themes/editorial/theme.css themes/cloister/theme.css
            for theme in decorative editorial cloister; do
              printf '\n/* checkout-only v1.0.7 body-size probe */\nbody { font-size: %srem; }\n' "$size" >> "themes/$theme/theme.css"
            done
            npm run build
            set +e
            node --import tsx scripts/v107-theme-matrix.ts
            rc=$?
            set -e
            cp build/qa-v107/theme-matrix.json "build/qa-v107/body-size-probe/${size}.json"
            node - "$size" "$rc" <<'NODE' | tee -a build/qa-v107/body-size-probe/summary.txt
          const fs = require('node:fs');
          const [size, rc] = process.argv.slice(2);
          const d = JSON.parse(fs.readFileSync(`build/qa-v107/body-size-probe/${size}.json`, 'utf8'));
          console.log(JSON.stringify({size, rc:Number(rc), passed:d.passed, failed:d.failed, failuresByTheme:d.failuresByTheme}));
          NODE
          done
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-body-size-probe
          path: build/qa-v107/body-size-probe
          if-no-files-found: error
