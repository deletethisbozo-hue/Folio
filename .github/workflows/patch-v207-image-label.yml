name: Patch Folio 2.0.7 image-page labels

on:
  push:
    branches: [fix/v2.0.7-cover-button-image-title]
    paths:
      - .github/workflows/patch-v207-image-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.7-cover-button-image-title
      - name: Preserve neutral image-page disambiguation
        shell: python
        run: |
          from pathlib import Path
          p = Path("web/src/image-page-ui.ts")
          text = p.read_text(encoding="utf-8")
          old = '  if (label.textContent !== "Full-page Image") label.textContent = "Full-page Image";'
          new = "\n".join([
              '  const original = (label.dataset.folioImagePageOriginalLabel ?? "").trim();',
              '  const neutralLabel = /^Full-page Image(?: \\d+)?$/i.test(original) ? original : "Full-page Image";',
              '  if (label.textContent !== neutralLabel) label.textContent = neutralLabel;',
          ])
          if old not in text:
              raise SystemExit("Expected Full-page Image overwrite line not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/image-page-ui.ts
          git commit -m "Preserve disambiguated Full-page Image titles"
          git push origin HEAD:fix/v2.0.7-cover-button-image-title
