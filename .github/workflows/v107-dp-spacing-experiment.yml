name: v1.0.7 DP spacing-state experiment

# Checkout-only experiment: validates the DP state-key hypothesis without committing product code.
on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-dp-spacing-experiment.yml'

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Preserve word spacing in DP state identity
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          old = '''const HYPHEN_BUCKET_COUNT = 9;\n\nfunction hyphenCountBucket(hyphenCount: number): number {\n  return Math.min(HYPHEN_BUCKET_COUNT - 1, hyphenCount);\n}\n\nfunction encodeState(\n  line: number,\n  hyphenStreak: number,\n  fitness: number,\n  glyphScale: number,\n  hyphenCount: number,\n): number {\n  const base = (line * HYPHEN_STREAK_COUNT + hyphenStreak) * FITNESS_COUNT + fitness;\n  const packed = base * GLYPH_SCALE_COUNT + glyphScaleBucket(glyphScale);\n  return packed * HYPHEN_BUCKET_COUNT + hyphenCountBucket(hyphenCount);\n}\n\nfunction decodeState(key: number): { line: number; hyphenStreak: number; fitness: number; glyphScale: number; hyphenBucket: number } {\n  const hyphenBucket = key % HYPHEN_BUCKET_COUNT;\n  const packed = Math.floor(key / HYPHEN_BUCKET_COUNT);\n  const glyphBucket = packed % GLYPH_SCALE_COUNT;\n  const base = Math.floor(packed / GLYPH_SCALE_COUNT);\n  return {\n    line: Math.floor(base / (HYPHEN_STREAK_COUNT * FITNESS_COUNT)),\n    hyphenStreak: Math.floor(base / FITNESS_COUNT) % HYPHEN_STREAK_COUNT,\n    fitness: base % FITNESS_COUNT,\n    glyphScale: GLYPH_SCALE_MIN + glyphBucket * GLYPH_SCALE_STEP,\n    hyphenBucket,\n  };\n}\n'''
          new = '''const HYPHEN_BUCKET_COUNT = 9;\nconst WORD_SPACING_MIN_EM = -0.12;\nconst WORD_SPACING_STEP_EM = 0.005;\nconst WORD_SPACING_BUCKET_COUNT = 49;\n\nfunction hyphenCountBucket(hyphenCount: number): number {\n  return Math.min(HYPHEN_BUCKET_COUNT - 1, hyphenCount);\n}\n\nfunction wordSpacingBucket(wordSpacing: number, fontSize: number): number {\n  const em = wordSpacing / Math.max(1, fontSize);\n  return Math.max(0, Math.min(\n    WORD_SPACING_BUCKET_COUNT - 1,\n    Math.round((em - WORD_SPACING_MIN_EM) / WORD_SPACING_STEP_EM),\n  ));\n}\n\nfunction encodeState(\n  line: number,\n  hyphenStreak: number,\n  fitness: number,\n  glyphScale: number,\n  hyphenCount: number,\n  wordSpacing: number,\n  fontSize: number,\n): number {\n  const base = (line * HYPHEN_STREAK_COUNT + hyphenStreak) * FITNESS_COUNT + fitness;\n  const packed = base * GLYPH_SCALE_COUNT + glyphScaleBucket(glyphScale);\n  const withHyphens = packed * HYPHEN_BUCKET_COUNT + hyphenCountBucket(hyphenCount);\n  return withHyphens * WORD_SPACING_BUCKET_COUNT + wordSpacingBucket(wordSpacing, fontSize);\n}\n\nfunction decodeState(key: number): { line: number; hyphenStreak: number; fitness: number; glyphScale: number; hyphenBucket: number } {\n  const withHyphens = Math.floor(key / WORD_SPACING_BUCKET_COUNT);\n  const hyphenBucket = withHyphens % HYPHEN_BUCKET_COUNT;\n  const packed = Math.floor(withHyphens / HYPHEN_BUCKET_COUNT);\n  const glyphBucket = packed % GLYPH_SCALE_COUNT;\n  const base = Math.floor(packed / GLYPH_SCALE_COUNT);\n  return {\n    line: Math.floor(base / (HYPHEN_STREAK_COUNT * FITNESS_COUNT)),\n    hyphenStreak: Math.floor(base / FITNESS_COUNT) % HYPHEN_STREAK_COUNT,\n    fitness: base % FITNESS_COUNT,\n    glyphScale: GLYPH_SCALE_MIN + glyphBucket * GLYPH_SCALE_STEP,\n    hyphenBucket,\n  };\n}\n'''
          if s.count(old) != 1:
              raise SystemExit(f'encode/decode block matches: {s.count(old)}')
          s = s.replace(old, new, 1)
          old_initial = 'states[0].set(encodeState(0, 0, initialFitness, 1, 0), {'
          new_initial = 'states[0].set(encodeState(0, 0, initialFitness, 1, 0, 0, fontSize), {'
          if s.count(old_initial) != 1:
              raise SystemExit(f'initial key matches: {s.count(old_initial)}')
          s = s.replace(old_initial, new_initial, 1)
          old_next = 'const nextKey = encodeState(nextLine, nextStreak, currentFitness, lineFit?.glyphScale ?? 1, nextHyphenCount);'
          new_next = 'const nextKey = encodeState(nextLine, nextStreak, currentFitness, lineFit?.glyphScale ?? 1, nextHyphenCount, lineFit?.wordSpacing ?? 0, fontSize);'
          if s.count(old_next) != 1:
              raise SystemExit(f'next key matches: {s.count(old_next)}')
          s = s.replace(old_next, new_next, 1)
          p.write_text(s, encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Reference corpus
        id: reference
        continue-on-error: true
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: 30-theme matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize experiment
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          if not p.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({k:d[k] for k in ('themes','totalScenarios','passed','failed')}, indent=2))
          if '${{ steps.reference.outcome }}' != 'success':
              raise SystemExit('reference corpus failed in experiment')
