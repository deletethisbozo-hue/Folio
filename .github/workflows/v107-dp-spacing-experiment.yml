name: v1.0.7 Modern measure experiment

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-dp-spacing-experiment.yml'

permissions:
  contents: read

jobs:
  modern-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell

      - name: Apply checkout-only Modern column measure
        shell: python
        run: |
          from pathlib import Path

          p = Path('themes/modern/theme.css')
          s = p.read_text(encoding='utf-8')
          marker = 'main.book { counter-reset: modern-chapter; }\n'
          if s.count(marker) != 1:
              raise SystemExit(f'modern main marker matches: {s.count(marker)}')
          s = s.replace(
              marker,
              'main.book {\n  counter-reset: modern-chapter;\n  padding-left: 1.6em;\n  padding-right: 1.6em;\n}\n',
              1,
          )
          p.write_text(s, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          old = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          new = '  const themes = themeList().filter((theme) => theme.name === "modern");\n  if (themes.length !== 1) throw new Error(`Expected Modern probe theme, found ${themes.length}`);\n'
          if t.count(old) != 1:
              raise SystemExit(f'theme subset matches: {t.count(old)}')
          q.write_text(t.replace(old, new, 1), encoding='utf-8')

      - run: npm run typecheck
      - run: npm run build
      - name: Reference corpus
        id: reference
        continue-on-error: true
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: Modern 3-case matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts

      - name: Summarize
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          out = {
              'reference': '${{ steps.reference.outcome }}',
              'matrix': '${{ steps.matrix.outcome }}',
          }
          if p.exists():
              d = json.loads(p.read_text(encoding='utf-8'))
              out.update({
                  'passed': d['passed'],
                  'failed': d['failed'],
                  'results': [
                      {
                          'scenario': r['scenario'],
                          'pass': r['pass'],
                          'failures': r['failures'],
                          'measurePx': r.get('metrics', {}).get('measurePx'),
                          'hyphenRate': r.get('metrics', {}).get('hyphenRate'),
                          'emergencyLines': r.get('metrics', {}).get('emergencyLines'),
                          'oneWordFinalLines': r.get('metrics', {}).get('oneWordFinalLines'),
                          'compositionFailures': r.get('metrics', {}).get('compositionFailures'),
                      }
                      for r in d['results']
                  ],
              })
          Path('build/qa-v107/modern-measure.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v107-modern-measure
          path: build/qa-v107/modern-measure.json
          if-no-files-found: error

      - name: Require green probe
        if: always()
        shell: bash
        run: |
          test '${{ steps.reference.outcome }}' = success
          test '${{ steps.matrix.outcome }}' = success
