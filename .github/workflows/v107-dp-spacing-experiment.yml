name: v1.0.7 font measure experiment

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-dp-spacing-experiment.yml'

permissions:
  contents: read

jobs:
  measure-factor:
    strategy:
      fail-fast: false
      matrix:
        factor: ['0.94', '0.96', '0.98']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
      MEASURE_FACTOR: ${{ matrix.factor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell

      - name: Apply checkout-only measure factor
        shell: python
        run: |
          import os
          from pathlib import Path

          factor = float(os.environ['MEASURE_FACTOR'])

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches: {count}')
              return text.replace(old, new, 1)

          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          old = '  const width = Math.max(1, paragraphRect.width - borderLeft - borderRight - paddingLeft - paddingRight);\n'
          new = f'  const width = Math.max(1, (paragraphRect.width - borderLeft - borderRight - paddingLeft - paddingRight) * {factor});\n'
          s = one(s, old, new, 'measure width')
          p.write_text(s, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          t = one(
              t,
              '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n',
              '  const probeNames = new Set(["classic", "modern", "decorative", "editorial", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 5) throw new Error(`Expected exactly 5 probe themes, found ${themes.length}`);\n',
              'probe themes',
          )
          q.write_text(t, encoding='utf-8')

      - run: npm run typecheck
      - run: npm run build
      - name: Reference corpus
        id: reference
        continue-on-error: true
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: Representative matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts

      - name: Summarize factor
        if: always()
        shell: python
        run: |
          import json, os
          from collections import Counter
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          if not p.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          categories = Counter()
          for r in d['results']:
              for failure in r.get('failures', []):
                  categories[failure.split('=')[0]] += 1
          out = {
              'factor': os.environ['MEASURE_FACTOR'],
              'reference': '${{ steps.reference.outcome }}',
              'matrix': '${{ steps.matrix.outcome }}',
              'passed': d['passed'],
              'failed': d['failed'],
              'categories': dict(categories),
              'results': [
                  {
                      'theme': r['theme'],
                      'scenario': r['scenario'],
                      'pass': r['pass'],
                      'failures': r['failures'],
                      'bodyFont': r.get('metrics', {}).get('bodyFont'),
                      'measurePx': r.get('metrics', {}).get('measurePx'),
                  }
                  for r in d['results']
              ],
          }
          target = Path(f"build/qa-v107/measure-factor-{os.environ['MEASURE_FACTOR']}.json")
          target.write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
          if '${{ steps.reference.outcome }}' != 'success':
              raise SystemExit('reference corpus failed')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v107-measure-factor-${{ matrix.factor }}
          path: build/qa-v107/measure-factor-${{ matrix.factor }}.json
          if-no-files-found: error
