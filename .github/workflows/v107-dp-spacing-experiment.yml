name: v1.0.7 diverse fit frontier experiment

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-dp-spacing-experiment.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Preserve a small diverse legal fit frontier
        shell: python
        run: |
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches: {count}')
              return text.replace(old, new, 1)

          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          s = one(
              s,
              '  selection: "badness" | "continuity" | "spacing-continuity" = "badness",\n',
              '  selection: "badness" | "continuity" | "spacing-continuity" | "tight-spacing" | "loose-spacing" | "compressed-scale" | "expanded-scale" = "badness",\n',
              'selection union',
          )
          s = one(
              s,
              '''    const rank = selection === "continuity"\n      ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness\n      : selection === "spacing-continuity"\n        ? Math.abs(wordSpacing - targetWordSpacing) * 1_000_000 + candidate.badness\n        : candidate.badness;\n''',
              '''    const rank = selection === "continuity"\n      ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness\n      : selection === "spacing-continuity"\n        ? Math.abs(wordSpacing - targetWordSpacing) * 1_000_000 + candidate.badness\n        : selection === "tight-spacing"\n          ? wordSpacing * 100_000 + candidate.badness\n          : selection === "loose-spacing"\n            ? -wordSpacing * 100_000 + candidate.badness\n            : selection === "compressed-scale"\n              ? glyphScale * 100_000 + candidate.badness\n              : selection === "expanded-scale"\n                ? -glyphScale * 100_000 + candidate.badness\n                : candidate.badness;\n''',
              'selection ranking',
          )
          anchor = '''        const spacingFit = strictSpacingFit ?? (emergency && !last\n          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, true, false, language, "spacing-continuity", previous.wordSpacing)\n          : null);\n'''
          addition = anchor + '''        const frontierFits = !last ? [\n          fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, emergency, false, language, "tight-spacing"),\n          fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, emergency, false, language, "loose-spacing"),\n          fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, emergency, false, language, "compressed-scale"),\n          fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, emergency, false, language, "expanded-scale"),\n        ] : [];\n'''
          s = one(s, anchor, addition, 'frontier fits')
          anchor2 = '''        if (spacingFit && !fitOptions.some((candidate) =>\n          candidate\n          && Math.abs(candidate.glyphScale - spacingFit.glyphScale) < 0.000001\n          && Math.abs(candidate.wordSpacing - spacingFit.wordSpacing) < 0.000001\n          && Math.abs(candidate.tracking - spacingFit.tracking) < 0.000001\n        )) fitOptions.push(spacingFit);\n'''
          addition2 = anchor2 + '''        for (const frontierFit of frontierFits) {\n          if (frontierFit && !fitOptions.some((candidate) =>\n            candidate\n            && Math.abs(candidate.glyphScale - frontierFit.glyphScale) < 0.000001\n            && Math.abs(candidate.wordSpacing - frontierFit.wordSpacing) < 0.000001\n            && Math.abs(candidate.tracking - frontierFit.tracking) < 0.000001\n          )) fitOptions.push(frontierFit);\n        }\n'''
          s = one(s, anchor2, addition2, 'frontier insertion')
          p.write_text(s, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          t = one(
              t,
              '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n',
              '  const probeNames = new Set(["classic", "modern", "decorative", "editorial", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 5) throw new Error(`Expected exactly 5 probe themes, found ${themes.length}`);\n',
              'probe themes',
          )
          q.write_text(t, encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Reference corpus
        id: reference
        continue-on-error: true
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: 15-case representative matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize frontier probe
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          if not p.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          out = {
              'reference': '${{ steps.reference.outcome }}',
              'matrix': '${{ steps.matrix.outcome }}',
              'passed': d['passed'],
              'failed': d['failed'],
              'results': [],
          }
          for r in d['results']:
              m = r.get('metrics', {})
              out['results'].append({
                  'theme': r['theme'], 'scenario': r['scenario'], 'pass': r['pass'],
                  'failures': r['failures'], 'font': m.get('bodyFont'),
                  'hyphenRate': m.get('hyphenRate'), 'rightError': m.get('maxRightErrorPx'),
                  'emergency': m.get('emergencyLines'), 'widow': m.get('oneWordFinalLines'),
                  'compositionFailures': m.get('compositionFailures'),
                  'dropcapOpening': m.get('dropcapOpening'),
              })
          Path('build/qa-v107/diverse-frontier-probe.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
          if '${{ steps.reference.outcome }}' != 'success':
              raise SystemExit('reference corpus failed')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v107-diverse-frontier-probe
          path: build/qa-v107/diverse-frontier-probe.json
          if-no-files-found: error
