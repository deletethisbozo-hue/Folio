name: v1.0.7 continuity-aware fit experiment

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-dp-spacing-experiment.yml'

permissions:
  contents: read

jobs:
  continuity-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell

      - name: Add checkout-only continuity-aware fit candidate
        shell: python
        run: |
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches: {count}')
              return text.replace(old, new, 1)

          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          old = '''    const scaledAdjustment = available / glyphScale - naturalWidth;\n    let wordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, scaledAdjustment / gaps));\n    let remaining = scaledAdjustment - wordSpacing * gaps;\n    let tracking = trackingOps > 0 ? remaining / trackingOps : 0;\n\n    if (tracking > maxTracking || tracking < minTracking) {\n      tracking = Math.max(minTracking, Math.min(maxTracking, tracking));\n      wordSpacing = (scaledAdjustment - tracking * trackingOps) / gaps;\n    }\n    wordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, wordSpacing));\n    tracking = Math.max(minTracking, Math.min(maxTracking, tracking));\n    const residualPx = (scaledAdjustment - wordSpacing * gaps - tracking * trackingOps) * glyphScale;\n    if (Math.abs(residualPx) > 1.70) continue;\n\n    const spaceRatio = wordSpacing / Math.max(0.5, spaceWidth);\n    const trackingRatio = tracking / Math.max(1, fontSize);\n    const scaleRatio = Math.abs(glyphScale - 1) / 0.01;\n    const scaleJumpRatio = Math.abs(glyphScale - previousGlyphScale) / 0.01;\n    const badness = 100 * Math.pow(Math.abs(spaceRatio) / 0.20, 3)\n      + 55 * Math.pow(Math.abs(trackingRatio) / 0.0035, 3)\n      + 42 * Math.pow(scaleRatio, 3)\n      + 90 * Math.pow(scaleJumpRatio, 2)\n      + 100 * Math.pow(Math.abs(residualPx) / 1.70, 2);\n    const fitness = spaceRatio < -0.04 ? 0 : spaceRatio <= 0.10 ? 1 : spaceRatio <= 0.22 ? 2 : 3;\n    const candidate = { wordSpacing, tracking, glyphScale, badness, fitness };\n    const rank = selection === "continuity"\n      ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness\n      : selection === "spacing-continuity"\n        ? Math.abs(wordSpacing - targetWordSpacing) * 1_000_000 + candidate.badness\n        : candidate.badness;\n    if (!best || rank < bestRank) {\n      best = candidate;\n      bestRank = rank;\n    }\n'''
          new = '''    const scaledAdjustment = available / glyphScale - naturalWidth;\n    const allocations: Array<{ wordSpacing: number; tracking: number }> = [];\n\n    let greedyWordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, scaledAdjustment / gaps));\n    let greedyRemaining = scaledAdjustment - greedyWordSpacing * gaps;\n    let greedyTracking = trackingOps > 0 ? greedyRemaining / trackingOps : 0;\n    if (greedyTracking > maxTracking || greedyTracking < minTracking) {\n      greedyTracking = Math.max(minTracking, Math.min(maxTracking, greedyTracking));\n      greedyWordSpacing = (scaledAdjustment - greedyTracking * trackingOps) / gaps;\n    }\n    allocations.push({\n      wordSpacing: Math.max(minWordSpacing, Math.min(maxWordSpacing, greedyWordSpacing)),\n      tracking: Math.max(minTracking, Math.min(maxTracking, greedyTracking)),\n    });\n\n    // The old fitter only varied glyph scale when asked to preserve spacing.\n    // That misses legal solutions where a tiny amount of tracking can keep the\n    // word spacing close to the previous line. Add that exact constrained\n    // allocation without changing any spacing, tracking, scale or residual cap.\n    if (selection === "spacing-continuity" && trackingOps > 0) {\n      const targetTracking = Math.max(\n        minTracking,\n        Math.min(maxTracking, (scaledAdjustment - targetWordSpacing * gaps) / trackingOps),\n      );\n      const targetSpacing = (scaledAdjustment - targetTracking * trackingOps) / gaps;\n      if (targetSpacing >= minWordSpacing - 0.000001 && targetSpacing <= maxWordSpacing + 0.000001) {\n        allocations.push({ wordSpacing: targetSpacing, tracking: targetTracking });\n      }\n    }\n\n    for (const allocation of allocations) {\n      const wordSpacing = allocation.wordSpacing;\n      const tracking = allocation.tracking;\n      const residualPx = (scaledAdjustment - wordSpacing * gaps - tracking * trackingOps) * glyphScale;\n      if (Math.abs(residualPx) > 1.70) continue;\n\n      const spaceRatio = wordSpacing / Math.max(0.5, spaceWidth);\n      const trackingRatio = tracking / Math.max(1, fontSize);\n      const scaleRatio = Math.abs(glyphScale - 1) / 0.01;\n      const scaleJumpRatio = Math.abs(glyphScale - previousGlyphScale) / 0.01;\n      const badness = 100 * Math.pow(Math.abs(spaceRatio) / 0.20, 3)\n        + 55 * Math.pow(Math.abs(trackingRatio) / 0.0035, 3)\n        + 42 * Math.pow(scaleRatio, 3)\n        + 90 * Math.pow(scaleJumpRatio, 2)\n        + 100 * Math.pow(Math.abs(residualPx) / 1.70, 2);\n      const fitness = spaceRatio < -0.04 ? 0 : spaceRatio <= 0.10 ? 1 : spaceRatio <= 0.22 ? 2 : 3;\n      const candidate = { wordSpacing, tracking, glyphScale, badness, fitness };\n      const rank = selection === "continuity"\n        ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness\n        : selection === "spacing-continuity"\n          ? Math.abs(wordSpacing - targetWordSpacing) * 1_000_000 + candidate.badness\n          : candidate.badness;\n      if (!best || rank < bestRank) {\n        best = candidate;\n        bestRank = rank;\n      }\n    }\n'''
          s = one(s, old, new, 'fit allocation')
          p.write_text(s, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          t = one(
              t,
              '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n',
              '  const probeNames = new Set(["classic", "modern", "decorative", "editorial", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 5) throw new Error(`Expected exactly 5 probe themes, found ${themes.length}`);\n',
              'probe themes',
          )
          q.write_text(t, encoding='utf-8')

      - run: npm run typecheck
      - run: npm run build
      - name: Reference corpus
        id: reference
        continue-on-error: true
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: Representative matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts

      - name: Summarize
        if: always()
        shell: python
        run: |
          import json
          from collections import Counter
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          if not p.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          categories = Counter()
          for r in d['results']:
              for failure in r.get('failures', []):
                  categories[failure.split('=')[0]] += 1
          out = {
              'reference': '${{ steps.reference.outcome }}',
              'matrix': '${{ steps.matrix.outcome }}',
              'passed': d['passed'],
              'failed': d['failed'],
              'categories': dict(categories),
              'results': [
                  {
                      'theme': r['theme'],
                      'scenario': r['scenario'],
                      'pass': r['pass'],
                      'failures': r['failures'],
                      'bodyFont': r.get('metrics', {}).get('bodyFont'),
                      'maxAdjacentSpacingDeltaEm': r.get('metrics', {}).get('maxAdjacentSpacingDeltaEm'),
                      'emergencyLines': r.get('metrics', {}).get('emergencyLines'),
                      'compositionFailures': r.get('metrics', {}).get('compositionFailures'),
                  }
                  for r in d['results']
              ],
          }
          Path('build/qa-v107/continuity-aware-fit.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v107-continuity-aware-fit
          path: build/qa-v107/continuity-aware-fit.json
          if-no-files-found: error

      - name: Require green reference
        if: always()
        shell: bash
        run: test '${{ steps.reference.outcome }}' = success
