name: v1.0.7 widow-first and residual experiment

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-dp-spacing-experiment.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply widow-first final selection and 1.50px residual ceiling
        shell: python
        run: |
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches: {count}')
              return text.replace(old, new, 1)

          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          s = one(s, '  let bestHyphenBudgetPriority = 3;\n', '  let bestHyphenBudgetPriority = 3;\n  let bestWidowPriority = 2;\n', 'widow declaration')
          s = one(
              s,
              '    const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);\n    // 0.45 is the release ceiling, not the composition target. Prefer 0.40\n',
              '    const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);\n    const finalSemanticWords = state.from < count\n      ? 1 + words.slice(state.from + 1, count).filter((word) => word.spaceBefore).length\n      : 0;\n    const widowPriority = finalSemanticWords === 1 ? 1 : 0;\n    // A one-word final line is a composition defect, so widow avoidance outranks\n    // the preferred 0.40 hyphen target. The hard 0.45 ceiling remains the next\n    // selection dimension once widow status is equal.\n    // 0.45 is the release ceiling, not the composition target. Prefer 0.40\n',
              'widow calculation',
          )
          s = one(
              s,
              '    if (hyphenBudgetPriority < bestHyphenBudgetPriority\n      || (hyphenBudgetPriority === bestHyphenBudgetPriority && betterSamePriority)) {\n      bestHyphenBudgetPriority = hyphenBudgetPriority;\n      bestCost = state.cost;\n      bestSectionRate = sectionRate;\n      bestKey = key;\n    }\n',
              '    if (widowPriority < bestWidowPriority\n      || (widowPriority === bestWidowPriority\n        && (hyphenBudgetPriority < bestHyphenBudgetPriority\n          || (hyphenBudgetPriority === bestHyphenBudgetPriority && betterSamePriority)))) {\n      bestWidowPriority = widowPriority;\n      bestHyphenBudgetPriority = hyphenBudgetPriority;\n      bestCost = state.cost;\n      bestSectionRate = sectionRate;\n      bestKey = key;\n    }\n',
              'widow selection',
          )
          count = s.count('1.70')
          if count != 3:
              raise SystemExit(f'residual constant occurrences: {count}')
          s = s.replace('1.70', '1.50')
          p.write_text(s, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          t = one(
              t,
              '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n',
              '  const probeNames = new Set(["classic", "modern", "decorative", "editorial", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 5) throw new Error(`Expected exactly 5 probe themes, found ${themes.length}`);\n',
              'probe themes',
          )
          q.write_text(t, encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Reference corpus
        id: reference
        continue-on-error: true
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: 15-case representative matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize representative failures
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          if not p.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          out = {
              'reference': '${{ steps.reference.outcome }}',
              'matrix': '${{ steps.matrix.outcome }}',
              'passed': d['passed'],
              'failed': d['failed'],
              'results': [],
          }
          for r in d['results']:
              m = r.get('metrics', {})
              out['results'].append({
                  'theme': r['theme'],
                  'scenario': r['scenario'],
                  'pass': r['pass'],
                  'failures': r['failures'],
                  'font': m.get('bodyFont'),
                  'hyphenRate': m.get('hyphenRate'),
                  'rightError': m.get('maxRightErrorPx'),
                  'emergency': m.get('emergencyLines'),
                  'widow': m.get('oneWordFinalLines'),
                  'compositionFailures': m.get('compositionFailures'),
                  'dropcapOpening': m.get('dropcapOpening'),
                  'emergencyDetails': m.get('emergencyDetails'),
                  'compositionFailureDetails': m.get('compositionFailureDetails'),
              })
          Path('build/qa-v107/widow-residual-probe.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
          if '${{ steps.reference.outcome }}' != 'success':
              raise SystemExit('reference corpus failed')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v107-widow-residual-probe
          path: build/qa-v107/widow-residual-probe.json
          if-no-files-found: error
