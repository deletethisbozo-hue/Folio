name: v1.0.7 DP failure frontier diagnostics

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-dp-spacing-experiment.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell

      - name: Add checkout-only graph diagnostics
        shell: python
        run: |
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches: {count}')
              return text.replace(old, new, 1)

          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          s = one(
              s,
              '  const rejectedBreaks: Array<Record<string, unknown>> = [];\n',
              '  const rejectedBreaks: Array<Record<string, unknown>> = [];\n  let spacingJumpRejects = 0;\n  let statePrunes = 0;\n  let stateReplacements = 0;\n',
              'diagnostic counters',
          )
          s = one(
              s,
              '''          if (lineFit && (previous.justified || previous.finalCompressed)\n            && Math.abs(lineFit.wordSpacing - previous.wordSpacing) / Math.max(1, fontSize) > 0.158) continue;\n''',
              '''          if (lineFit && (previous.justified || previous.finalCompressed)\n            && Math.abs(lineFit.wordSpacing - previous.wordSpacing) / Math.max(1, fontSize) > 0.158) {\n            spacingJumpRejects++;\n            if (rejectedBreaks.length < 240) rejectedBreaks.push({\n              reason: "spacing-jump", start, end, line, hyphenBreak,\n              candidateWordSpacing: lineFit.wordSpacing, previousWordSpacing: previous.wordSpacing,\n              spacingJumpEm: Math.abs(lineFit.wordSpacing - previous.wordSpacing) / Math.max(1, fontSize),\n              candidateGlyphScale: lineFit.glyphScale, previousGlyphScale: previous.glyphScale,\n              startText: (words[start].node.textContent ?? "").replace(/\\u00ad/g, ""),\n              endText: (words[end].node.textContent ?? "").replace(/\\u00ad/g, ""),\n              nextText: (words[end + 1]?.node.textContent ?? "").replace(/\\u00ad/g, ""),\n            });\n            continue;\n          }\n''',
              'spacing jump rejection',
          )
          s = one(
              s,
              '''        const old = states[end + 1].get(nextKey);\n        if (!old || cost < old.cost) {\n''',
              '''        const old = states[end + 1].get(nextKey);\n        if (old && cost >= old.cost) {\n          statePrunes++;\n          if (rejectedBreaks.length < 240 && end + 1 >= count - 10) rejectedBreaks.push({\n            reason: "state-pruned", start, end, line, hyphenBreak, nextKey, cost, keptCost: old.cost,\n            wordSpacing: lineFit?.wordSpacing ?? 0, keptWordSpacing: old.wordSpacing,\n            glyphScale: lineFit?.glyphScale ?? 1, keptGlyphScale: old.glyphScale,\n            hyphenCount: nextHyphenCount, keptHyphenCount: old.hyphenCount,\n            startText: (words[start].node.textContent ?? "").replace(/\\u00ad/g, ""),\n            endText: (words[end].node.textContent ?? "").replace(/\\u00ad/g, ""),\n          });\n        } else if (old) stateReplacements++;\n        if (!old || cost < old.cost) {\n''',
              'state collision diagnostics',
          )
          s = one(
              s,
              '      rejectedBreaks: rejectedBreaks.slice(-60),\n',
              '      diagnosticCounts: { spacingJumpRejects, statePrunes, stateReplacements },\n      rejectedBreaks: rejectedBreaks.slice(-120),\n',
              'failure diagnostic payload',
          )
          p.write_text(s, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          t = one(
              t,
              '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n',
              '  const probeNames = new Set(["classic", "modern", "decorative", "editorial", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 5) throw new Error(`Expected exactly 5 probe themes, found ${themes.length}`);\n',
              'probe themes',
          )
          q.write_text(t, encoding='utf-8')

      - run: npm run typecheck
      - run: npm run build
      - name: Reference corpus
        id: reference
        continue-on-error: true
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: Representative matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts

      - name: Print strict-failure frontier
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          if not p.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          failures = []
          for r in d['results']:
              details = r.get('metrics', {}).get('compositionFailureDetails', [])
              if details:
                  failures.append({
                      'theme': r['theme'],
                      'scenario': r['scenario'],
                      'failures': r['failures'],
                      'bodyFont': r.get('metrics', {}).get('bodyFont'),
                      'compositionFailureDetails': details,
                      'emergencyDetails': r.get('metrics', {}).get('emergencyDetails', []),
                  })
          out = {
              'reference': '${{ steps.reference.outcome }}',
              'matrix': '${{ steps.matrix.outcome }}',
              'passed': d['passed'],
              'failed': d['failed'],
              'strictFailures': failures,
          }
          Path('build/qa-v107/dp-failure-frontier.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
          if '${{ steps.reference.outcome }}' != 'success':
              raise SystemExit('reference corpus failed')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v107-dp-failure-frontier
          path: build/qa-v107/dp-failure-frontier.json
          if-no-files-found: error
