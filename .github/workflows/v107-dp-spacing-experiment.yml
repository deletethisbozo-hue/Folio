name: v1.0.7 current English pattern probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-dp-spacing-experiment.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install current CTAN pattern engine checkout-only
        run: npm install --no-save --no-package-lock hyphen@1.14.1
      - name: Compare English pattern splits
        run: |
          node --input-type=module <<'NODE'
          import Hypher from 'hypher';
          import oldPatterns from 'hyphenation.en-us';
          import currentPackage from 'hyphen/en-us/index.js';
          import fs from 'node:fs';
          const { hyphenateSync: current } = currentPackage;
          const old = new Hypher(oldPatterns);
          const words = ['stranded','every','professional','excessive','accidental','careful','designer','protects','ordinary','extraordinary','overlooked','meaning','reader'];
          const result = [];
          for (const word of words) {
            const legacy = old.hyphenate(word).join('-');
            const modern = current(word, { html: false, minWordLength: 5 }).replaceAll('\u00ad', '-');
            result.push({ word, legacy, modern });
          }
          console.log(JSON.stringify(result, null, 2));
          fs.writeFileSync('english-pattern-probe.json', JSON.stringify(result, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v107-current-english-pattern-probe
          path: english-pattern-probe.json
          if-no-files-found: error
