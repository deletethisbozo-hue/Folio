name: v1.0.7 no-fit diagnostics

on:
  push:
    branches: [exp/v107-render-correction]
    paths:
      - '.github/workflows/v107-dp-spacing-experiment.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Limit matrix to representative font families
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/v107-theme-matrix.ts')
          s = p.read_text(encoding='utf-8')
          old = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          new = '  const probeNames = new Set(["decorative", "editorial", "modern", "ivory", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 5) throw new Error(`Expected exactly 5 diagnostic themes, found ${themes.length}`);\n'
          if s.count(old) != 1:
              raise SystemExit(f'theme anchor matches: {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Run representative matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Print composition diagnostics
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          if not p.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          out = {
              'matrixOutcome': '${{ steps.matrix.outcome }}',
              'passed': d['passed'],
              'failed': d['failed'],
              'failedScenarios': [],
          }
          for r in d['results']:
              if r.get('pass'):
                  continue
              m = r.get('metrics', {})
              out['failedScenarios'].append({
                  'theme': r['theme'],
                  'scenario': r['scenario'],
                  'failures': r.get('failures', []),
                  'bodyFont': m.get('bodyFont'),
                  'hyphenRate': m.get('hyphenRate'),
                  'rightError': m.get('maxRightErrorPx'),
                  'semanticGap': m.get('maxSemanticGapEm'),
                  'oneWordFinalLines': m.get('oneWordFinalLines'),
                  'compositionFailureDetails': m.get('compositionFailureDetails', []),
                  'emergencyDetails': m.get('emergencyDetails', []),
                  'dropcapOpening': m.get('dropcapOpening', []),
              })
          text = json.dumps(out, indent=2, ensure_ascii=False)
          Path('build/qa-v107/no-fit-diagnostics.json').write_text(text + '\n', encoding='utf-8')
          print(text)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v107-no-fit-diagnostics
          path: |
            build/qa-v107/no-fit-diagnostics.json
            build/qa-v107/theme-matrix.json
          if-no-files-found: error
