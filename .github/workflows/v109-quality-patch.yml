          must_replace("tests/ui-runtime.test.ts", '''  await stage("chapter renamed", () => page.waitForFunction(() => document.querySelector(".contents-row.selected")?.textContent?.includes("Renamed in UI")));
  await stage("renamed chapter body reloaded", () => page.waitForFunction(() => document.querySelector(".rich-editor")?.getAttribute("data-markdown")?.includes("HEADING EDITS MUST PRESERVE THIS ENTIRE CHAPTER BODY")));
  check("chapter name can be edited without deleting its body", true);''', '''  await stage("chapter renamed", () => page.waitForFunction(() => document.querySelector(".contents-row.selected")?.textContent?.includes("Renamed in UI")));
  await new Promise((resolve) => setTimeout(resolve, 250));
  const renameContinuity = await page.evaluate(() => {
    (window as any).__folioRenameObserver?.disconnect();
