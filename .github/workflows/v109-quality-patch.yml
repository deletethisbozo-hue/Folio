name: Folio 1.0.9 quality patch
# qualification revision: rendered-gap floor

on:
  push:
    branches:
      - release/v1.0.9
    paths:
      - .github/workflows/v109-quality-patch.yml

permissions:
  contents: write

concurrency:
  group: folio-v109-quality-patch
  cancel-in-progress: true

jobs:
  patch-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.9
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Apply quality patch
        run: |
          python3 scripts/v109-quality-patch.py
          python3 scripts/v109-spacing-followup.py
          git restore --source=HEAD -- themes/classic/theme.css
          npm version 1.0.9 --no-git-tag-version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
          "$PANDOC_BIN" --version | head -n 1
      - name: Typecheck
        run: npm run typecheck
      - name: Full formatter and UI suite
        run: npm test
      - name: Commit qualified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx web/src/compositor.ts tests/ui-runtime.test.ts package.json package-lock.json
          git commit -m "Fix Folio 1.0.9 composition and editing regressions"
          git push origin HEAD:release/v1.0.9
