name: Folio 1.0.9 quality patch

on:
  push:
    branches: ["release/v1.0.9"]
    paths:
      - ".github/workflows/v109-quality-patch.yml"

permissions:
  contents: write

concurrency:
  group: folio-v109-quality-patch
  cancel-in-progress: true

jobs:
  patch-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Apply 1.0.9 quality patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def must_replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected patch anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Rename stays in-place. The server already returns the authoritative
          # renamed document, so do not blank the editor and fetch the same body again.
          must_replace("web/src/App.tsx", '''  useEffect(() => {
    if (!project || !selectedId) return;
    let cancelled = false;
    setDocument(null);
    setSaveState("idle");
    api.section(project.projectId, selectedId).then((doc) => {
      if (cancelled) return;
      undoRef.current = []; redoRef.current = []; draftRef.current = doc.markdown;
      editorDomDirtyRef.current = false; editorDomGenerationRef.current++;
      setDocument(doc); setDraft(doc.markdown); setPreviewDraft(doc.markdown); setDirty(false);
    }).catch((e) => !cancelled && setError(e instanceof Error ? e.message : String(e)));
    return () => { cancelled = true; };
  }, [project?.projectId, selectedId, sectionRevision]);''', '''  useEffect(() => {
    if (!project || !selectedId) return;
    // Renaming can change a chapter slug/id. updateCurrentChapterHeading already
    // holds the authoritative renamed document, so keep that editor mounted
    // instead of clearing it and fetching the same manuscript again.
    if (document?.id === selectedId) return;
    let cancelled = false;
    setDocument(null);
    setSaveState("idle");
    api.section(project.projectId, selectedId).then((doc) => {
      if (cancelled) return;
      undoRef.current = []; redoRef.current = []; draftRef.current = doc.markdown;
      editorDomDirtyRef.current = false; editorDomGenerationRef.current++;
      setDocument(doc); setDraft(doc.markdown); setPreviewDraft(doc.markdown); setDirty(false);
    }).catch((e) => !cancelled && setError(e instanceof Error ? e.message : String(e)));
    return () => { cancelled = true; };
  }, [project?.projectId, selectedId, sectionRevision, document?.id]);''')

          must_replace("web/src/App.tsx", '''      await flushEditorDom();
      const summary = await api.reload(project.projectId);
      const liveDraft = draftRef.current;
      const draftChangedDuringSave = liveDraft !== draftAtStart;
      if (updated.id !== selectedId) { undoRef.current = []; redoRef.current = []; }
      setProject({ ...summary, meta: meta ?? summary.meta, typography });
      setMeta(meta ?? summary.meta);
      setTypography(typography);
      setSelectedId(updated.id);
      selectedRef.current = updated.id;
      setDocument(draftChangedDuringSave ? { ...updated, markdown: liveDraft } : updated);''', '''      await flushEditorDom();
      const liveDraft = draftRef.current;
      const draftChangedDuringSave = liveDraft !== draftAtStart;
      if (updated.id !== selectedId) { undoRef.current = []; redoRef.current = []; }
      // updateSectionHeading already re-ingests the authoritative source. A
      // second full-project reload made large books pause and briefly removed
      // the editor after every rename. Update only the summary row that changed.
      const renamedSummary: ProjectSummary = {
        ...project,
        sections: project.sections.map((section) => section.id === selectedId
          ? { ...section, id: updated.id, title: updated.title }
          : section),
        meta: meta ?? project.meta,
        typography,
      };
      setProject(renamedSummary);
      setMeta(meta ?? project.meta);
      setTypography(typography);
      setSelectedId(updated.id);
      selectedRef.current = updated.id;
      setDocument(draftChangedDuringSave ? { ...updated, markdown: liveDraft } : updated);''')

          # Preserve inline semantic wrappers through line composition. 1.0.8's
          # Range cloned word spans but could drop their surrounding <strong>/<em>.
          must_replace("web/src/compositor.ts", '''  rightProtrusion: number;
};''', '''  rightProtrusion: number;
  atomicRoot: Element | null;
};''')

          must_replace("web/src/compositor.ts", '''    const atomic = node.closest(ATOMIC_INLINE);
    let atomicId = 0;
    if (atomic) {
      atomicId = atomicIds.get(atomic) ?? nextAtomicId++;
      atomicIds.set(atomic, atomicId);
    }''', '''    const atomic = node.closest(ATOMIC_INLINE);
    let atomicRoot = atomic;
    while (atomicRoot?.parentElement && atomicRoot.parentElement !== paragraph && atomicRoot.parentElement.matches(ATOMIC_INLINE)) {
      atomicRoot = atomicRoot.parentElement;
    }
    let atomicId = 0;
    if (atomicRoot) {
      atomicId = atomicIds.get(atomicRoot) ?? nextAtomicId++;
      atomicIds.set(atomicRoot, atomicId);
    }''')

          must_replace("web/src/compositor.ts", '''    const canBreakBefore = hyphenBefore || structuralBreakBefore;''', '''    // Do not split inside a semantic inline wrapper. Keeping the complete
    // <strong>/<em>/<i>/<b> range on one line lets cloneLineFragment retain the
    // wrapper instead of flattening formatted text into plain spans.
    const canBreakBefore = (hyphenBefore && !(atomicId && atomicId === previousAtomic)) || structuralBreakBefore;''')

          must_replace("web/src/compositor.ts", '''      characters: cleanText.length,
      rightProtrusion,
    };''', '''      characters: cleanText.length,
      rightProtrusion,
      atomicRoot,
    };''')

          must_replace("web/src/compositor.ts", '''  const configuredWordSpacing = fontSize * (emergency || finalCompression ? 0.12 : 0.099);
  // Cap the rendered semantic gap, including positive tracking and the allowed 1% glyph stretch.
  const semanticGapHeadroom = Math.max(0, fontSize * 0.3685 / 1.01 - spaceWidth - fontSize * 0.003);
  const maxWordSpacing = Math.min(configuredWordSpacing, semanticGapHeadroom);
  const relaxedCompressionEm = 0.120;
  // Windows and Linux rasterize the same serif faces a little differently.
  // Keep the normal line fitter inside the release gate, but give Polish prose
  // enough bounded compression headroom to choose a clean word boundary instead
  // of exceeding the 0.45 section hyphen-density ceiling. The optimiser still
  // pays badness for every compressed gap, so this is an available rescue path,
  // not the new preferred spacing.
  const strictCompressionEm = 0.099;
  const minWordSpacing = emergency || finalCompression
    ? -(fontSize * relaxedCompressionEm)
    : -(fontSize * strictCompressionEm);''', '''  // Book justification must never make ordinary spaces look as if words were
  // typed together. Prefer another break/hyphen over typographically implausible
  // expansion or compression.
  const configuredWordSpacing = fontSize * (emergency || finalCompression ? 0.09 : 0.075);
  const semanticGapHeadroom = Math.max(0, fontSize * 0.34 / 1.01 - spaceWidth - fontSize * 0.003);
  const maxWordSpacing = Math.min(configuredWordSpacing, semanticGapHeadroom);
  const relaxedCompressionEm = 0.075;
  const strictCompressionEm = 0.055;
  const minimumRenderedGapEm = emergency || finalCompression ? 0.18 : 0.20;
  const gapFloorWordSpacing = fontSize * minimumRenderedGapEm - spaceWidth;
  const minWordSpacing = Math.max(
    -(fontSize * (emergency || finalCompression ? relaxedCompressionEm : strictCompressionEm)),
    gapFloorWordSpacing,
  );''')

          must_replace("web/src/compositor.ts", '''const GLYPH_SCALE_STEP = 0.0005;
const GLYPH_SCALE_COUNT = 41;''', '''// 0.05% buckets created twice as many DP states for no visible benefit. A
// 0.1% grid keeps the same ±1% optical correction range while halving this
// dimension of the line-breaking state space.
const GLYPH_SCALE_STEP = 0.001;
const GLYPH_SCALE_COUNT = 21;''')
          must_replace("web/src/compositor.ts", '''  for (let step = -20; step <= 20; step++) {
    const glyphScale = 1 + step * 0.0005;''', '''  for (let step = -10; step <= 10; step++) {
    const glyphScale = 1 + step * 0.001;''')

          must_replace("web/src/compositor.ts", '''function cloneLineFragment(document: Document, words: Word[], start: number, end: number): DocumentFragment {
  const range = document.createRange();
  range.setStartBefore(words[start].node);
  range.setEndAfter(words[end - 1].node);
  return range.cloneContents();
}''', '''function cloneLineFragment(document: Document, words: Word[], start: number, end: number): DocumentFragment {
  const range = document.createRange();
  // Line breaks are forbidden inside atomic inline formatting, so a line that
  // touches a formatted range contains that whole range. Expand the Range to
  // its semantic wrapper; otherwise Range.cloneContents() returns only the
  // internal .folio-word spans and silently loses bold/italic/links.
  range.setStartBefore(words[start].atomicRoot ?? words[start].node);
  range.setEndAfter(words[end - 1].atomicRoot ?? words[end - 1].node);
  return range.cloneContents();
}''')

          must_replace("web/src/compositor.ts", '''  }, { root: null, rootMargin: "1600px 0px", threshold: 0 });''', '''  }, { root: null, rootMargin: "700px 0px", threshold: 0 });''')
          must_replace("web/src/compositor.ts", '''  for (const paragraph of paragraphs.slice(0, 4)) {''', '''  for (const paragraph of paragraphs.slice(0, 2)) {''')

          # Rebuild Black Psalter around the two parts worth keeping: gothic
          # heading typography and the drop cap. Remove the full-page SVG frame.
          Path("themes/classic/theme.css").write_text(r'''/* ============================================================
   Black Psalter — restrained gothic book interior.
   The display face and illuminated drop cap carry the character; body text
   stays on a clean page without full-page SVG frames or overlays.
   ============================================================ */

body {
  font-family: "EB Garamond", Garamond, Georgia, serif;
  line-height: 1.42;
  color: #171310;
  background: #efe8dc;
}

main.book { counter-reset: black-psalter; }

section.chapter {
  counter-increment: black-psalter;
  position: relative;
  padding: 1.4em 1.1em 2em;
  background: #faf5eb;
}

section.chapter > h1,
h1.chapter {
  position: relative;
  max-width: 88%;
  margin: .45em auto 1.05em;
  padding: .42em .3em .68em;
  text-align: center;
  color: #17110f;
  font-family: "Grenze Gotisch", "EB Garamond", serif;
  font-size: 2.34em;
  font-weight: 680;
  line-height: .98;
  letter-spacing: -.014em;
  border-top: 1px solid #7a171d;
  border-bottom: 3px double #17110f;
}

section.chapter > h1::before {
  content: "LIBER " counter(black-psalter, upper-roman);
  display: block;
  margin-bottom: .85em;
  color: #7a171d;
  font-family: Cinzel, "EB Garamond", serif;
  font-size: .25em;
  font-weight: 700;
  letter-spacing: .28em;
  text-transform: uppercase;
}

section.chapter > h1::after {
  content: "◆";
  display: block;
  width: 2.8em;
  margin: .72em auto -.2em;
  color: #7a171d;
  font-family: "EB Garamond", serif;
  font-size: .22em;
  letter-spacing: .45em;
}

.chapter-subtitle {
  max-width: 78%;
  margin: -.35em auto 1em;
}
.chapter-subtitle p {
  margin: 0;
  text-align: center;
  font-size: .88em;
  font-style: italic;
  color: #66584c;
}

.dropcap {
  float: left;
  min-width: .78em;
  margin: .035em .15em 0 0;
  padding: .075em .09em .11em;
  border: 0;
  outline: 1px solid #7a171d;
  outline-offset: 3px;
  background: #17110f;
  color: #faf5eb;
  font-family: "EB Garamond Initials", "Grenze Gotisch", "EB Garamond", serif;
  font-size: 4.05em;
  font-weight: 700;
  line-height: .72;
  text-align: center;
}

section.chapter > p:first-of-type { margin-top: .25em; }
section.chapter > p:not(:first-of-type):not(.scene-break) { text-indent: .95em; }

.scene-break {
  width: 42%;
  margin: 1.45em auto 1.55em;
  text-align: center;
  color: #7a171d;
  letter-spacing: .18em;
}

section.titlepage > h1 {
  font-family: "Grenze Gotisch", "EB Garamond", serif;
  font-size: 2.4em;
  color: #17110f;
}
.tp-subtitle { color: #7a171d; font-variant: small-caps; letter-spacing: .08em; }
.tp-author { font-family: Cinzel, "EB Garamond", serif; letter-spacing: .1em; }

section.frontmatter > h1,
section.backmatter > h1 {
  text-align: center;
  font-family: Cinzel, "EB Garamond", serif;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: #17110f;
  border-top: 1px solid #7a171d;
  border-bottom: 1px solid #17110f;
  padding: .58em 0;
}

@media print {
  section.chapter > h1 { margin-top: .78in; }
}
''', encoding="utf-8")

          # Regression tests: inline emphasis must survive the compositor,
          # compressed semantic gaps get a real floor, and renaming may never
          # unmount/blank the manuscript body.
          must_replace("tests/ui-runtime.test.ts", '''    transfer.setData("text/html", "<html><head><style>.T1{font-weight:bold}</style></head><body><p>Libre first <span class=\\"T1\\">bold</span></p><p>Libre second</p><ul><li>Writer list</li></ul></body></html>");''', '''    transfer.setData("text/html", "<html><head><style>.T1{font-weight:bold}</style></head><body><p>Libre first <span class=\\"T1\\">bold</span> and <em>italic</em></p><p>Libre second</p><ul><li>Writer list</li></ul></body></html>");''')
          must_replace("tests/ui-runtime.test.ts", '''    return markdown.includes("Libre first **bold**") && markdown.includes("Libre second") && markdown.includes("- Writer list");''', '''    return markdown.includes("Libre first **bold** and *italic*") && markdown.includes("Libre second") && markdown.includes("- Writer list");''')
          must_replace("tests/ui-runtime.test.ts", '''  check("Writer class-based rich text preserves paragraphs, bold and lists", true);''', '''  check("Writer class-based rich text preserves paragraphs, bold and lists", true);
  await stage("composed bold and italic survive preview", () => page.waitForFunction(() => {
    const doc = document.querySelector("iframe")?.contentDocument;
    const strong = [...(doc?.querySelectorAll<HTMLElement>("strong") ?? [])].find((node) => node.textContent?.includes("bold"));
    const em = [...(doc?.querySelectorAll<HTMLElement>("em") ?? [])].find((node) => node.textContent?.includes("italic"));
    return Boolean(strong && em && Number.parseFloat(getComputedStyle(strong).fontWeight) >= 600 && getComputedStyle(em).fontStyle === "italic");
  }, { timeout: 30000 }));
  check("bold and italic remain semantic after professional line composition", true);''')

          must_replace("tests/ui-runtime.test.ts", '''        Math.max(...semanticGaps, 0) <= fontSize * .42 &&
        lines.at(-1)?.classList.contains("folio-line-natural") === true &&''', '''        Math.max(...semanticGaps, 0) <= fontSize * .42 &&
        Math.min(...semanticGaps, fontSize) >= fontSize * .17 &&
        lines.at(-1)?.classList.contains("folio-line-natural") === true &&''')
          must_replace("tests/ui-runtime.test.ts", '''      maxSemanticGap: Math.max(...semanticGaps, 0),
      dropcapOk,''', '''      maxSemanticGap: Math.max(...semanticGaps, 0),
      minSemanticGap: Math.min(...semanticGaps, fontSize),
