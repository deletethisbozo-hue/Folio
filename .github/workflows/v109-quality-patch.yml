          must_replace("tests/ui-runtime.test.ts", '''  await page.click(".section-title-button");
  await stage("chapter title editor", () => page.waitForSelector(".section-title-input"));''', '''  await page.evaluate(() => {
    const paper = document.querySelector(".editor-paper")!;
    (window as any).__folioRenameBlanked = false;
    const observer = new MutationObserver(() => {
      const editor = paper.querySelector(".rich-editor") as HTMLElement | null;
