name: Run preview navigation repair helper

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-feature-patch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preview-connection-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Apply repair
        run: python .github/scripts/repair-preview-follow.py
      - name: Remove helper
        run: rm .github/scripts/repair-preview-follow.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: UI runtime qualification
        run: node --import tsx tests/ui-runtime.test.ts
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize editor-to-preview word navigation"
          git push origin HEAD:fix/preview-connection-recovery
