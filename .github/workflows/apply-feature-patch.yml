# temporary repair workflow; removed after the feature branch is green
name: Repair editor preview follow-through

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-feature-patch.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preview-connection-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Repair click-follow lifecycle and legacy profile name
        shell: python
        run: |
          from pathlib import Path

          p = Path("web/src/App.tsx")
          s = p.read_text(encoding="utf-8")
          old = '''    const section = doc.getElementById(selectedId)
      ?? doc.querySelector<HTMLElement>("main.book > section.level1, main.book > section.chapter, main.book > section.backmatter");
'''
          new = '''    const pagedSection = previewMode === "print"
      ? Array.from(doc.querySelectorAll<HTMLElement>(".pagedjs_page section")).find((candidate) => candidate.id === selectedId) ?? null
      : null;
    const section = pagedSection ?? doc.getElementById(selectedId)
      ?? doc.querySelector<HTMLElement>("main.book > section.level1, main.book > section.chapter, main.book > section.backmatter");
'''
          if s.count(old) != 1:
              raise SystemExit(f"preview section lookup count={s.count(old)}")
          s = s.replace(old, new, 1)

          old = '''    registry.delete("folio-editor-word");
    registry.set("folio-editor-word", new HighlightCtor(...ranges));

    const range = ranges[0];
'''
          new = '''    registry.delete("folio-editor-word");
    registry.set("folio-editor-word", new HighlightCtor(...ranges));
    // Once a concrete range exists, the navigation request is fulfilled. Do not
    // keep it pending and re-scroll later while the user is typing or pasting.
    pendingPreviewWordRef.current = null;

    const range = ranges[0];
'''
          if s.count(old) != 1:
              raise SystemExit(f"highlight install block count={s.count(old)}")
          s = s.replace(old, new, 1)

          old = '''      clearPreviewHighlight(previewRef.current?.contentDocument);
      if (pendingPreviewWordRef.current?.ordinal === target.ordinal) pendingPreviewWordRef.current = null;
      previewHighlightTimerRef.current = null;
    }, 1050);

    if (!retry && previewMode !== "print") {
      window.setTimeout(() => {
        if (pendingPreviewWordRef.current?.ordinal === target.ordinal) highlightPreviewWord(target, true);
      }, 220);
    }
    return true;
'''
          new = '''      clearPreviewHighlight(previewRef.current?.contentDocument);
      previewHighlightTimerRef.current = null;
    }, 1050);
    return true;
'''
          if s.count(old) != 1:
              raise SystemExit(f"highlight retry block count={s.count(old)}")
          s = s.replace(old, new, 1)
          s = s.replace('function highlightPreviewWord(target: { ordinal: number }, retry = false): boolean {', 'function highlightPreviewWord(target: { ordinal: number }): boolean {', 1)
          p.write_text(s, encoding="utf-8")

          p = Path("tests/ui-runtime.test.ts")
          s = p.read_text(encoding="utf-8")
          if s.count('"kindle-oasis"') != 1:
              raise SystemExit(f"legacy kindle-oasis count={s.count(chr(34) + 'kindle-oasis' + chr(34))}")
          s = s.replace('"kindle-oasis"', '"kindle-7"', 1)
          s = s.replace('\ncheck("preview offers size-based Kindle, Kobo, phone, tablet and print profiles",', '\n  check("preview offers size-based Kindle, Kobo, phone, tablet and print profiles",', 1)
          s = s.replace('\n  deviceModes.length === 12', '\n    deviceModes.length === 12', 1)
          s = s.replace('\n  && ["kindle-6"', '\n    && ["kindle-6"', 1)
          s = s.replace('\n  deviceModes.join(", "));\nawait page.select', '\n    deviceModes.join(", "));\n  await page.select', 1)
          s = s.replace('\nawait stage("switch to phone size class"', '\n  await stage("switch to phone size class"', 1)
          p.write_text(s, encoding="utf-8")
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted UI runtime suite
        run: node --import tsx tests/ui-runtime.test.ts
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx tests/ui-runtime.test.ts
          git commit -m "Stabilize editor-to-preview word navigation"
          git push origin HEAD:fix/preview-connection-recovery
