# temporary repair workflow; removed after the feature branch is green
name: Repair grouped preview runtime assertion

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-feature-patch.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preview-connection-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Update stale device assertion
        shell: python
        run: |
          from pathlib import Path
          p = Path("tests/ui-runtime.test.ts")
          s = p.read_text(encoding="utf-8")
          old = '''  const deviceModes = await page.$$eval('select[aria-label="Preview device"] option', (items) => items.map((item) => (item as HTMLOptionElement).value));
            check("preview offers Kindle, tablet, phone, Android and print profiles", deviceModes.length === 6, deviceModes.join(", "));
            await page.select('select[aria-label="Preview device"]', "phone-6-1");
            await stage("switch to iPhone device", () => page.waitForSelector(".reader-device.device-iphone"));
          '''
          if old not in s:
              old = '''  const deviceModes = await page.$$eval('select[aria-label="Preview device"] option', (items) => items.map((item) => (item as HTMLOptionElement).value));
          check("preview offers Kindle, tablet, phone, Android and print profiles", deviceModes.length === 6, deviceModes.join(", "));
          await page.select('select[aria-label="Preview device"]', "phone-6-1");
          await stage("switch to iPhone device", () => page.waitForSelector(".reader-device.device-iphone"));
          '''
          if old not in s:
              raise SystemExit("legacy device assertion block not found")
          new = '''  const deviceModes = await page.$$eval('select[aria-label="Preview device"] option', (items) => items.map((item) => (item as HTMLOptionElement).value));
          check("preview offers size-based Kindle, Kobo, phone, tablet and print profiles",
            deviceModes.length === 12
            && ["kindle-6", "kindle-6-8", "kindle-7", "kobo-6", "kobo-7", "kobo-8", "phone-6-1", "phone-6-7", "tablet-8", "tablet-11", "tablet-13", "print"].every((mode) => deviceModes.includes(mode)),
            deviceModes.join(", "));
          await page.select('select[aria-label="Preview device"]', "phone-6-1");
          await stage("switch to phone size class", () => page.waitForSelector('.reader-device.device-phone-6-1[data-device-family="phone"]'));
          '''
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Commit assertion repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui-runtime.test.ts
          git commit -m "Update runtime assertions for size-based previews"
          git push origin HEAD:fix/preview-connection-recovery
