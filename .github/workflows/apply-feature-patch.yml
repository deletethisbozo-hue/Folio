# temporary dispatcher; removed after the feature branch is patched
name: Apply pending preview feature patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-feature-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preview-connection-recovery
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply-device-preview.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add grouped size-based previews and editor word navigation"
          git push origin HEAD:fix/preview-connection-recovery
