name: Folio 1.0.9 remove Black Psalter

on:
  push:
    branches:
      - fix/v1.0.9-remove-black-psalter

permissions:
  contents: write

jobs:
  windows-qa:
    if: github.event.head_commit.message != 'Remove Black Psalter theme from Folio 1.0.9'
    runs-on: windows-2025
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe
    steps:
      - name: Check out removal branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.9-remove-black-psalter
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply complete Black Psalter removal
        run: python scripts/v109-remove-black-psalter.py

      - name: Verify no active Black Psalter implementation remains
        shell: python
        run: |
          from pathlib import Path
          roots = [Path("server"), Path("web"), Path("themes"), Path("samples")]
          bad = []
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in {".ts", ".tsx", ".js", ".mjs", ".css", ".yaml", ".yml", ".json", ".md"}:
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  if "Black Psalter" in text or '"classic"' in text or "theme: classic" in text:
                      bad.append(str(path))
          if Path("themes/classic/theme.css").exists():
              bad.append("themes/classic/theme.css")
          if bad:
              raise SystemExit("Retired Black Psalter references remain in active product/sample files: " + ", ".join(sorted(set(bad))))
          print("Black Psalter implementation is absent from active product/sample files.")

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable was not found." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install pinned Chromium runtime
        shell: pwsh
        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "152\.0\.7977\.75" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell was not installed." }

      - name: Typecheck
        run: npm run typecheck

      - name: Full formatter and UI suite
        run: npm test

      - name: Build web and server
        run: npm run build

      - name: Verify patch cleanliness
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          if (-not (git diff --name-only | Select-String -SimpleMatch "themes/classic/theme.css")) { throw "Black Psalter stylesheet was not deleted." }

      - name: Commit qualified removal
        shell: pwsh
        run: |
          git config user.name "Folio Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A server/api.ts server/pipeline/types.ts server/pipeline/themes.ts server/pipeline/ingest.ts themes/classic/theme.css samples/clockwork-garden/book.yaml tests/folio-runtime.test.ts tests/ui-runtime.test.ts tests/acceptance.test.ts scripts/packaged-ui-smoke.mjs
          if (git diff --cached --quiet) { throw "Removal patch produced no staged changes." }
          git commit -m "Remove Black Psalter theme from Folio 1.0.9"
          git push origin HEAD:fix/v1.0.9-remove-black-psalter
