name: Folio 2.0 final test assertion patch

on:
  push:
    branches: ["release/v2.0.0"]
    paths:
      - ".github/workflows/v2-fix-final-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - name: Update final 14-theme assertions
        shell: python
        run: |
          from pathlib import Path

          runtime = Path("tests/folio-runtime.test.ts")
          text = runtime.read_text(encoding="utf-8")
          old = 'const expectedThemes = ["blackletter", "stanza", "witchlight", "revenant", "solstice", "literary", "necropolis", "nocturne", "obsidian", "grimoire", "ivory", "heritage", "decorative", "cloister", "cathedral", "aubade"];'
          new = 'const expectedThemes = ["blackletter", "stanza", "witchlight", "revenant", "solstice", "literary", "nocturne", "obsidian", "grimoire", "ivory", "heritage", "decorative", "cathedral", "aubade"];'
          if old not in text:
              raise SystemExit("folio-runtime expectedThemes assertion was not found")
          text = text.replace(old, new, 1)
          text = text.replace('Folio 2.0 registers exactly the 16 curated themes', 'Folio 2.0 registers exactly the 14 curated themes', 1)
          runtime.write_text(text, encoding="utf-8")

          ui = Path("tests/ui-runtime.test.ts")
          text = ui.read_text(encoding="utf-8")
          replacements = {
              'check("Folio 2.0 exposes only the 16 curated visual themes", themeCount === 16, String(themeCount));':
                  'check("Folio 2.0 exposes only the 14 curated visual themes", themeCount === 14, String(themeCount));',
              'check("curated theme cards remain materially different", distinctCards >= 14, String(distinctCards) + " distinct");':
                  'check("curated theme cards retain broad visual differentiation", distinctCards >= 12, String(distinctCards) + " distinct");',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"ui-runtime assertion was not found: {old}")
              text = text.replace(old, new, 1)
          ui.write_text(text, encoding="utf-8")
      - name: Commit patched assertions
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Assertions are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/folio-runtime.test.ts tests/ui-runtime.test.ts
          git commit -m "Align Folio 2.0 tests with final 14-theme set"
          git push origin HEAD:release/v2.0.0
