name: Fix v1.0.7 visual QA compressed-final declaration

on:
  push:
    branches:
      - fix/v1.0.7
    paths:
      - .github/workflows/v107-fix-qa-compressed-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
          fetch-depth: 0
      - name: Add compressed-final classification variable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/v107-visual-qa.ts')
          text = p.read_text()
          old = '            const spacing = Number(line.dataset.folioWordSpacing ?? 0) / fontSize;\n            const relaxed = line.dataset.folioRelaxed === "true";'
          new = '            const spacing = Number(line.dataset.folioWordSpacing ?? 0) / fontSize;\n            const relaxed = line.dataset.folioRelaxed === "true";\n            const compressedFinal = line.classList.contains("folio-line-final-compressed");'
          if text.count(old) != 1:
              raise SystemExit('visual QA spacing/classification block changed unexpectedly')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit QA fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v107-visual-qa.ts
          git diff --cached --check
          git commit -m "Fix v1.0.7 visual rescue classification"
          git push origin HEAD:fix/v1.0.7
