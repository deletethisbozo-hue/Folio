name: Folio 3.2 CI

on:
  push:
    branches: [feature/3.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-3-2-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
    steps:
      - name: Check out Folio
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable was not found after extraction." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe
          "PANDOC_BIN=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime regression with full stack
        run: node --import tsx tests/folio-runtime.test.ts

      - name: Folio 3.2 feature regressions
        run: node --import tsx --test tests/v320-design-preview.test.ts

      - name: Focused UI regressions
        run: npm test -- ui-coherence v206-ui-regression v300-second-draft

      - name: Build web
        run: npm run build:web

      - name: Build server
        run: npm run build:server

      - name: Install Chromium for 3.2 UI smoke
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Folio 3.2 end-to-end UI smoke
        run: node --import tsx scripts/v320-ui-smoke.ts
