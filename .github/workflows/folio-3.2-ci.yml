name: Folio 3.2 CI

on:
  push:
    branches: [feature/3.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-3-2-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out Folio
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      - name: Build server
        run: npm run build:server
