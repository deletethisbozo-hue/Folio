name: Temporary v1.0.7 Paperwhite measure patch

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-paperwhite-measure-patch.yml"
      - "scripts/patch-v107-paperwhite-measure.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Paperwhite measure calibration
        run: python3 scripts/patch-v107-paperwhite-measure.py
      - name: Commit calibrated reader profile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/preview-runtime.ts
          git diff --cached --quiet && exit 0
          git commit -m "Calibrate Paperwhite measure for professional justification"
          git push origin HEAD:fix/v1.0.7
