name: Recover Folio 2.0.7 Release

on:
  push:
    branches:
      - release/v2.0.7-recover-upload

permissions:
  actions: write
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_RUN: "35247596282"
      RECOVERY_RELEASE_ID: "390905988"
      TAG: "v2.0.7"
      TARGET_SHA: "16d57b5cb2b39293af9a5788686d7b18f5eef6ee"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure source qualification run has stopped
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
          echo "source run status: $status"
          if [ "$status" != "completed" ]; then
            gh run cancel "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY"
            for i in $(seq 1 36); do
              status="$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
              echo "source run status: $status"
              if [ "$status" = "completed" ]; then
                break
              fi
              sleep 5
            done
          fi
          test "$status" = "completed"

      - name: Download already-qualified Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "Folio-2.0.7-Windows" --dir recovered
          find recovered -maxdepth 6 -type f -printf '%p %s bytes\n' | sort

      - name: Verify recovered binaries against sha256.txt
        shell: bash
        run: |
          set -euo pipefail
          setup="$(find recovered -type f -name 'Folio-2.0.7-setup.exe' -print -quit)"
          portable="$(find recovered -type f -name 'Folio-2.0.7-portable.exe' -print -quit)"
          sums="$(find recovered -type f -name 'sha256.txt' -print -quit)"
          test -n "$setup" && test -s "$setup"
          test -n "$portable" && test -s "$portable"
          test -n "$sums" && test -s "$sums"
          expected_setup="$(awk '$2 == "Folio-2.0.7-setup.exe" {print tolower($1)}' "$sums")"
          expected_portable="$(awk '$2 == "Folio-2.0.7-portable.exe" {print tolower($1)}' "$sums")"
          actual_setup="$(sha256sum "$setup" | awk '{print tolower($1)}')"
          actual_portable="$(sha256sum "$portable" | awk '{print tolower($1)}')"
          test -n "$expected_setup" && test "$actual_setup" = "$expected_setup"
          test -n "$expected_portable" && test "$actual_portable" = "$expected_portable"
          printf 'SETUP=%s\nPORTABLE=%s\nSUMS=%s\n' "$setup" "$portable" "$sums" >> "$GITHUB_ENV"
          echo "setup sha256: $actual_setup"
          echo "portable sha256: $actual_portable"

      - name: Validate exact recovery draft
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID" > recovery-release.json
          jq -e --arg tag "$TAG" --arg target "$TARGET_SHA" '
            .tag_name == $tag and
            .target_commitish == $target and
            .draft == true and
            .prerelease == false and
            .name == "Folio 2.0.7 for Windows"
          ' recovery-release.json >/dev/null
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Unexpected immutable tag $TAG already exists before publishing the recovery draft" >&2
            exit 1
          fi

      - name: Upload verified assets directly and publish draft
        shell: bash
        run: |
          set -euo pipefail

          upload_asset() {
            local file="$1"
            local name
            name="$(basename "$file")"

            for attempt in 1 2 3; do
              echo "Uploading $name, attempt $attempt/3"

              existing_ids="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID/assets" --jq ".[] | select(.name == \"$name\") | .id" || true)"
              if [ -n "$existing_ids" ]; then
                while read -r asset_id; do
                  [ -n "$asset_id" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                done <<< "$existing_ids"
              fi

              rm -f upload-response.json
              if curl --fail-with-body --silent --show-error \
                --connect-timeout 20 --max-time 300 \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID/assets?name=$name" \
                -o upload-response.json; then
                if jq -e --arg name "$name" '.name == $name and .state == "uploaded"' upload-response.json >/dev/null; then
                  echo "Uploaded $name"
                  return 0
                fi
              fi

              echo "Upload attempt $attempt failed for $name" >&2
              [ -f upload-response.json ] && cat upload-response.json >&2 || true
              sleep $((attempt * 5))
            done

            echo "Giving up uploading $name after 3 attempts" >&2
            return 1
          }

          upload_asset "$SETUP"
          upload_asset "$PORTABLE"
          upload_asset "$SUMS"

          gh api "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID/assets" > release-assets.json
          jq -e '
            length == 3 and
            all(.state == "uploaded") and
            ([.[].name] | sort) == (["Folio-2.0.7-portable.exe", "Folio-2.0.7-setup.exe", "sha256.txt"] | sort)
          ' release-assets.json >/dev/null

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RECOVERY_RELEASE_ID" -F draft=false >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > published-release.json
          jq -e --arg target "$TARGET_SHA" '
            .draft == false and
            .prerelease == false and
            .target_commitish == $target and
            (.assets | length) == 3 and
            all(.assets[]; .state == "uploaded")
          ' published-release.json >/dev/null
          jq '{tag_name, target_commitish, draft, published_at, html_url, assets: [.assets[] | {name, state, size, digest, browser_download_url}]}' published-release.json
