name: Prepare Folio 2.0.5 version

on:
  push:
    branches: ["fix/v2.0.5-ui-media-coherence"]
    paths:
      - ".github/workflows/prepare-v205-version.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.5-ui-media-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bump package metadata to 2.0.5
        run: npm version 2.0.5 --no-git-tag-version --allow-same-version
      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='2.0.5'||l.version!=='2.0.5'||l.packages[''].version!=='2.0.5') throw new Error('2.0.5 version metadata mismatch')"
      - name: Commit package metadata only
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package metadata already at 2.0.5"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump Folio to 2.0.5 [skip ci]"
          git push origin HEAD:fix/v2.0.5-ui-media-coherence
