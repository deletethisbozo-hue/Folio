name: Apply Folio 2.0.1 theme wait fix

on:
  push:
    branches: ["release/v2.0.1"]
    paths:
      - "scripts/patch-v201-theme-wait.mjs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Patch asynchronous theme qualification wait
        run: node scripts/patch-v201-theme-wait.mjs
      - name: Commit test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui-runtime.test.ts
          git commit -m "Fix Folio 2.0.1 theme qualification race"
          git push origin HEAD:release/v2.0.1
