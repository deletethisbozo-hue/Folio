name: Folio 1.0.11 print and UI quality

on:
  push:
    branches:
      - release/v1.0.11
    paths:
      - .github/workflows/v1011-quality.yml

permissions:
  contents: write

concurrency:
  group: folio-v1011-quality
  cancel-in-progress: true

jobs:
  windows-qa:
    runs-on: windows-2025
    timeout-minutes: 70
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out 1.0.11 branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.11
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply print and UI patch
        shell: pwsh
        run: |
          python scripts/v1011-quality-patch.py
          npm version 1.0.11 --no-git-tag-version

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable was not found." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install pinned Chromium runtime
        shell: pwsh
        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "152\.0\.7977\.75" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell was not installed." }

      - name: Typecheck
        run: npm run typecheck

      - name: Full formatter and UI suite
        run: npm test

      - name: Build web and server
        run: npm run build

      - name: Windows visual and typesetting QA
        run: node --import tsx scripts/v107-visual-qa.ts

      - name: Check qualified diff
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          git diff -- server/print.ts server/pipeline/render-print.ts server/pipeline/render-pdf.ts web/src/editorial-studio.css tests/acceptance.test.ts package.json package-lock.json

      - name: Upload visual QA proof
        uses: actions/upload-artifact@v4
        with:
          name: Folio-1.0.11-visual-QA
          path: build/qa-v107/*
          if-no-files-found: error

      - name: Commit qualified 1.0.11 patch
        shell: pwsh
        run: |
          git config user.name "Folio Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/print.ts server/pipeline/render-print.ts server/pipeline/render-pdf.ts web/src/editorial-studio.css tests/acceptance.test.ts package.json package-lock.json
          if (git diff --cached --quiet) { throw "Qualified 1.0.11 patch produced no staged changes." }
          git commit -m "Fix Folio 1.0.11 print clipping and polish UI"
          git push origin HEAD:release/v1.0.11
