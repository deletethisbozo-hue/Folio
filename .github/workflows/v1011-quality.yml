name: Folio 1.0.11 print and UI quality

on:
  push:
    branches:
      - release/v1.0.11
    paths:
      - .github/workflows/v1011-quality.yml
      - scripts/v1011-gap-patch.py
      - scripts/v1011-paged-gap-repair.py

permissions:
  contents: write

concurrency:
  group: folio-v1011-quality
  cancel-in-progress: true

jobs:
  windows-qa:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out 1.0.11 branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.11
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply physical word-gap correction
        run: python scripts/v1011-gap-patch.py

      - name: Apply final Paged.js gap repair
        run: python scripts/v1011-paged-gap-repair.py

      - name: Verify 1.0.11 version consistency
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "1.0.11") { throw "Expected qualified Folio 1.0.11, found $version" }
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!==l.version||p.version!==l.packages[''].version) throw new Error('version mismatch')"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable was not found." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install pinned Chromium runtime
        shell: pwsh
        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "152\.0\.7977\.75" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell was not installed." }

      - name: Typecheck
        run: npm run typecheck

      - name: Full formatter and UI suite
        run: npm test

      - name: Build web and server
        run: npm run build

      - name: Windows visual and typesetting QA
        run: node --import tsx scripts/v107-visual-qa.ts

      - name: Full Print PDF trim matrix with physical gap gate
        run: node --import tsx scripts/print-matrix-qa.ts

      - name: Verify qualified semantic-gap diff
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          $changed = @(git diff --name-only | Sort-Object)
          $expected = @("server/pipeline/compositor.ts", "server/pipeline/render-print.ts") | Sort-Object
          if (($changed -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected qualified diff: $($changed -join ', ')"
          }

      - name: Upload visual QA proof
        uses: actions/upload-artifact@v4
        with:
          name: Folio-1.0.11-visual-QA-gap-final
          path: build/qa-v107/*
          if-no-files-found: error

      - name: Upload Print PDF matrix proof
        uses: actions/upload-artifact@v4
        with:
          name: Folio-1.0.11-print-matrix-gap-final
          path: build/qa-print-matrix/*
          if-no-files-found: error

      - name: Commit qualified semantic-gap fix
        shell: pwsh
        run: |
          git config user.name "Folio Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/pipeline/compositor.ts server/pipeline/render-print.ts
          if (git diff --cached --quiet) { throw "Qualified semantic-gap patch produced no product changes." }
          git commit -m "Fix Folio 1.0.11 print word spacing"
          git push origin HEAD:release/v1.0.11
