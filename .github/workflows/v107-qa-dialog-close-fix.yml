name: Temporary v1.0.7 QA dialog close fix

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-qa-dialog-close-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
          fetch-depth: 0
      - name: Stabilize Book Details dialog close in visual QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/v107-visual-qa.ts")
          text = path.read_text(encoding="utf-8")
          old = "    await page.click('.folio-dialog[aria-label=\"Book Details\"] header button[aria-label=\"Close\"]');\n    await page.waitForSelector('.folio-dialog[aria-label=\"Book Details\"]', { hidden: true, timeout: 5_000 });\n"
          new = "    let bookDetailsClosed = false;\n    for (let attempt = 0; attempt < 3 && !bookDetailsClosed; attempt++) {\n      await page.$eval(\n        '.folio-dialog[aria-label=\"Book Details\"] header button[aria-label=\"Close\"]',\n        (node) => (node as HTMLButtonElement).click(),\n      );\n      bookDetailsClosed = await page.waitForSelector(\n        '.folio-dialog[aria-label=\"Book Details\"]',\n        { hidden: true, timeout: 5_000 },\n      ).then(() => true).catch(() => false);\n      if (!bookDetailsClosed) await new Promise((resolve) => setTimeout(resolve, 200));\n    }\n    if (!bookDetailsClosed) throw new Error(\"Book Details dialog did not close after 3 programmatic attempts\");\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected close marker once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit QA close fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/v107-qa-dialog-close-fix.yml
          git add scripts/v107-visual-qa.ts .github/workflows/v107-qa-dialog-close-fix.yml
          git commit -m "Stabilize v1.0.7 Book Details QA close"
          git push origin HEAD:fix/v1.0.7
