name: Apply Folio 1.0.7 source patch

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-source-patch.yml"
      - "scripts/v107-polish-hyphen-limits-patch.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
      - run: python scripts/v107-polish-hyphen-limits-patch.py
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/hyphenation.ts server/pipeline/hyphenation.ts
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Align Polish hyphenation with 7-3-3 policy"
          git push origin HEAD:fix/v1.0.7
