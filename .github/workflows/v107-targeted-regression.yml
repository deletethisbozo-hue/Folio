name: Folio 1.0.7 targeted regressions

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - .github/workflows/v107-targeted-regression.yml

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    env:
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - name: Build web
        run: npm run build:web
      - name: Review-folder regression
        run: node --import tsx tests/review-folder.test.ts
      - name: Web-export regression
        run: node --import tsx tests/web-export.test.ts
      - name: UI runtime regression
        run: node --import tsx tests/ui-runtime.test.ts
