name: Promote v1.0.7 compositor fix

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-promote-compositor.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
          fetch-depth: 0
      - name: Promote validated spacing and widow selection
        shell: python
        run: |
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches: {count}')
              return text.replace(old, new, 1)

          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          s = one(
              s,
              '  const configuredWordSpacing = fontSize * (emergency || finalCompression ? 0.12 : 0.075);\n',
              '  const configuredWordSpacing = fontSize * (emergency || finalCompression ? 0.12 : 0.099);\n',
              'strict positive spacing',
          )
          s = one(
              s,
              '  let bestHyphenBudgetPriority = 3;\n',
              '  let bestHyphenBudgetPriority = 3;\n  let bestWidowPriority = 2;\n',
              'widow declaration',
          )
          s = one(
              s,
              '    const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);\n    // 0.45 is the release ceiling, not the composition target. Prefer 0.40\n',
              '    const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);\n    const finalSemanticWords = state.from < count\n      ? 1 + words.slice(state.from + 1, count).filter((word) => word.spaceBefore).length\n      : 0;\n    const widowPriority = finalSemanticWords === 1 ? 1 : 0;\n    // 0.45 is the release ceiling, not the composition target. Prefer 0.40\n',
              'widow rate',
          )
          s = one(
              s,
              '    if (hyphenBudgetPriority < bestHyphenBudgetPriority\n      || (hyphenBudgetPriority === bestHyphenBudgetPriority && betterSamePriority)) {\n      bestHyphenBudgetPriority = hyphenBudgetPriority;\n      bestCost = state.cost;\n      bestSectionRate = sectionRate;\n      bestKey = key;\n    }\n',
              '    if (widowPriority < bestWidowPriority\n      || (widowPriority === bestWidowPriority\n        && (hyphenBudgetPriority < bestHyphenBudgetPriority\n          || (hyphenBudgetPriority === bestHyphenBudgetPriority && betterSamePriority)))) {\n      bestWidowPriority = widowPriority;\n      bestHyphenBudgetPriority = hyphenBudgetPriority;\n      bestCost = state.cost;\n      bestSectionRate = sectionRate;\n      bestKey = key;\n    }\n',
              'widow selection',
          )
          p.write_text(s, encoding='utf-8')
      - name: Commit product fix
        shell: bash
        run: |
          git config user.name "folio-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/compositor.ts
          git diff --cached --check
          git commit -m "Improve v1.0.7 compositor spacing and widow selection"
          git push origin HEAD:fix/v1.0.7
