name: v1.0.7 QA continuity repair

on:
  push:
    branches:
      - fix/v1.0.7
    paths:
      - .github/workflows/v107-qa-continuity-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
      - name: Reset QA microtype continuity across natural lines
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_reset(path: Path, target_fragment: str) -> None:
              lines = path.read_text().splitlines(keepends=True)
              targets = [i for i, line in enumerate(lines) if target_fragment in line]
              if len(targets) != 1:
                  raise SystemExit(f'{path}: expected one target, found {len(targets)}')
              target = targets[0]
              window = ''.join(lines[max(0, target - 30):target])
              if 'previousSpacing = spacing;' not in window or 'previousGlyphScale = glyphScale;' not in window:
                  raise SystemExit(f'{path}: continuity assignments are not immediately upstream of target')
              close = target - 1
              if lines[close].strip() != '}':
                  raise SystemExit(f'{path}: expected closing brace immediately before target, got {lines[close]!r}')
              indent = lines[close][:len(lines[close]) - len(lines[close].lstrip())]
              lines[close:target] = [
                  f'{indent}}} else {{\n',
                  f'{indent}  // Natural lines reset compositor continuity. Do not compare a later\n',
                  f'{indent}  // microtyped line against a line from before that reset.\n',
                  f'{indent}  previousGlyphScale = null;\n',
                  f'{indent}  previousSpacing = null;\n',
                  f'{indent}}}\n',
              ]
              path.write_text(''.join(lines))

          insert_reset(Path('scripts/v107-theme-matrix.ts'), 'const text = (line.textContent ?? "")')
          insert_reset(Path('scripts/v107-visual-qa.ts'), 'if (line.textContent?.endsWith("-")) {')
          PY
          git diff --check
          git diff -- scripts/v107-theme-matrix.ts scripts/v107-visual-qa.ts
      - name: Commit QA repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v107-theme-matrix.ts scripts/v107-visual-qa.ts
          git commit -m "Fix QA continuity across natural lines"
          git push origin HEAD:fix/v1.0.7
