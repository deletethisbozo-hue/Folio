name: Folio brand refresh preview

on:
  push:
    branches: ["feature/folio-brand-refresh-230"]
    paths:
      - "web/**"
      - "assets/**"
      - "electron/**"
      - "scripts/capture-brand-preview.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/brand-refresh-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-brand-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Existing Writing Studio browser smoke
        run: node --import tsx tests/write-studio-ui.test.ts
      - name: Capture real Folio brand preview
        run: node --import tsx scripts/capture-brand-preview.ts
      - name: Upload real Folio screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Folio-2.3-brand-preview
          path: artifacts/folio-brand-preview.png
          if-no-files-found: error
          retention-days: 14
