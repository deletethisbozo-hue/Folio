name: Folio accurate device previews

on:
  push:
    branches: ["feature/accurate-device-previews"]
    paths:
      - "web/**"
      - "scripts/capture-device-previews.ts"
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/accurate-device-previews.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-accurate-device-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Pandoc for live preview capture
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install Chromium runtime
        run: npx puppeteer browsers install chrome-headless-shell
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Existing Writing Studio browser smoke
        run: node --import tsx tests/write-studio-ui.test.ts
      - name: Capture and validate every device shell
        run: node --import tsx scripts/capture-device-previews.ts
      - name: Upload real Folio device screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Folio-2.3-accurate-device-previews
          path: artifacts/device-previews/
          if-no-files-found: error
          retention-days: 14
