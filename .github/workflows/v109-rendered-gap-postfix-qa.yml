name: Folio 1.0.9 rendered-gap correction QA

on:
  push:
    branches:
      - fix/v1.0.9-remove-black-psalter

permissions:
  contents: write

jobs:
  windows-qa:
    if: github.event.head_commit.message != 'Finalize rendered-gap compositor for Folio 1.0.9'
    runs-on: windows-2025
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.9-remove-black-psalter
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply measured rendered-gap correction
        run: python scripts/v109-rendered-gap-postfix.py

      - name: Allow bounded post-render tracking and optical correction in diagnostic QA
        shell: pwsh
        run: |
          $path = 'scripts/v107-visual-qa.ts'
          $text = Get-Content $path -Raw
          $oldGlyph = 'report.maxGlyphScaleDelta > 0.0101'
          $oldTracking = 'report.maxTrackingEm > 0.0031'
          if (-not $text.Contains($oldGlyph)) { throw 'Visual QA glyph-scale gate anchor missing.' }
          if (-not $text.Contains($oldTracking)) { throw 'Visual QA tracking gate anchor missing.' }
          $text = $text.Replace($oldGlyph, 'report.maxGlyphScaleDelta > 0.0201')
          $text = $text.Replace($oldTracking, 'report.maxTrackingEm > 0.0056')
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable was not found." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install pinned Chromium runtime
        shell: pwsh
        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "152\.0\.7977\.75" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell was not installed." }

      - name: Typecheck
        run: npm run typecheck

      - name: Full formatter and UI suite
        run: npm test

      - name: Build web and server
        run: npm run build

      - name: Windows visual and typesetting QA
        run: node --import tsx scripts/v107-visual-qa.ts

      - name: Show candidate diff
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          git diff -- web/src/compositor.ts scripts/v107-visual-qa.ts

      - name: Commit qualified compositor correction
        shell: pwsh
        run: |
          git config user.name "Folio Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/compositor.ts scripts/v107-visual-qa.ts
          if (git diff --cached --quiet) { throw 'Qualified compositor correction produced no staged changes.' }
          git commit -m "Finalize rendered-gap compositor for Folio 1.0.9"
          git push origin HEAD:fix/v1.0.9-remove-black-psalter
