name: Apply Folio 2.0.1 follow-up

on:
  push:
    branches: ["release/v2.0.1"]
    paths:
      - "scripts/v201-followup.mjs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v2.0.1
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - run: node scripts/v201-followup.mjs
      - name: Commit follow-up
        shell: bash
        run: |
          git restore scripts/v201-followup.mjs .github/workflows/apply-v201-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Folio 2.0.1 regression coverage"
          git push origin HEAD:release/v2.0.1
