name: Folio Pixabay asset theme previews

on:
  push:
    branches:
      - preview/pixabay-theme-assets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable missing." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Download selected Pixabay assets and embed into preview CSS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @{
            "amour"       = "https://cdn.pixabay.com/photo/2022/12/30/02/22/design-7686051_1280.png"
            "seance"      = "https://cdn.pixabay.com/photo/2022/08/14/01/32/hand-7384733_1280.png"
            "memoir"      = "https://cdn.pixabay.com/photo/2019/05/27/23/56/vintage-4234040_1280.png"
            "gothic"      = "https://cdn.pixabay.com/photo/2022/09/28/17/22/ornament-7485579_1280.png"
            "scriptorium" = "https://cdn.pixabay.com/photo/2020/05/11/03/40/vintage-5156335_1280.png"
            "arcana"      = "https://cdn.pixabay.com/photo/2022/06/16/01/32/knight-7264868_1280.png"
          }

          foreach ($theme in $assets.Keys) {
            $imageUrl = $assets[$theme]
            $dest = "themes\\$theme\\asset.png"
            Invoke-WebRequest -Uri $imageUrl -OutFile $dest -Headers @{ "User-Agent" = "Mozilla/5.0" }

            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $dest))
            if ($bytes.Length -lt 1000) { throw "Downloaded asset for $theme is suspiciously small: $($bytes.Length) bytes" }
            $base64 = [Convert]::ToBase64String($bytes)
            $dataUri = "data:image/png;base64,$base64"
            $cssPath = "themes\\$theme\\theme.css"
            $css = Get-Content $cssPath -Raw
            if (-not $css.Contains("__ASSET_DATA__")) { throw "Asset placeholder missing in $cssPath" }
            Set-Content $cssPath ($css.Replace("__ASSET_DATA__", $dataUri)) -NoNewline
            Write-Host "$theme <= $imageUrl ($($bytes.Length) bytes)"
          }

      - name: Install Chromium runtime
        shell: pwsh
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Build Folio
        run: npm run build

      - name: Capture real Folio print previews
        run: node --import tsx scripts/asset-theme-preview.ts

      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Pixabay-Theme-Previews
          path: build/qa-asset-themes/*
          if-no-files-found: error
