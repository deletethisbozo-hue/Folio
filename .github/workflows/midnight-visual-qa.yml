name: Midnight Visual QA

on:
  push:
    branches: [fix/midnight-2.5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-midnight-visual-qa-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out Folio
        uses: actions/checkout@v4

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download pinned Pandoc 3.11
        shell: pwsh
        run: |
          $zip = "build\pandoc-3.11-windows-x86_64.zip"
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath build\pandoc-unpack -Force
          $pandoc = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $pandoc) { throw "Pandoc executable was not found after extraction." }
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          Copy-Item $pandoc.FullName build\pandoc\pandoc.exe -Force
          & build\pandoc\pandoc.exe --version | Select-Object -First 1

      - name: Install pinned Chromium runtime
        shell: pwsh
        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "152\.0\.7977\.75" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell 152.0.7977.75 was not installed." }

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Capture Light and Midnight UI
        run: node --import tsx scripts/v210-writing-studio-preview.ts

      - name: Upload Midnight screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Midnight-2.5-Screenshots
          path: build/qa-v210-writing-studio/*.png
          if-no-files-found: error
