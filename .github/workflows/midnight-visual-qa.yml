name: Midnight Visual QA

on:
  push:
    branches: [main, fix/midnight-2.5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-midnight-visual-qa-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out Folio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22.23.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download pinned Pandoc 3.11
        shell: pwsh
        run: |
          $zip = "build\pandoc-3.11-windows-x86_64.zip"
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath build\pandoc-unpack -Force
          $pandoc = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $pandoc) { throw "Pandoc executable was not found after extraction." }
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          Copy-Item $pandoc.FullName build\pandoc\pandoc.exe -Force
          & build\pandoc\pandoc.exe --version | Select-Object -First 1

      - name: Install pinned Chromium runtime
        shell: pwsh
        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "156\.0\.8078\.47" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell 156.0.8078.47 was not installed." }

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Capture Light and Midnight UI
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Light/Midnight capture attempt $attempt/$maxAttempts"
            node --import tsx scripts/v210-writing-studio-preview.ts
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) { throw "Light/Midnight capture failed after $maxAttempts attempts." }
            Write-Warning "Transient Chromium screenshot failure; retrying capture."
            Start-Sleep -Seconds 4
          }

      - name: Verify full Light Midnight parity
        run: node --import tsx scripts/ui-tone-parity-preview.ts

      - name: Upload Midnight screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Folio-Midnight-2.5-Screenshots
          path: |
            build/qa-v210-writing-studio/*.png
            build/qa-tone-parity/*.png
            build/qa-tone-parity/parity-report.json
          if-no-files-found: error
