name: Folio 1.0.7 visual qualification

on:
  push:
    branches: ["fix/v1.0.7"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-v107-visual
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
          "$PANDOC_BIN" --version | head -n 1
      - run: npx puppeteer browsers install chrome-headless-shell
      - run: npm run typecheck
      - run: npm run build
      - name: Qualify reference visual corpus
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: Qualify all 30 book themes
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Print detailed failed-theme diagnostics
        if: failure()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'build/qa-v107/theme-matrix.json';
          if (!fs.existsSync(file)) process.exit(0);
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const result of report.results.filter((entry) => !entry.pass)) {
            const m = result.metrics || {};
            console.log(`\n=== ${result.theme} / ${result.scenario} ===`);
            console.log('failures:', JSON.stringify(result.failures));
            console.log('font:', m.bodyFont, 'measurePx:', m.measurePx);
            console.log('hyphens:', m.hyphenatedLines, '/', m.justifiedLines, 'rate=', m.hyphenRate, 'streak=', m.maxHyphenStreak);
            console.log('fit:', JSON.stringify({
              maxRightErrorPx: m.maxRightErrorPx,
              maxWordSpacingEm: m.maxWordSpacingEm,
              maxStrictWordSpacingEm: m.maxStrictWordSpacingEm,
              maxRelaxedWordSpacingEm: m.maxRelaxedWordSpacingEm,
              relaxedLines: m.relaxedLines,
              maxTrackingEm: m.maxTrackingEm,
              maxGlyphScaleDelta: m.maxGlyphScaleDelta,
              maxAdjacentGlyphScaleDelta: m.maxAdjacentGlyphScaleDelta,
              maxSemanticGapEm: m.maxSemanticGapEm,
              maxAdjacentSpacingDeltaEm: m.maxAdjacentSpacingDeltaEm,
              emergencyLines: m.emergencyLines,
              oneWordFinalLines: m.oneWordFinalLines,
              compositionFailures: m.compositionFailures,
            }));
            if (m.dropcapOpening?.length) console.log('dropcapOpening:', JSON.stringify(m.dropcapOpening));
            if (m.emergencyDetails?.length) console.log('emergencyDetails:', JSON.stringify(m.emergencyDetails));
            if (m.compositionFailureDetails?.length) console.log('compositionFailureDetails:', JSON.stringify(m.compositionFailureDetails));
          }
          NODE
      - name: Render comparable 30-theme gallery
        run: node --import tsx scripts/v107-theme-gallery.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Folio-1.0.7-visual-qa
          path: build/qa-v107/**
          if-no-files-found: warn

# qualification trigger: bundled fonts + all-theme gallery
