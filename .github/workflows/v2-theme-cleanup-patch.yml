name: Apply Folio 2.0 theme cleanup

on:
  push:
    branches: ["release/v2.0.0"]
    paths:
      - ".github/workflows/v2-theme-cleanup-patch.yml"
      - "scripts/apply-v2-theme-cleanup.mjs"

permissions:
  contents: write

concurrency:
  group: folio-v2-theme-cleanup-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply curated theme cleanup
        run: node scripts/apply-v2-theme-cleanup.mjs
      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet -- server/pipeline/themes.ts server/pipeline/ingest.ts server/api.ts tests/ui-runtime.test.ts; then
            echo "No theme cleanup changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/pipeline/themes.ts server/pipeline/ingest.ts server/api.ts tests/ui-runtime.test.ts
          git commit -m "Curate the Folio 2.0 theme set"
          git push origin HEAD:release/v2.0.0
