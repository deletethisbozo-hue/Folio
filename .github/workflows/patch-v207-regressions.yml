name: Patch Folio 2.0.7 regression expectations

on:
  push:
    branches: [fix/v2.0.7-cover-button-image-title]
    paths:
      - .github/workflows/patch-v207-regressions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.7-cover-button-image-title
      - name: Update v2.0.7 product semantics and regression expectations
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: expected fragment not found: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Keep caller-supplied semantic alt text, but never derive a visible title
          # from the uploaded filename.
          replace_once(
              "server/image-pages.ts",
              '  const alt = "Full-page illustration";',
              '  const alt = options.alt?.trim() || "Full-page illustration";',
          )

          # The approved 2.0.7 navigator uses a 5px selected-row radius.
          replace_once(
              "tests/ui-runtime.test.ts",
              '        selected.borderRadius === "0px" && shell.bottom <= innerHeight + 1,',
              '        selected.borderRadius === "5px" && shell.bottom <= innerHeight + 1,',
          )
          replace_once(
              "tests/ui-runtime.test.ts",
              'check("1.0.7 keeps a legible professional preview beside the manuscript", studioGeometry.ok, JSON.stringify(studioGeometry));',
              'check("2.0.7 keeps a legible professional preview beside the manuscript", studioGeometry.ok, JSON.stringify(studioGeometry));',
          )

          p = Path("tests/v206-ui-regression.test.ts")
          text = p.read_text(encoding="utf-8")

          replacements = [
              (
                  'console.log("\\nFolio 2.0.6 visual/media regression gate");',
                  'console.log("\\nFolio 2.0.7 visual/media regression gate");',
              ),
              (
                  'Number.parseFloat(coverState.buttonRadius) <= 4',
                  'Number.parseFloat(coverState.buttonRadius) <= 5',
              ),
              (
                  'const mapLabel = path.basename(mapFixture, ".png").replace(/[-_]+/g, " ");',
                  'const mapLabel = path.basename(mapFixture, ".png").replace(/[-_]+/g, " ");\nconst neutralImageLabel = "Full-page Image";',
              ),
              (
                  'const beforeCount = await page.$$eval(".contents-list .contents-row:not(.cover-row)", (rows, label) => rows.filter((row) => (row.textContent ?? "").includes(String(label))).length, mapLabel);',
                  'const beforeCount = await page.$$eval(".contents-list .contents-row:not(.cover-row)", (rows, label) => rows.filter((row) => (row.textContent ?? "").includes(String(label))).length, neutralImageLabel);',
              ),
              (
                  '}, { timeout: 30000 }, mapLabel, beforeCount);',
                  '}, { timeout: 30000 }, neutralImageLabel, beforeCount);',
              ),
              (
                  'const labels = await page.$$eval(".contents-list .contents-row:not(.cover-row)", (rows, label) => rows.map((row) => row.textContent?.trim() ?? "").filter((text) => text.includes(String(label))), mapLabel);',
                  'const labels = await page.$$eval(".contents-list .contents-row:not(.cover-row)", (rows, label) => rows.map((row) => row.textContent?.trim() ?? "").filter((text) => text.includes(String(label))), neutralImageLabel);',
              ),
              (
                  'check("repeated image-page titles are visibly disambiguated", labels.length >= 2 && new Set(labels).size === labels.length, labels.join(" | "));',
                  'check("repeated neutral image-page titles are visibly disambiguated", labels.length >= 2 && new Set(labels).size === labels.length, labels.join(" | "));',
              ),
              (
                  'console.error("✗ Folio 2.0.6 browser regression scenario");',
                  'console.error("✗ Folio 2.0.7 browser regression scenario");',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"tests/v206-ui-regression.test.ts: expected fragment not found: {old!r}")
              text = text.replace(old, new, 1)

          first_add = "  await addFullPageImage();"
          if first_add not in text:
              raise SystemExit("First Full-page Image addition not found")
          filename_assertion = "\n".join([
              '  const filenameVisible = await page.$eval(".contents-list", (nav, label) => (nav.textContent ?? "").includes(String(label)), mapLabel);',
              '  check("Full-page Image never exposes the uploaded filename as a visible title", !filenameVisible, mapLabel);',
          ])
          text = text.replace(first_add, first_add + "\n" + filename_assertion, 1)

          p.write_text(text, encoding="utf-8")

      - name: Commit regression updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/image-pages.ts tests/ui-runtime.test.ts tests/v206-ui-regression.test.ts
          git commit -m "Align regression gates with v2.0.7 UI and image semantics"
          git push origin HEAD:fix/v2.0.7-cover-button-image-title
