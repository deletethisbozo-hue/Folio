name: Folio accurate devices portable candidate

on:
  push:
    branches: ["feature/accurate-device-previews"]
    paths:
      - ".github/workflows/accurate-device-portable.yml"
      - "electron/**"
      - "web/**"
      - "server/**"
      - "tests/**"
      - "themes/**"
      - "templates/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-accurate-device-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out accurate-device branch
        uses: actions/checkout@v4

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Read candidate version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!==l.version||p.version!==l.packages[''].version) throw new Error('package.json/package-lock.json version mismatch')"
          if ($LASTEXITCODE -ne 0) { throw "Version consistency check failed." }
          "FOLIO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable missing." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install Chromium runtime
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Write Studio logic and persistence tests
        run: node --import tsx tests/write-studio.test.ts

      - name: Build web and server
        run: npm run build

      - name: Writing Studio browser smoke
        run: node --import tsx tests/write-studio-ui.test.ts

      - name: Build portable candidate
        run: npx electron-builder --win portable --x64 --publish never

      - name: Smoke packaged portable candidate
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:FOLIO_E2E_PORT = "43187"
          $env:FOLIO_E2E_DEBUG_PORT = "43188"
          $exe = (Resolve-Path "release\Folio-$env:FOLIO_VERSION-portable.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 120; $i++) {
              if ($process.HasExited) { throw "Portable Folio exited before /api/health became ready (exit code $($process.ExitCode))." }
              try { $health = Invoke-RestMethod "http://127.0.0.1:43187/api/health" -TimeoutSec 1; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $health -or -not $health.ok -or -not $health.pandoc.ok) { throw "Packaged Folio did not become healthy with bundled Pandoc." }

            $sample = Invoke-RestMethod -Method Post -ContentType "application/json" -Body "{}" "http://127.0.0.1:43187/api/sample"
            if (-not $sample.projectId) { throw "Packaged sample project failed to open." }
            $studio = Invoke-RestMethod "http://127.0.0.1:43187/api/projects/$($sample.projectId)/write-studio"
            if ($null -eq $studio.targets -or $null -eq $studio.research -or $null -eq $studio.revisions) { throw "Packaged Writing Studio API is incomplete." }
          }
          finally {
            Get-Process Folio -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Hash portable candidate
        shell: pwsh
        run: |
          $file = "release\Folio-$env:FOLIO_VERSION-portable.exe"
          if (-not (Test-Path $file)) { throw "Missing portable candidate: $file" }
          if ((Get-Item $file).Length -lt 1MB) { throw "Portable candidate is unexpectedly small." }
          Get-FileHash $file -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii release\accurate-device-portable-sha256.txt

      - name: Upload portable candidate
        uses: actions/upload-artifact@v4
        with:
          name: Folio-2.3.0-Accurate-Devices-Portable
          retention-days: 14
          path: |
            release/Folio-${{ env.FOLIO_VERSION }}-portable.exe
            release/accurate-device-portable-sha256.txt
          if-no-files-found: error
