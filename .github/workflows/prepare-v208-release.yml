name: Prepare Folio 2.0.8 package metadata

on:
  push:
    branches:
      - fix/v2.0.8-ui-style-image-export

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.8-ui-style-image-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Bump package metadata
        run: npm version 2.0.8 --no-git-tag-version
      - name: Update visible version
        shell: python
        run: |
          from pathlib import Path
          start = Path('web/src/StartScreen.tsx')
          text = start.read_text(encoding='utf-8')
          if '<div className="start-version">2.0.7</div>' not in text:
              raise SystemExit('expected StartScreen 2.0.7 marker not found')
          start.write_text(text.replace('<div className="start-version">2.0.7</div>', '<div className="start-version">2.0.8</div>', 1), encoding='utf-8')
      - name: Verify package version contract
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='2.0.8'||l.version!=='2.0.8'||l.packages[''].version!=='2.0.8') throw new Error('2.0.8 package version mismatch')"
          grep -q '>2.0.8</div>' web/src/StartScreen.tsx
      - name: Commit package metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json web/src/StartScreen.tsx
          git commit -m "Bump Folio to 2.0.8"
          git push origin HEAD:fix/v2.0.8-ui-style-image-export
