name: Apply Folio 2.0 full-page image patch

on:
  push:
    branches: ["release/v2.0.0"]
    paths:
      - ".github/workflows/v2-image-page-patch.yml"
      - "scripts/apply-v2-image-page-ui.mjs"

permissions:
  contents: write

concurrency:
  group: folio-v2-image-page-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply full-page image API and UI patch
        run: node scripts/apply-v2-image-page-ui.mjs
      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet -- server/api.ts web/src/api.ts web/src/App.tsx; then
            echo "No image-page patch changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api.ts web/src/api.ts web/src/App.tsx
          git commit -m "Add full-page front matter images to Folio 2.0"
          git push origin HEAD:release/v2.0.0
