name: Illustration V8 Dropcap Flow Qualification

on:
  push:
    branches: [feature/illustrations-v8-dropcap-flow]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-illustrations-v8-dropcap-flow
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out V8 dropcap-flow branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22.23.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable missing." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install Chromium
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Write view zoom isolation
        run: node --import tsx tests/write-zoom-ui.test.ts

      - name: V2 direct manipulation and resize regression
        run: node --import tsx tests/illustration-v2-ui.test.ts

      - name: V3 contour geometry regression
        run: node --import tsx tests/illustration-v3-contour.test.ts

      - name: V4 physical alpha-clearance qualification
        run: node --import tsx tests/illustration-v4-safety.test.ts

      - name: V5 reported-regression stability
        run: node --import tsx tests/illustration-v5-stability.test.ts

      - name: V8 opener spacing, editor insertion and variable drop cap flow
        run: node --import tsx tests/illustration-v6-opener-dropcap.test.ts

      - name: Legacy crop compatibility
        run: node --import tsx tests/illustration-preview-ui.test.ts

      - name: EPUB contour fallback qualification
        run: node --import tsx tests/illustration-v3-epub.test.ts

      - name: Full regression suite
        run: npm test

      - name: Upload V4 screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Folio-Illustration-V8-Dropcap-Flow-Preview
          path: |
            build/qa-illustrations-v2/*.png
            build/qa-illustrations-v3/*.png
            build/qa-illustrations-v4/*.png
          if-no-files-found: warn
