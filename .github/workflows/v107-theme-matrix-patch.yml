name: Temporary v1.0.7 theme matrix patch

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-theme-matrix-patch.yml"
      - "scripts/patch-v107-theme-matrix-navigation.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic navigation fix
        run: python3 scripts/patch-v107-theme-matrix-navigation.py
      - name: Commit patched matrix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v107-theme-matrix.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix all-theme matrix style navigation"
          git push origin HEAD:fix/v1.0.7
