name: v1.0.7 real font-calibration probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-calibration-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        factor: ['0.88', '0.92', '0.96', '1.04', '1.08', '1.12']
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply checkout-only real calibration factor
        shell: python
        env:
          FACTOR: ${{ matrix.factor }}
        run: |
          from pathlib import Path
          import os
          factor = os.environ['FACTOR']

          p = Path('web/src/preview-runtime.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  const css = [\n    `body{font-size:${profile.baseFont * scale}px!important}`,\n    `main.book{padding:${top}px ${right}px ${bottom}px ${left}px!important}`,\n  ].join("");\n'''
          new = f'''  const bodyFamily = doc.body && doc.defaultView ? doc.defaultView.getComputedStyle(doc.body).fontFamily : "";\n  const opticalFactor = /Libre Baskerville|Source Serif 4|Libre Caslon Text/i.test(bodyFamily) ? {factor} : 1;\n  const css = [\n    `body{{font-size:${{profile.baseFont * scale * opticalFactor}}px!important}}`,\n    `main.book{{padding:${{top}}px ${{right}}px ${{bottom}}px ${{left}}px!important}}`,\n  ].join("");\n'''
          if s.count(old) != 1:
              raise SystemExit('preview calibration block changed unexpectedly')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          oldq = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          newq = '  const probeNames = new Set(["modern", "decorative", "editorial", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 4) throw new Error(`Expected exactly 4 probe themes, found ${themes.length}`);\n'
          if t.count(oldq) != 1:
              raise SystemExit('matrix selector changed unexpectedly')
          q.write_text(t.replace(oldq, newq, 1), encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Run 12-case targeted matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize
        if: always()
        shell: python
        env:
          FACTOR: ${{ matrix.factor }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          import json, os
          from pathlib import Path
          src = Path('build/qa-v107/theme-matrix.json')
          if not src.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(src.read_text(encoding='utf-8'))
          out = {
              'factor': os.environ['FACTOR'], 'matrix': os.environ['MATRIX_OUTCOME'],
              'passed': d['passed'], 'failed': d['failed'], 'results': d['results'],
          }
          dst = Path(f"build/qa-v107/calibration-{os.environ['FACTOR']}.json")
          dst.write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'factor':out['factor'],'passed':out['passed'],'failed':out['failed']}, indent=2))
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-calibration-${{ matrix.factor }}
          path: build/qa-v107/calibration-${{ matrix.factor }}.json
          if-no-files-found: error
