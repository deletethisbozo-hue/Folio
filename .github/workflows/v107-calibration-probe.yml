name: v1.0.7 Baskerville Garamond candidate

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-calibration-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply checkout-only Garamond replacement
        shell: python
        run: |
          from pathlib import Path

          themes = ['decorative','heritage','nocturne','obsidian','cathedral','revenant']
          for theme in themes:
              p = Path(f'themes/{theme}/theme.css')
              s = p.read_text(encoding='utf-8')
              s += '\n\n/* checkout-only v1.0.7 Baskerville candidate */\nbody { font-family: "EB Garamond", serif; }\n.dropcap { font-family: "EB Garamond", serif; }\n'
              p.write_text(s, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          oldq = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          newq = '  const probeNames = new Set(["decorative", "heritage", "nocturne", "obsidian", "cathedral", "revenant"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 6) throw new Error(`Expected exactly 6 probe themes, found ${themes.length}`);\n'
          if t.count(oldq) != 1:
              raise SystemExit('matrix selector changed unexpectedly')
          q.write_text(t.replace(oldq, newq, 1), encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Run 18-case candidate matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          src = Path('build/qa-v107/theme-matrix.json')
          if not src.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(src.read_text(encoding='utf-8'))
          out = {'passed': d['passed'], 'failed': d['failed'], 'results': d['results']}
          Path('build/qa-v107/baskerville-garamond-candidate.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'passed': d['passed'], 'failed': d['failed'], 'failuresByTheme': d.get('failuresByTheme', {})}, indent=2))
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-baskerville-garamond-candidate
          path: build/qa-v107/baskerville-garamond-candidate.json
          if-no-files-found: error
