name: v1.0.7 continuity-aware fit probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-calibration-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        theme: [decorative, editorial, cloister]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply checkout-only continuity-aware fit candidate
        shell: python
        env:
          TARGET_THEME: ${{ matrix.theme }}
        run: |
          from pathlib import Path
          import os

          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          old = '''    const scaledAdjustment = available / glyphScale - naturalWidth;
    let wordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, scaledAdjustment / gaps));
    let remaining = scaledAdjustment - wordSpacing * gaps;
    let tracking = trackingOps > 0 ? remaining / trackingOps : 0;

    if (tracking > maxTracking || tracking < minTracking) {
      tracking = Math.max(minTracking, Math.min(maxTracking, tracking));
      wordSpacing = (scaledAdjustment - tracking * trackingOps) / gaps;
    }
    wordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, wordSpacing));
    tracking = Math.max(minTracking, Math.min(maxTracking, tracking));
    const residualPx = (scaledAdjustment - wordSpacing * gaps - tracking * trackingOps) * glyphScale;
    if (Math.abs(residualPx) > 1.70) continue;

    const spaceRatio = wordSpacing / Math.max(0.5, spaceWidth);
    const trackingRatio = tracking / Math.max(1, fontSize);
    const scaleRatio = Math.abs(glyphScale - 1) / 0.01;
    const scaleJumpRatio = Math.abs(glyphScale - previousGlyphScale) / 0.01;
    const badness = 100 * Math.pow(Math.abs(spaceRatio) / 0.20, 3)
      + 55 * Math.pow(Math.abs(trackingRatio) / 0.0035, 3)
      + 42 * Math.pow(scaleRatio, 3)
      + 90 * Math.pow(scaleJumpRatio, 2)
      + 100 * Math.pow(Math.abs(residualPx) / 1.70, 2);
    const fitness = spaceRatio < -0.04 ? 0 : spaceRatio <= 0.10 ? 1 : spaceRatio <= 0.22 ? 2 : 3;
    const candidate = { wordSpacing, tracking, glyphScale, badness, fitness };
    const rank = selection === "continuity"
      ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness
      : selection === "spacing-continuity"
        ? Math.abs(wordSpacing - targetWordSpacing) * 1_000_000 + candidate.badness
        : candidate.badness;
    if (!best || rank < bestRank) {
      best = candidate;
      bestRank = rank;
    }
'''
          new = '''    const scaledAdjustment = available / glyphScale - naturalWidth;
    const allocations: Array<{ wordSpacing: number; tracking: number }> = [];

    let greedyWordSpacing = Math.max(minWordSpacing, Math.min(maxWordSpacing, scaledAdjustment / gaps));
    let greedyRemaining = scaledAdjustment - greedyWordSpacing * gaps;
    let greedyTracking = trackingOps > 0 ? greedyRemaining / trackingOps : 0;
    if (greedyTracking > maxTracking || greedyTracking < minTracking) {
      greedyTracking = Math.max(minTracking, Math.min(maxTracking, greedyTracking));
      greedyWordSpacing = (scaledAdjustment - greedyTracking * trackingOps) / gaps;
    }
    allocations.push({
      wordSpacing: Math.max(minWordSpacing, Math.min(maxWordSpacing, greedyWordSpacing)),
      tracking: Math.max(minTracking, Math.min(maxTracking, greedyTracking)),
    });

    if (selection === "spacing-continuity" && trackingOps > 0) {
      const targetTracking = Math.max(
        minTracking,
        Math.min(maxTracking, (scaledAdjustment - targetWordSpacing * gaps) / trackingOps),
      );
      const targetSpacing = (scaledAdjustment - targetTracking * trackingOps) / gaps;
      if (targetSpacing >= minWordSpacing - 0.000001 && targetSpacing <= maxWordSpacing + 0.000001) {
        allocations.push({ wordSpacing: targetSpacing, tracking: targetTracking });
      }
    }

    for (const allocation of allocations) {
      const wordSpacing = allocation.wordSpacing;
      const tracking = allocation.tracking;
      const residualPx = (scaledAdjustment - wordSpacing * gaps - tracking * trackingOps) * glyphScale;
      if (Math.abs(residualPx) > 1.70) continue;

      const spaceRatio = wordSpacing / Math.max(0.5, spaceWidth);
      const trackingRatio = tracking / Math.max(1, fontSize);
      const scaleRatio = Math.abs(glyphScale - 1) / 0.01;
      const scaleJumpRatio = Math.abs(glyphScale - previousGlyphScale) / 0.01;
      const badness = 100 * Math.pow(Math.abs(spaceRatio) / 0.20, 3)
        + 55 * Math.pow(Math.abs(trackingRatio) / 0.0035, 3)
        + 42 * Math.pow(scaleRatio, 3)
        + 90 * Math.pow(scaleJumpRatio, 2)
        + 100 * Math.pow(Math.abs(residualPx) / 1.70, 2);
      const fitness = spaceRatio < -0.04 ? 0 : spaceRatio <= 0.10 ? 1 : spaceRatio <= 0.22 ? 2 : 3;
      const candidate = { wordSpacing, tracking, glyphScale, badness, fitness };
      const rank = selection === "continuity"
        ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness
        : selection === "spacing-continuity"
          ? Math.abs(wordSpacing - targetWordSpacing) * 1_000_000 + candidate.badness
          : candidate.badness;
      if (!best || rank < bestRank) {
        best = candidate;
        bestRank = rank;
      }
    }
'''
          if s.count(old) != 1:
              raise SystemExit(f'fit allocation matches: {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          theme = os.environ['TARGET_THEME']
          q = Path('scripts/v107-theme-matrix.ts')
          matrix = q.read_text(encoding='utf-8')
          selector = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          dollar = '$'
          targeted = f'  const themes = themeList().filter((theme) => theme.name === "{theme}");\n  if (themes.length !== 1) throw new Error(`Expected exactly 1 probe theme, found {dollar}{{themes.length}}`);\n'
          if matrix.count(selector) != 1:
              raise SystemExit('matrix selector changed unexpectedly')
          q.write_text(matrix.replace(selector, targeted, 1), encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Run targeted matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize
        if: always()
        shell: python
        env:
          TARGET_THEME: ${{ matrix.theme }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          import json, os
          from pathlib import Path
          src = Path('build/qa-v107/theme-matrix.json')
          if not src.exists():
              raise SystemExit('theme-matrix.json missing')
          data = json.loads(src.read_text(encoding='utf-8'))
          out = {
              'theme': os.environ['TARGET_THEME'],
              'matrix': os.environ['MATRIX_OUTCOME'],
              'passed': data['passed'],
              'failed': data['failed'],
              'results': data['results'],
          }
          dst = Path(f"build/qa-v107/continuity-{out['theme']}.json")
          dst.write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'theme': out['theme'], 'passed': out['passed'], 'failed': out['failed']}, indent=2))
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-continuity-${{ matrix.theme }}
          path: build/qa-v107/continuity-${{ matrix.theme }}.json
          if-no-files-found: error
