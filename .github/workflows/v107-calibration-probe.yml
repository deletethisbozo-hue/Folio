name: v1.0.7 affected-family control matrix

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-calibration-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        family: [baskerville, source-serif, caslon]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
      TARGET_FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply checkout-only known-good family substitutions
        shell: python
        run: |
          from pathlib import Path
          import os

          p = Path('server/pipeline/theme-fonts.ts')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '["Folio Source Serif 4", "sourceSerif"]': '["Folio Source Serif 4", "vollkorn"]',
            '["Source Serif 4", "sourceSerif"]': '["Source Serif 4", "vollkorn"]',
            '["Times New Roman", "sourceSerif"]': '["Times New Roman", "vollkorn"]',
            '["Georgia", "sourceSerif"]': '["Georgia", "vollkorn"]',
            '["Folio Libre Baskerville", "baskerville"]': '["Folio Libre Baskerville", "newsreader"]',
            '["Libre Baskerville", "baskerville"]': '["Libre Baskerville", "newsreader"]',
            '["Hoefler Text", "baskerville"]': '["Hoefler Text", "newsreader"]',
            '["Baskerville", "baskerville"]': '["Baskerville", "newsreader"]',
            '["Folio Libre Caslon Text", "caslon"]': '["Folio Libre Caslon Text", "garamond"]',
            '["Libre Caslon Text", "caslon"]': '["Libre Caslon Text", "garamond"]',
            '["Charter", "caslon"]': '["Charter", "garamond"]',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected one mapping for {old!r}, found {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          groups = {
            'baskerville': ['decorative','heritage','nocturne','obsidian','cathedral','revenant'],
            'source-serif': ['editorial','scholar','folio','atlas','ember','solstice','runestone'],
            'caslon': ['cloister','timber','wyrmwood','ironbound'],
          }
          target = os.environ['TARGET_FAMILY']
          names = groups[target]
          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          oldq = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          name_list = ', '.join(repr(name) for name in names)
          newq = f'  const probeNames = new Set([{name_list}]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== {len(names)}) throw new Error(`Expected exactly {len(names)} probe themes, found ${{themes.length}}`);\n'
          if t.count(oldq) != 1:
              raise SystemExit('matrix selector changed unexpectedly')
          q.write_text(t.replace(oldq, newq, 1), encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Run affected-family matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          src = Path('build/qa-v107/theme-matrix.json')
          if not src.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(src.read_text(encoding='utf-8'))
          out = {'family': os.environ['TARGET_FAMILY'], 'passed': d['passed'], 'failed': d['failed'], 'results': d['results']}
          dst = Path(f"build/qa-v107/affected-{os.environ['TARGET_FAMILY']}.json")
          dst.write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'family': out['family'], 'passed': d['passed'], 'failed': d['failed'], 'failuresByTheme': d.get('failuresByTheme', {})}, indent=2))
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-affected-${{ matrix.family }}
          path: build/qa-v107/affected-${{ matrix.family }}.json
          if-no-files-found: error
