name: v1.0.7 serif measure probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-calibration-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        theme: [decorative, editorial, cloister]
        width: ['100', '99.5', '99', '98.5', '98', '97', '96']
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply checkout-only paragraph measure
        shell: python
        env:
          TARGET_THEME: ${{ matrix.theme }}
          WIDTH: ${{ matrix.width }}
        run: |
          from pathlib import Path
          import os

          theme = os.environ['TARGET_THEME']
          width = os.environ['WIDTH']
          css = Path(f'themes/{theme}/theme.css')
          source = css.read_text(encoding='utf-8')
          source += f'''\n\n/* checkout-only v1.0.7 measure probe */\nsection.chapter > p:not(.scene-break) {{\n  width: {width}%;\n  margin-left: auto;\n  margin-right: auto;\n}}\n'''
          css.write_text(source, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          text = q.read_text(encoding='utf-8')
          old = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          new = f'  const themes = themeList().filter((theme) => theme.name === "{theme}");\n  if (themes.length !== 1) throw new Error(`Expected exactly 1 probe theme, found ${{themes.length}}`);\n'
          if text.count(old) != 1:
              raise SystemExit('matrix selector changed unexpectedly')
          q.write_text(text.replace(old, new, 1), encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Run 3-case targeted matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize
        if: always()
        shell: python
        env:
          TARGET_THEME: ${{ matrix.theme }}
          WIDTH: ${{ matrix.width }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          import json, os
          from pathlib import Path
          src = Path('build/qa-v107/theme-matrix.json')
          if not src.exists():
              raise SystemExit('theme-matrix.json missing')
          data = json.loads(src.read_text(encoding='utf-8'))
          out = {
              'theme': os.environ['TARGET_THEME'],
              'width': os.environ['WIDTH'],
              'matrix': os.environ['MATRIX_OUTCOME'],
              'passed': data['passed'],
              'failed': data['failed'],
              'results': data['results'],
          }
          dst = Path(f"build/qa-v107/measure-{out['theme']}-{out['width']}.json")
          dst.write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'theme': out['theme'], 'width': out['width'], 'passed': out['passed'], 'failed': out['failed']}, indent=2))
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-measure-${{ matrix.theme }}-${{ matrix.width }}
          path: build/qa-v107/measure-${{ matrix.theme }}-${{ matrix.width }}.json
          if-no-files-found: error
