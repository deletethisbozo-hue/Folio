name: v1.0.7 soft article probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-calibration-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        theme: [decorative, editorial, cloister]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply checkout-only soft English article breaks
        shell: python
        env:
          TARGET_THEME: ${{ matrix.theme }}
        run: |
          from pathlib import Path
          import os

          compositor = Path('web/src/compositor.ts')
          text = compositor.read_text(encoding='utf-8')
          old = '    const structuralBreakBefore = (dashBreakBefore || (spaceBefore && breakableSpaceBefore && !articleGlue))\n'
          new = '    const structuralBreakBefore = (dashBreakBefore || (spaceBefore && breakableSpaceBefore && (!articleGlue || englishProse)))\n'
          if text.count(old) != 1:
              raise SystemExit('article glue expression changed unexpectedly')
          compositor.write_text(text.replace(old, new, 1), encoding='utf-8')

          theme = os.environ['TARGET_THEME']
          q = Path('scripts/v107-theme-matrix.ts')
          matrix = q.read_text(encoding='utf-8')
          selector = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          dollar = '$'
          targeted = f'  const themes = themeList().filter((theme) => theme.name === "{theme}");\n  if (themes.length !== 1) throw new Error(`Expected exactly 1 probe theme, found {dollar}{{themes.length}}`);\n'
          if matrix.count(selector) != 1:
              raise SystemExit('matrix selector changed unexpectedly')
          q.write_text(matrix.replace(selector, targeted, 1), encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Run 3-case targeted matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize
        if: always()
        shell: python
        env:
          TARGET_THEME: ${{ matrix.theme }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          import json, os
          from pathlib import Path
          src = Path('build/qa-v107/theme-matrix.json')
          if not src.exists():
              raise SystemExit('theme-matrix.json missing')
          data = json.loads(src.read_text(encoding='utf-8'))
          out = {
              'theme': os.environ['TARGET_THEME'],
              'matrix': os.environ['MATRIX_OUTCOME'],
              'passed': data['passed'],
              'failed': data['failed'],
              'results': data['results'],
          }
          dst = Path(f"build/qa-v107/article-{out['theme']}.json")
          dst.write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'theme': out['theme'], 'passed': out['passed'], 'failed': out['failed']}, indent=2))
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-article-${{ matrix.theme }}
          path: build/qa-v107/article-${{ matrix.theme }}.json
          if-no-files-found: error
