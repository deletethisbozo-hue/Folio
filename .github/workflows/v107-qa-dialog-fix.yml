name: Temporary v1.0.7 QA dialog fix

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-qa-dialog-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
          fetch-depth: 0
      - name: Stabilize Book Details dialog detection in visual QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/v107-visual-qa.ts")
          text = path.read_text(encoding="utf-8")
          old = '      const dialog = await page.waitForSelector(\'.folio-dialog[aria-label="Book Details"]\', { visible: true, timeout: 3_000 }).catch(() => null);'
          new = '      const dialog = await page.waitForSelector(\'.folio-dialog[aria-label="Book Details"]\', { timeout: 10_000 }).catch(() => null);'
          if text.count(old) != 1:
              raise SystemExit(f"expected QA dialog marker once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit QA harness fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/v107-qa-dialog-fix.yml
          git add scripts/v107-visual-qa.ts .github/workflows/v107-qa-dialog-fix.yml
          git commit -m "Stabilize v1.0.7 Book Details QA dialog detection"
          git push origin HEAD:fix/v1.0.7
