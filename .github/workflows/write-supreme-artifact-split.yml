name: Split Write Supreme Windows artifacts

on:
  push:
    branches: ["feature/write-supreme-toolkit"]
    paths:
      - ".github/workflows/write-supreme-artifact-split.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download verified Windows candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Folio-Write-Supreme-Windows
          path: candidate
          github-token: ${{ github.token }}
          run-id: 36315161221

      - name: Verify expected files
        run: |
          test -s candidate/Folio-2.3.0-setup.exe
          test -s candidate/Folio-2.3.0-portable.exe
          test -s candidate/write-supreme-sha256.txt
          cat candidate/write-supreme-sha256.txt

      - name: Upload portable separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Folio-Write-Supreme-Portable
          retention-days: 14
          compression-level: 0
          path: |
            candidate/Folio-2.3.0-portable.exe
            candidate/write-supreme-sha256.txt

      - name: Upload installer separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Folio-Write-Supreme-Setup
          retention-days: 14
          compression-level: 0
          path: |
            candidate/Folio-2.3.0-setup.exe
            candidate/write-supreme-sha256.txt
