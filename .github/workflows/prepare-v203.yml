name: Prepare Folio 2.0.3 release metadata

on:
  push:
    branches:
      - fix/v2.0.3-ui-frontmatter-cover
    paths:
      - scripts/prepare-v203.mjs
      - .github/workflows/prepare-v203.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: node scripts/prepare-v203.mjs
      - name: Verify version consistency
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='2.0.3'||p.version!==l.version||p.version!==l.packages[''].version) throw new Error('2.0.3 version mismatch')"
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json web/src/StartScreen.tsx scripts/packaged-ui-smoke.mjs .github/workflows/windows-release.yml
          git commit -m "Prepare Folio 2.0.3 release"
          git push
