name: Apply Folio 2.0.1 fixes

on:
  push:
    branches: ["release/v2.0.1"]
    paths:
      - "scripts/apply-v201-fixes.mjs"
      - ".github/workflows/apply-v201-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Repair applicator syntax and apply 2.0.1 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/apply-v201-fixes.mjs")
          s = p.read_text(encoding="utf-8")
          old = '  const temp = `${file}.tmp-${process.pid}-${Date.now()}`;'
          new = '  const temp = file + ".tmp-" + process.pid + "-" + Date.now();'
          if old not in s:
              raise SystemExit("applicator repair anchor missing")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          node scripts/apply-v201-fixes.mjs
      - name: Commit product patch and remove applicator
        shell: bash
        run: |
          rm -f scripts/apply-v201-fixes.mjs .github/workflows/apply-v201-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Folio 2.0.1 regressions"
          git push origin HEAD:release/v2.0.1
