name: Finalize Folio 2.0 foundation

on:
  push:
    branches: [release/v2.0.0]
    paths:
      - scripts/finalize-v2-foundation.mjs
      - .github/workflows/v2-foundation-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply final 2.0 foundation cleanup
        run: node scripts/finalize-v2-foundation.mjs
      - name: Commit finalization
        run: |
          git config user.name "deletethisbozo-hue"
          git config user.email "deletethisbozo@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize Folio 2.0 curated foundation"
          git push origin HEAD:release/v2.0.0
