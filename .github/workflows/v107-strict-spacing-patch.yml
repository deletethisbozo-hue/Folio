name: Temporary v1.0.7 strict spacing patch

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-strict-spacing-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
          fetch-depth: 0
      - name: Apply strict spacing correction
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')
          old = '  const configuredWordSpacing = fontSize * (emergency || finalCompression ? 0.12 : 0.099);\n  const semanticGapHeadroom = Math.max(0, fontSize * 0.37 - spaceWidth);'
          new = '  const configuredWordSpacing = fontSize * (emergency || finalCompression ? 0.12 : 0.075);\n  // Cap the rendered semantic gap, including positive tracking and the allowed 1% glyph stretch.\n  const semanticGapHeadroom = Math.max(0, fontSize * 0.37 / 1.01 - spaceWidth - fontSize * 0.003);'
          if s.count(old) != 1:
              raise SystemExit(f'expected spacing block once, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/compositor.ts
          git diff --cached --check
          git commit -m 'Restore strict v1.0.7 spacing discipline'
          git push origin HEAD:fix/v1.0.7
