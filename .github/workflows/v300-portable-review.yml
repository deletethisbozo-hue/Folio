name: Split Folio 3.0 portable review

on:
  push:
    branches: ["review/v300-portable"]
    paths:
      - ".github/workflows/v300-portable-review.yml"

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download verified Folio 3.0 Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Folio-3.0.0-Windows
          path: candidate
          github-token: ${{ github.token }}
          run-id: 37400460563

      - name: Verify and stage portable candidate
        run: |
          portable="$(find candidate -type f -name 'Folio-3.0.0-portable.exe' -print -quit)"
          hashes="$(find candidate -type f -name 'sha256.txt' -print -quit)"
          test -n "$portable"
          test -n "$hashes"
          test -s "$portable"
          test -s "$hashes"
          grep "Folio-3.0.0-portable.exe" "$hashes"
          mkdir -p portable-review
          cp "$portable" portable-review/Folio-3.0.0-portable.exe
          cp "$hashes" portable-review/sha256.txt
          ls -lh portable-review
          cat portable-review/sha256.txt

      - name: Upload portable review artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folio-3.0.0-Portable-Review
          retention-days: 14
          compression-level: 0
          path: |
            portable-review/Folio-3.0.0-portable.exe
            portable-review/sha256.txt
