name: Apply Folio 2.0 cover UI regression patch

on:
  push:
    branches: ["release/v2.0.0"]
    paths:
      - ".github/workflows/v2-cover-ui-test-patch.yml"
      - "scripts/apply-v2-cover-ui-tests.mjs"

permissions:
  contents: write

concurrency:
  group: folio-v2-cover-ui-test-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Patch browser regression suite
        run: node scripts/apply-v2-cover-ui-tests.mjs
      - name: Commit patched test
        shell: bash
        run: |
          if git diff --quiet -- tests/ui-runtime.test.ts; then
            echo "No UI test changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui-runtime.test.ts
          git commit -m "Cover Folio 2.0 workspace in UI regression tests"
          git push origin HEAD:release/v2.0.0
