name: v1.0.7 current Polish pattern probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-compositor-variants.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install current CTAN pattern engine checkout-only
        run: npm install --no-save --no-package-lock hyphen@1.14.1
      - name: Compare Polish pattern splits
        run: |
          node --input-type=module <<'NODE'
          import Hypher from 'hypher';
          import oldPatterns from 'hyphenation.pl';
          import currentPackage from 'hyphen/pl/index.js';
          import fs from 'node:fs';
          const { hyphenateSync: current } = currentPackage;
          const old = new Hypher(oldPatterns);
          const words = ['jego','więcej','przygnębiająca','perspektywy','życie','było','wyborem','porażka','tylko','konsekwencją'];
          const result = words.map(word => ({
            word,
            legacy: old.hyphenate(word).join('-'),
            modern: current(word, { html: false, minWordLength: 4 }).replaceAll('\u00ad', '-'),
          }));
          console.log(JSON.stringify(result, null, 2));
          fs.writeFileSync('polish-pattern-probe.json', JSON.stringify(result, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v107-current-polish-pattern-probe
          path: polish-pattern-probe.json
          if-no-files-found: error
