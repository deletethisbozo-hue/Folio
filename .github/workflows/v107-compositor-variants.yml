name: v1.0.7 diverse line-fit candidates experiment

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-compositor-variants.yml'

permissions:
  contents: read

jobs:
  diverse-fits:
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply 42/90 recipe and preserve spacing-extreme legal fits
        shell: python
        run: |
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches: {count}')
              return text.replace(old, new, 1)

          p = Path('web/src/compositor.ts')
          s = p.read_text(encoding='utf-8')

          s = one(s, '  let bestHyphenBudgetPriority = 3;\n', '  let bestHyphenBudgetPriority = 3;\n  let bestWidowPriority = 2;\n', 'widow declaration')
          s = one(
              s,
              '    const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);\n    // 0.45 is the release ceiling, not the composition target. Prefer 0.40\n',
              '    const sectionRate = sectionHyphenatedLines / Math.max(1, sectionJustifiedLines);\n    const finalSemanticWords = state.from < count\n      ? 1 + words.slice(state.from + 1, count).filter((word) => word.spaceBefore).length\n      : 0;\n    const widowPriority = finalSemanticWords === 1 ? 1 : 0;\n    // 0.45 is the release ceiling, not the composition target. Prefer 0.40\n',
              'widow rate',
          )
          s = one(
              s,
              '    if (hyphenBudgetPriority < bestHyphenBudgetPriority\n      || (hyphenBudgetPriority === bestHyphenBudgetPriority && betterSamePriority)) {\n      bestHyphenBudgetPriority = hyphenBudgetPriority;\n      bestCost = state.cost;\n      bestSectionRate = sectionRate;\n      bestKey = key;\n    }\n',
              '    if (widowPriority < bestWidowPriority\n      || (widowPriority === bestWidowPriority\n        && (hyphenBudgetPriority < bestHyphenBudgetPriority\n          || (hyphenBudgetPriority === bestHyphenBudgetPriority && betterSamePriority)))) {\n      bestWidowPriority = widowPriority;\n      bestHyphenBudgetPriority = hyphenBudgetPriority;\n      bestCost = state.cost;\n      bestSectionRate = sectionRate;\n      bestKey = key;\n    }\n',
              'widow selection',
          )
          s = one(
              s,
              'const configuredWordSpacing = fontSize * (emergency || finalCompression ? 0.12 : 0.075);',
              'const configuredWordSpacing = fontSize * (emergency || finalCompression ? 0.12 : 0.099);',
              'strict positive spacing',
          )

          s = one(
              s,
              '  selection: "badness" | "continuity" | "spacing-continuity" = "badness",\n',
              '  selection: "badness" | "continuity" | "spacing-continuity" | "spacing-low" | "spacing-high" = "badness",\n',
              'selection modes',
          )
          s = one(
              s,
              '    const rank = selection === "continuity"\n      ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness\n      : selection === "spacing-continuity"\n        ? Math.abs(wordSpacing - targetWordSpacing) * 1_000_000 + candidate.badness\n        : candidate.badness;\n',
              '    const rank = selection === "continuity"\n      ? Math.abs(glyphScale - previousGlyphScale) * 1_000_000 + candidate.badness\n      : selection === "spacing-continuity"\n        ? Math.abs(wordSpacing - targetWordSpacing) * 1_000_000 + candidate.badness\n        : selection === "spacing-low"\n          ? wordSpacing * 1_000_000 + candidate.badness\n          : selection === "spacing-high"\n            ? -wordSpacing * 1_000_000 + candidate.badness\n            : candidate.badness;\n',
              'selection ranking',
          )

          marker = '''        const spacingFit = strictSpacingFit ?? (emergency && !last\n          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, true, false, language, "spacing-continuity", previous.wordSpacing)\n          : null);\n'''
          addition = marker + '''        const fitUsesEmergencyEnvelope = !strictFit && emergency && !last;\n        const lowSpacingFit = !last\n          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, fitUsesEmergencyEnvelope, false, language, "spacing-low")\n          : finalCompressionFit\n            ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, false, true, language, "spacing-low")\n            : null;\n        const highSpacingFit = !last\n          ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, fitUsesEmergencyEnvelope, false, language, "spacing-high")\n          : finalCompressionFit\n            ? fitLine(adjustment, gaps, trackingOps, spaceWidth, fontSize, natural, previous.glyphScale, false, true, language, "spacing-high")\n            : null;\n'''
          s = one(s, marker, addition, 'diverse fit declarations')

          old_options = '''        if (spacingFit && !fitOptions.some((candidate) =>\n          candidate\n          && Math.abs(candidate.glyphScale - spacingFit.glyphScale) < 0.000001\n          && Math.abs(candidate.wordSpacing - spacingFit.wordSpacing) < 0.000001\n          && Math.abs(candidate.tracking - spacingFit.tracking) < 0.000001\n        )) fitOptions.push(spacingFit);\n        if (!fitOptions.length && (last || rescueNatural)) fitOptions.push(null);\n'''
          new_options = '''        if (spacingFit && !fitOptions.some((candidate) =>\n          candidate\n          && Math.abs(candidate.glyphScale - spacingFit.glyphScale) < 0.000001\n          && Math.abs(candidate.wordSpacing - spacingFit.wordSpacing) < 0.000001\n          && Math.abs(candidate.tracking - spacingFit.tracking) < 0.000001\n        )) fitOptions.push(spacingFit);\n        for (const diverseFit of [lowSpacingFit, highSpacingFit]) {\n          if (diverseFit && !fitOptions.some((candidate) =>\n            candidate\n            && Math.abs(candidate.glyphScale - diverseFit.glyphScale) < 0.000001\n            && Math.abs(candidate.wordSpacing - diverseFit.wordSpacing) < 0.000001\n            && Math.abs(candidate.tracking - diverseFit.tracking) < 0.000001\n          )) fitOptions.push(diverseFit);\n        }\n        if (!fitOptions.length && (last || rescueNatural)) fitOptions.push(null);\n'''
          s = one(s, old_options, new_options, 'diverse fit options')
          p.write_text(s, encoding='utf-8')

          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          t = one(
              t,
              '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n',
              '  const probeNames = new Set(["modern", "decorative", "editorial", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 4) throw new Error(`Expected exactly 4 probe themes, found ${themes.length}`);\n',
              'probe theme subset',
          )
          q.write_text(t, encoding='utf-8')
      - run: npm run typecheck
      - run: npm run build
      - name: Reference corpus
        id: reference
        continue-on-error: true
        run: node --import tsx scripts/v107-visual-qa.ts
      - name: 12-case targeted matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('build/qa-v107/theme-matrix.json')
          if not p.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          out = {
              'reference': '${{ steps.reference.outcome }}',
              'matrix': '${{ steps.matrix.outcome }}',
              'passed': d['passed'],
              'failed': d['failed'],
              'results': [
                  {'theme': r['theme'], 'scenario': r['scenario'], 'pass': r['pass'], 'failures': r['failures']}
                  for r in d['results']
              ],
          }
          Path('build/qa-v107/diverse-line-fits.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
          if '${{ steps.reference.outcome }}' != 'success':
              raise SystemExit('reference corpus failed')
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-diverse-line-fits
          path: build/qa-v107/diverse-line-fits.json
          if-no-files-found: error
