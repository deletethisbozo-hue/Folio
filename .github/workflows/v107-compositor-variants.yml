name: v1.0.7 hyphenation probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-compositor-variants.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Print Polish hyphenation candidates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import Hypher from 'hypher';
          import pl from 'hyphenation.pl';
          import en from 'hyphenation.en-us';

          const polish = new Hypher(pl);
          const english = new Hypher(en);
          const words = [
            'konsekwencją',
            'bezsensowności',
            'brzemieniem',
            'przygnębiająca',
            'przygnębiający',
            'przemilczanych',
            'profesjonalny',
            'typograficzną',
            'najtrudniejsze',
            'odpowiedzi',
            'zachowywać',
            'rozsądne',
            'dzielenie',
            'wszystkich',
          ];
          for (const word of words) {
            console.log(JSON.stringify({ word, parts: polish.hyphenate(word), soft: polish.hyphenateText(word) }));
          }
          for (const word of ['extraordinary','professional','typesetting','overlooked']) {
            console.log(JSON.stringify({ word, parts: english.hyphenate(word), soft: english.hyphenateText(word) }));
          }
          NODE
