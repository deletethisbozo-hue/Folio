name: Prepare Folio 2.0.1 release workflow

on:
  push:
    branches: ["release/v2.0.1"]
    paths:
      - ".github/workflows/apply-v201-release-workflow.yml"
      - "scripts/prepare-v201-release-workflow.mjs"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Patch release workflow
        run: node scripts/prepare-v201-release-workflow.mjs
      - name: Commit release workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-release.yml .github/workflows/apply-v201-release-workflow.yml scripts/prepare-v201-release-workflow.mjs
          git commit -m "Prepare Folio 2.0.1 Windows release"
          git push origin HEAD:release/v2.0.1
