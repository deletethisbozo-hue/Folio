name: Qualify Folio 2.0.4 patch

on:
  push:
    branches: [fix/v2.0.4-preview-media-polish-stage]

permissions:
  contents: write

concurrency:
  group: qualify-folio-v204
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event.head_commit.message != 'Folio 2.0.4: fix preview media and UI polish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Pandoc 3.11
        run: |
          mkdir -p build/pandoc build/pandoc-unpack
          curl -L --fail -o build/pandoc.tar.gz https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz
          echo '37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc.tar.gz' | sha256sum -c -
          tar -xzf build/pandoc.tar.gz -C build/pandoc-unpack --strip-components=1
          cp build/pandoc-unpack/bin/pandoc build/pandoc/pandoc
          chmod +x build/pandoc/pandoc
          echo "PANDOC_BIN=$GITHUB_WORKSPACE/build/pandoc/pandoc" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply 2.0.4 patch
        run: node scripts/apply-v204-fixed.mjs
      - name: Apply illustration follow-up
        run: |
          node scripts/v204-followup.mjs
          node scripts/v204-upload-diagnostic.mjs
          node scripts/apply-v204-followup.mjs
          node scripts/v204-frontmatter-race-fix.mjs
          node scripts/v204-illustration-commit-fix.mjs
          node scripts/v204-illustration-observer-fix.mjs
          node scripts/v204-illustration-userflow-test.mjs
      - name: Apply final branding and UI polish
        run: |
          node scripts/v204-pelagiad-branding.mjs
          node scripts/v204-final-ui-polish.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build web for focused browser checks
        run: npm run build:web
      - name: Focused illustration qualification
        run: |
          node --import tsx tests/illustration-ui.test.ts
          node --import tsx tests/illustration-preview-ui.test.ts
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit qualified patch
        run: |
          rm -f scripts/apply-v204.mjs scripts/apply-v204-fixed.mjs scripts/v204-followup.mjs scripts/v204-upload-diagnostic.mjs scripts/apply-v204-followup.mjs scripts/v204-frontmatter-race-fix.mjs scripts/v204-illustration-commit-fix.mjs scripts/v204-illustration-observer-fix.mjs scripts/v204-illustration-userflow-test.mjs scripts/v204-pelagiad-branding.mjs scripts/v204-final-ui-polish.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Folio 2.0.4: fix preview media and UI polish"
          git push origin HEAD:fix/v2.0.4-preview-media-polish-stage
