name: Folio micro polish preview

on:
  push:
    branches: ["feature/folio-micro-polish-ui"]
    paths:
      - "web/**"
      - "scripts/capture-brand-preview.ts"
      - ".github/workflows/micro-polish-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-micro-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Existing Writing Studio browser smoke
        run: node --import tsx tests/write-studio-ui.test.ts
      - name: Capture real Folio micro polish preview
        run: node --import tsx scripts/capture-brand-preview.ts
      - name: Upload real Folio screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Folio-2.3-micro-polish-preview
          path: artifacts/folio-brand-preview.png
          if-no-files-found: error
          retention-days: 14
