name: Qualify Folio 1.0.5 on Windows

on:
  push:
    branches: ["release/v1.0.5"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-v105-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out release candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and apply reconstructed Work changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("scripts/v105-reconstruct.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("'export function plainTextToMarkdown(text: string): string {'", "'export function plainTextToMarkdown(value: string): string {'", 1)
          s = s.replace('export function plainTextToMarkdown(text: string): string {', 'export function plainTextToMarkdown(value: string): string {', 1)
          s = s.replace('  const classStyles = collectClassStyles(doc);', '''  const classStyles = new Map<string, string>();
            for (const sheet of Array.from(doc.querySelectorAll("style"))) {
              const css = sheet.textContent ?? "";
              for (const match of css.matchAll(/\\.([_a-zA-Z][\\w-]*)[^,{]*\\{([^}]*)\\}/g)) {
                classStyles.set(match[1], `${classStyles.get(match[1]) ?? ""};${match[2]}`);
              }
            }
            const styled = Array.from(doc.body.querySelectorAll("[class]"));
            for (const [index, element] of styled.entries()) {
              const fromClasses = Array.from(element.classList).map((name) => classStyles.get(name) ?? "").join(";");
              if (fromClasses) element.setAttribute("style", `${fromClasses};${element.getAttribute("style") ?? ""}`);
              if (index && index % 750 === 0) await new Promise<void>((resolve) => requestAnimationFrame(() => resolve()));
            }''', 1)
          s = s.replace('renderNode(child, classStyles)', 'renderNode(child)', 1)
          p.write_text(s, encoding="utf-8")
          '@ | python -
          python scripts\v105-reconstruct.py

      - name: Apply safety and navigation follow-up patches
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          app = Path("web/src/App.tsx")
          s = app.read_text(encoding="utf-8")
          replacements = [
            ('if (current?.head && current.body && previewIdentityRef.current === identity) {', 'if (current?.head && current.body) {'),
            ('      onPreviewLoad(scrollTop);\n      return;', '      previewIdentityRef.current = identity;\n      pendingPreviewIdentityRef.current = "";\n      onPreviewLoad(scrollTop);\n      return;'),
            ('key={`${project.projectId}:${selectedId}:${previewMode}`}', 'key={`${project.projectId}:${selectedId}`}'),
            ('    if (!document?.editable || !project || !selectedId) return true;\n    await flushEditorDom();\n    const sectionId = selectedId;', '    if (!document?.editable || !project || !selectedId) return true;\n    await flushEditorDom();\n    if (draftRef.current === document.markdown) { setDirty(false); return true; }\n    const sectionId = selectedId;'),
            ('  async function openFolder(folderPath?: string) {\n    setBusy(true);', '  async function openFolder(folderPath?: string) {\n    if (project && !(await saveCurrent())) return;\n    setBusy(true);'),
            ('  async function loadSample() {\n    setBusy(true);', '  async function loadSample() {\n    if (project && !(await saveCurrent())) return;\n    setBusy(true);'),
            ('  async function beginNewBook() {\n    setBusy(true);', '  async function beginNewBook() {\n    if (project && !(await saveCurrent())) return;\n    setBusy(true);'),
            ('  async function addChapter() {\n    if (!project || !meta) return;', '  async function addChapter() {\n    if (!project || !meta || !(await saveCurrent())) return;'),
            ('  async function addMatterSection(type: MatterType) {\n    if (!project || !meta) return;', '  async function addMatterSection(type: MatterType) {\n    if (!project || !meta || !(await saveCurrent())) return;'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise RuntimeError(f"missing App follow-up marker: {old[:90]!r}")
              s = s.replace(old, new, 1)
          # These lines only existed in one intermediate reconstruction. If they
          # appear, remove them; if not, that is already the desired state.
          s = s.replace('          if (editor) editor.contentEditable = "false";\n', '', 1)
          s = s.replace('      if (editor && document?.editable) editor.contentEditable = "true";\n', '', 1)
          app.write_text(s, encoding="utf-8")

          css = Path("web/src/preview-calibration.css")
          s = css.read_text(encoding="utf-8")
          s = s.replace('device-kindle-paperwhite { width:min(95%,480px,calc((100dvh - 112px) * .756)); aspect-ratio:.756; }', 'device-kindle-paperwhite { width:min(95%,480px,calc((100dvh - 112px) * .750)); aspect-ratio:.750; }')
          s = s.replace('device-kindle-oasis { width:min(96%,510px,calc((100dvh - 112px) * .796)); aspect-ratio:.796; }', 'device-kindle-oasis { width:min(96%,510px,calc((100dvh - 112px) * .752)); aspect-ratio:.752; }')
          s = s.replace('device-ipad { width:min(96%,520px,calc((100dvh - 112px) * .715)); aspect-ratio:.715; }', 'device-ipad { width:min(96%,520px,calc((100dvh - 112px) * .750)); aspect-ratio:.750; }')
          css.write_text(s, encoding="utf-8")

          release = Path(".github/workflows/windows-release.yml")
          s = release.read_text(encoding="utf-8")
          s = s.replace('runs-on: windows-latest', 'runs-on: windows-2025', 1)
          s = s.replace('node-version: 22', 'node-version: 22.23.2', 1)
          pattern = r'''          \$url = gh api repos/jgm/pandoc/releases/latest --jq .*?\n          if \(-not \$url\) \{ throw "Could not find the current Pandoc Windows archive\." \}\n          Invoke-WebRequest -Uri \$url -OutFile build\\pandoc\.zip'''
          new = '''          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\\pandoc.zip
          $actual = (Get-FileHash build\\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc 3.11 checksum mismatch: $actual" }'''
          s, n = re.subn(pattern, lambda _: new, s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError("could not pin Pandoc in windows-release.yml")
          old_browser = '        run: npx puppeteer browsers install chrome-headless-shell'
          if old_browser not in s:
              raise RuntimeError("could not find Chromium install step")
          s = s.replace(old_browser, '''        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "152\\.0\\.7977\\.75" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell 152.0.7977.75 was not installed." }''', 1)
          old_notes = 'Folio 1.0.4 fixes illegal mid-word breaks by distinguishing real discretionary hyphenation points from ordinary DOM/style boundaries, and makes Polish/English hyphenation deliberately more restrained. Long-manuscript editing is substantially lighter: redundant server preview renders are skipped while typing, large contenteditable input is coalesced, and the paragraph compositor runs lazily near the viewport without forcing a full-document geometry pass. Kindle, iPad, iPhone and Android previews now use calibrated logical screen geometry and proportional reading metrics, and Folio displays page counts for the current chapter and the whole book (exact whole-book pages in Print preview, estimated reflowable pages at the selected Folio reading preset). Print/PDF composition uses the same corrected break rules. The Windows build is validated by the full formatter/export suite and a packaged-EXE smoke test.'
          new_notes = 'Folio 1.0.5 hardens manuscript safety with serialized autosave, atomic source/config replacement and a close-time flush gate. Large Writer/Word pastes are processed cooperatively instead of forcing every keystroke through whole-document serialization. Reflow preview no longer sends backend renders for each draft and uses one deterministic Standard calibration without enlarging device shells. The professional compositor now bounds inter-word expansion and tracking, penalizes consecutive hyphenation, preserves authored soft hyphens and inline semantics, isolates scene breaks, and uses the same rules for preview and print. The desktop UI adds two restrained editorial tones, Ivory & Ink and Midnight Editorial, while keeping the three-pane Folio workflow. Windows assets are pinned and the release is validated by typecheck, the full suite, packaged UI smoke, EPUB/PDF/print export and release hashing.'
          if old_notes not in s:
              raise RuntimeError("could not find 1.0.4 release notes")
          release.write_text(s.replace(old_notes, new_notes, 1), encoding="utf-8")
          '@ | python -

      - name: Remove one-shot reconstruction script
        shell: pwsh
        run: Remove-Item scripts\v105-reconstruct.py -Force

      - name: Check patch integrity
        shell: pwsh
        run: |
          git diff --check
          git status --short
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne "1.0.5") { throw "package.json is not 1.0.5" }
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          if ($lock.version -ne "1.0.5" -or $lock.packages."".version -ne "1.0.5") { throw "package-lock root version is not 1.0.5" }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Download pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable was not found after extraction." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe
          & build\pandoc\pandoc.exe --version | Select-Object -First 1

      - name: Download pinned Chromium runtime
        shell: pwsh
        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "152\.0\.7977\.75" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell 152.0.7977.75 was not installed." }
          $chrome.FullName

      - name: Typecheck
        run: npm run typecheck

      - name: Full formatter and UI suite
        run: npm test

      - name: Build web and server
        run: npm run build

      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Smoke-test packaged Folio
        shell: pwsh
        run: |
          $env:FOLIO_E2E_PORT = "43127"
          $env:FOLIO_E2E_DEBUG_PORT = "43128"
          $exe = Resolve-Path "release\Folio-1.0.5-portable.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $base = "http://127.0.0.1:43127"
            $health = $null
            for ($i = 0; $i -lt 120; $i++) {
              try { $health = Invoke-RestMethod "$base/api/health"; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $health -or -not $health.ok -or -not $health.pandoc.ok) { throw "Packaged /api/health did not become ready with bundled Pandoc." }
            node scripts\packaged-ui-smoke.mjs
          }
          finally {
            Get-Process Folio -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Hash candidate binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\qa | Out-Null
          $required = @("release\Folio-1.0.5-setup.exe", "release\Folio-1.0.5-portable.exe")
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing candidate asset: $file" }
            if ((Get-Item $file).Length -lt 1MB) { throw "Candidate asset is unexpectedly small: $file" }
          }
          Get-FileHash $required -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Tee-Object -FilePath build\qa\sha256.txt

      - name: Upload qualified Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Folio-1.0.5-qualified-candidate
          path: |
            release/Folio-1.0.5-setup.exe
            release/Folio-1.0.5-portable.exe
            build/qa/sha256.txt
          if-no-files-found: error

      - name: Commit exact tested tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw "Qualification produced no candidate diff." }
          git commit -m "Prepare Folio 1.0.5 release candidate"
          git push origin HEAD:release/v1.0.5
