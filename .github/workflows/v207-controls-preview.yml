name: Capture Folio 2.0.7 Control Preview

on:
  push:
    branches: [fix/v2.0.7-cover-button-image-title]

permissions:
  contents: read

jobs:
  controls-preview:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out v2.0.7 preview branch
        uses: actions/checkout@v4

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable missing" }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install Chromium runtime
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Build Folio
        run: npm run build

      - name: Capture real Folio controls in context
        run: node --import tsx scripts/v207-controls-preview.ts

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Folio-2.0.7-Control-Preview
          path: build/qa-v207-controls/*.png
          if-no-files-found: error
