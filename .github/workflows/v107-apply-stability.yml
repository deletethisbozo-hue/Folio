name: Apply v1.0.7 stability patch

on:
  push:
    branches:
      - fix/v1.0.7
    paths:
      - .github/workflows/v107-apply-stability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.7
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-v107-stability.py
      - name: Remove temporary patch script
        run: rm -f scripts/apply-v107-stability.py
      - name: Commit product fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/v107-windows-qualification.yml .github/workflows/windows-release.yml
          git add -A
          git diff --cached --check
          git commit -m "Stabilize v1.0.7 composition and qualification"
          git push origin HEAD:fix/v1.0.7
