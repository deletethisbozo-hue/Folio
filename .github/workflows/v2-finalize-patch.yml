name: Apply Folio 2.0 final release metadata

on:
  push:
    branches: ["release/v2.0.0"]
    paths: [".github/workflows/v2-finalize-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply final 2.0 metadata and curated-theme decisions
        shell: python
        run: |
          import json
          from pathlib import Path

          package = Path("package.json")
          text = package.read_text()
          text = text.replace('"version": "1.0.12"', '"version": "2.0.0"', 1)
          text = text.replace('"icon": "assets/folio.ico"', '"icon": "assets/folio-icon.png"')
          package.write_text(text)

          lock_path = Path("package-lock.json")
          lock = json.loads(lock_path.read_text())
          lock["version"] = "2.0.0"
          if "" in lock.get("packages", {}):
              lock["packages"][""]["version"] = "2.0.0"
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          themes = Path("server/pipeline/themes.ts")
          text = themes.read_text()
          old = '''export const SUPPORTED_THEMES = [
            "blackletter", "stanza", "witchlight", "revenant", "solstice", "literary", "necropolis", "nocturne",
            "obsidian", "grimoire", "ivory", "heritage", "decorative", "cloister", "cathedral", "aubade",
          ] as const satisfies readonly ThemeName[];'''
          new = '''export const SUPPORTED_THEMES = [
            "blackletter", "stanza", "witchlight", "revenant", "solstice", "literary", "nocturne",
            "obsidian", "grimoire", "ivory", "heritage", "decorative", "cathedral", "aubade",
          ] as const satisfies readonly ThemeName[];'''
          if old not in text:
              raise SystemExit("SUPPORTED_THEMES block did not match expected Folio 2.0 source")
          themes.write_text(text.replace(old, new))

          smoke = Path("scripts/packaged-ui-smoke.mjs")
          text = smoke.read_text()
          text = text.replace("themes !== 16", "themes !== 14")
          text = text.replace("exactly 16 curated themes", "exactly 14 curated themes")
          text = text.replace("16 curated themes", "14 curated themes")
          smoke.write_text(text)

          win = Path(".github/workflows/v2-windows-qualification.yml")
          text = win.read_text()
          text = text.replace("$themes.Count -ne 16", "$themes.Count -ne 14")
          text = text.replace("exactly 16 curated themes", "exactly 14 curated themes")
          win.write_text(text)

          start = Path("web/src/StartScreen.tsx")
          text = start.read_text().replace("2.0 development", "2.0")
          start.write_text(text)
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/v2-finalize-patch.yml
          git config user.name "deletethisbozo-hue"
          git config user.email "deletethisbozo@gmail.com"
          git add package.json package-lock.json server/pipeline/themes.ts scripts/packaged-ui-smoke.mjs .github/workflows/v2-windows-qualification.yml web/src/StartScreen.tsx .github/workflows/v2-finalize-patch.yml
          git commit -m "Finalize Folio 2.0 release metadata and 14-theme set"
          git push origin HEAD:release/v2.0.0
