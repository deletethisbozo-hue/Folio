name: Release Folio 2.3.0 Accurate Device Previews

on:
  push:
    branches: ["release/v2.3.0-accurate-device-previews"]
    paths:
      - ".github/workflows/release-2.3.0-accurate-device-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-release-2-3-0-accurate-devices
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out exact 2.3.0 release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Folio 2.3.0 version
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne "2.3.0") { throw "This release is scoped to Folio 2.3.0, found $version." }
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!==l.version||p.version!==l.packages[''].version) throw new Error('package.json/package-lock.json version mismatch')"
          if ($LASTEXITCODE -ne 0) { throw "Version consistency check failed." }
          "FOLIO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Refuse an existing v2.3.0 release or tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:FOLIO_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Refusing to replace it." }
          $global:LASTEXITCODE = 0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists. Refusing to move it." }
          $global:LASTEXITCODE = 0

      - name: Download pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc 3.11 checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable was not found after extraction." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe
          & build\pandoc\pandoc.exe --version | Select-Object -First 1

      - name: Install Chromium runtime
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Write Studio logic and persistence tests
        run: node --import tsx tests/write-studio.test.ts

      - name: Build web and server
        run: npm run build

      - name: Writing Studio browser smoke
        run: node --import tsx tests/write-studio-ui.test.ts

      - name: Validate accurate device previews
        run: node --import tsx scripts/capture-device-previews.ts

      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Smoke-test portable package
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:FOLIO_E2E_PORT = "43187"
          $env:FOLIO_E2E_DEBUG_PORT = "43188"
          $exe = (Resolve-Path "release\Folio-$env:FOLIO_VERSION-portable.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 120; $i++) {
              if ($process.HasExited) { throw "Portable Folio exited before /api/health became ready (exit code $($process.ExitCode))." }
              try { $health = Invoke-RestMethod "http://127.0.0.1:43187/api/health" -TimeoutSec 1; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $health -or -not $health.ok -or -not $health.pandoc.ok) { throw "Portable Folio did not become healthy with bundled Pandoc." }
            $sample = Invoke-RestMethod -Method Post -ContentType "application/json" -Body "{}" "http://127.0.0.1:43187/api/sample"
            if (-not $sample.projectId) { throw "Packaged sample project failed to open." }
          }
          finally {
            Get-Process Folio -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Smoke-test installer package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = (Resolve-Path "release\Folio-$env:FOLIO_VERSION-setup.exe").Path
          $installDir = "C:\Folio230E2E"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $install = Start-Process -FilePath $setup -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($install.ExitCode)." }
          $installedExe = Join-Path $installDir "Folio.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed Folio.exe not found at $installedExe" }

          $env:FOLIO_E2E_PORT = "43197"
          $env:FOLIO_E2E_DEBUG_PORT = "43198"
          $process = Start-Process -FilePath $installedExe -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 120; $i++) {
              if ($process.HasExited) { throw "Installed Folio exited before /api/health became ready (exit code $($process.ExitCode))." }
              try { $health = Invoke-RestMethod "http://127.0.0.1:43197/api/health" -TimeoutSec 1; break } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $health -or -not $health.ok -or -not $health.pandoc.ok) { throw "Installed Folio did not become healthy with bundled Pandoc." }
          }
          finally {
            Get-Process Folio -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Hash release binaries
        shell: pwsh
        run: |
          $required = @(
            "release\Folio-$env:FOLIO_VERSION-setup.exe",
            "release\Folio-$env:FOLIO_VERSION-portable.exe"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing release asset: $file" }
            if ((Get-Item $file).Length -lt 1MB) { throw "Release asset is unexpectedly small: $file" }
          }
          Get-FileHash $required -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii release\sha256.txt
          Get-Content release\sha256.txt

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Folio-2.3.0-Windows
          retention-days: 30
          path: |
            release/Folio-2.3.0-setup.exe
            release/Folio-2.3.0-portable.exe
            release/sha256.txt
            artifacts/device-previews/**
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:FOLIO_VERSION"
          gh release create $tag "release\Folio-$env:FOLIO_VERSION-setup.exe" "release\Folio-$env:FOLIO_VERSION-portable.exe" "release\sha256.txt" --repo $env:GITHUB_REPOSITORY --target "$env:GITHUB_SHA" --title "Folio $env:FOLIO_VERSION for Windows" --notes "Folio 2.3.0 is the release built from the approved feature/accurate-device-previews codebase. It preserves the existing Folio workspace while shipping the accurate device preview set and the final preview-shell corrections from that branch. This release includes both a normal Windows installer and the portable executable. The installer and portable build are gated by version consistency, typecheck, Writing Studio tests, browser smoke tests, accurate-device preview QA, packaged portable smoke, installed-app smoke, and SHA-256 hashing."
