name: Prepare Folio 2.0 release workflow

on:
  push:
    branches:
      - release/v2.0.0
    paths:
      - .github/workflows/v2-update-release-workflow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
          fetch-depth: 0
      - name: Update immutable Windows release workflow for Folio 2.0
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/windows-release.yml')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'Verify Folio 1.0.12 version consistency': 'Verify Folio 2.0.0 version consistency',
            'if ($version -ne "1.0.12") { throw "Windows release is scoped to Folio 1.0.12, found $version." }': 'if ($version -ne "2.0.0") { throw "Windows release is scoped to Folio 2.0.0, found $version." }',
            'if ($themes.Count -lt 29) { throw "Packaged app returned only $($themes.Count) themes." }': 'if ($themes.Count -ne 14) { throw "Folio 2.0 packaged app must expose exactly 14 curated themes, found $($themes.Count)." }',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing expected release-workflow text: {old}')
            text = text.replace(old, new, 1)

          folio_theme_count = text.count('theme = "folio"')
          if folio_theme_count != 2:
            raise SystemExit(f'Expected two obsolete theme = "folio" probes, found {folio_theme_count}')
          text = text.replace('theme = "folio"', 'theme = "literary"')

          lines = text.splitlines()
          note_index = next((i for i, line in enumerate(lines) if line.lstrip().startswith('--notes "Folio 1.0.12 ')), None)
          if note_index is None:
            raise SystemExit('Old Folio 1.0.12 release notes line was not found')
          indent = lines[note_index][:len(lines[note_index]) - len(lines[note_index].lstrip())]
          notes = (
            'Folio 2.0 is a major workflow and publishing update: a new Recent Books start screen opens projects without repeated folder hunting; '
            'covers are first-class book items with live preview and correct EPUB/reading-PDF export; Front Matter supports full-page image pages for maps and illustrations; '
            'Print Preview now survives Reader/Print transitions reliably; leading en/em dashes no longer become drop caps during export; and the style library is reduced to 14 curated themes '
            'with obsolete Cloister and Necropolis removed and fixed micro-labels eliminated. The release is gated by typecheck, the complete formatter/UI suite on Linux and Windows, '
            'visual/typesetting QA, the full Print PDF matrix, packaged executable smoke tests, EPUB/PDF/print export checks and SHA-256 hashing.'
          )
          lines[note_index] = indent + '--notes "' + notes + '"'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit Folio 2.0 release workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-release.yml
          git commit -m "Prepare immutable Windows release for Folio 2.0.0"
          git push origin HEAD:release/v2.0.0
