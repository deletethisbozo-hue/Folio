name: Folio 30-theme qualification

on:
  workflow_dispatch:
  push:
    branches: ["feature/30-production-themes"]
    paths:
      - ".github/workflows/theme-expansion-qualification.yml"
      - "server/pipeline/themes.ts"
      - "server/pipeline/types.ts"
      - "themes/**"
      - "tests/**"
      - "scripts/theme-expansion-qa.ts"
      - "web/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/theme-expansion-qualification.yml"
      - "server/pipeline/themes.ts"
      - "server/pipeline/types.ts"
      - "themes/**"
      - "tests/**"
      - "scripts/theme-expansion-qa.ts"
      - "web/**"

permissions:
  contents: read

concurrency:
  group: folio-30-themes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch protected baseline
        shell: pwsh
        run: git fetch origin main --depth=1

      - name: Prove compositor and rendering engines are untouched
        shell: pwsh
        run: |
          $protected = @(
            "server/pipeline/compositor.ts",
            "web/src/compositor.ts",
            "server/pipeline/hyphenation.ts",
            "web/src/hyphenation.ts",
            "server/pipeline/dropcap.ts",
            "server/pipeline/render-pdf.ts",
            "server/pipeline/render-print.ts",
            "themes/base.css",
            "themes/print-base.css"
          )
          $changed = @(git diff --name-only origin/main...HEAD -- $protected)
          if ($changed.Count -gt 0) {
            $changed | ForEach-Object { Write-Host "PROTECTED FILE CHANGED: $_" }
            throw "Theme expansion is not allowed to modify compositor/rendering-engine files."
          }
          Write-Host "Protected compositor/rendering files are byte-for-byte inherited from main."

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install bundled theme fonts
        run: npm run fonts

      - name: Install pinned Chromium
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "pandoc.exe missing" }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Typecheck
        run: npm run typecheck

      - name: Full existing formatter and UI regression suite
        run: npm test

      - name: Build production web and server
        run: npm run build

      - name: Qualify all 17 new themes in print PDF reading PDF and EPUB
        run: node --import tsx scripts/theme-expansion-qa.ts

      - name: Re-run established Print PDF physical overflow gate
        run: node --import tsx scripts/print-matrix-qa.ts

      - name: Upload 30-theme proof gallery and reports
        uses: actions/upload-artifact@v4
        with:
          name: Folio-30-theme-proof
          path: |
            build/qa-theme-expansion/*.png
            build/qa-theme-expansion/report.json
            build/qa-print-matrix/report.json
          if-no-files-found: error
          retention-days: 7
