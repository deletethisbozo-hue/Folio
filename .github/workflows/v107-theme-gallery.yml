name: Folio 1.0.7 theme gallery

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-theme-gallery.yml"
      - "scripts/v107-theme-gallery.ts"
      - "server/**"
      - "web/**"
      - "themes/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-v107-theme-gallery
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - run: npm run build
      - name: Render all 30 themes
        run: node --import tsx scripts/v107-theme-gallery.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Folio-1.0.7-theme-gallery
          path: build/qa-v107/theme-gallery/**
          if-no-files-found: error
