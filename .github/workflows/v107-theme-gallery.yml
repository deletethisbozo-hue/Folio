name: Folio 1.0.7 theme gallery

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-theme-gallery.yml"
      - "scripts/v107-theme-contact-sheet.ts"
      - "server/**"
      - "web/**"
      - "themes/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-v107-theme-gallery
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx puppeteer browsers install chrome-headless-shell
      - run: npm run fonts
      - name: Render all 30 themes fast
        run: node --import tsx scripts/v107-theme-contact-sheet.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Folio-1.0.7-theme-contact-sheet
          path: build/qa-v107/theme-contact-sheet/**
          if-no-files-found: error
