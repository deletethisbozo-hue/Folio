name: Folio v1.0.7 one-shot preview patch

on:
  push:
    branches:
      - fix/v1.0.7
    paths:
      - .github/workflows/v107-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-v107-late-preview-fix.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx tests/ui-runtime.test.ts
          git diff --cached --check
          git commit -m "Stabilize late authoritative preview composition"
          git push origin HEAD:fix/v1.0.7
