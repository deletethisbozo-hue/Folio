name: Folio 1.0.9 gap-floor sweep

on:
  push:
    branches:
      - fix/v1.0.9-remove-black-psalter

permissions:
  contents: write

jobs:
  windows-qa:
    if: github.event.head_commit.message != 'Qualify visible word-gap floor for Folio 1.0.9'
    runs-on: windows-2025
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.9-remove-black-psalter
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip" -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable was not found." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install pinned Chromium runtime
        shell: pwsh
        run: |
          npx puppeteer browsers install chrome-headless-shell
          $chrome = Get-ChildItem build\puppeteer-cache -Filter chrome-headless-shell.exe -Recurse | Where-Object { $_.FullName -match "152\.0\.7977\.75" } | Select-Object -First 1
          if (-not $chrome) { throw "Pinned Chrome Headless Shell was not installed." }

      - name: Typecheck baseline
        run: npm run typecheck

      - name: Find highest Windows-safe visible word-gap floor
        shell: pwsh
        run: |
          $base = '  const minimumRenderedGapEm = emergency || finalCompression ? 0.13 : 0.14;'
          $candidates = @(
            @{ strict = '0.125'; rescue = '0.115' },
            @{ strict = '0.120'; rescue = '0.110' },
            @{ strict = '0.115'; rescue = '0.105' },
            @{ strict = '0.110'; rescue = '0.100' },
            @{ strict = '0.105'; rescue = '0.095' },
            @{ strict = '0.100'; rescue = '0.090' }
          )
          $best = $null
          New-Item -ItemType Directory -Force build\gap-sweep | Out-Null
          foreach ($candidate in $candidates) {
            git checkout -- web/src/compositor.ts
            $text = Get-Content web/src/compositor.ts -Raw
            if (-not $text.Contains($base)) { throw 'Baseline rendered-gap floor was not found.' }
            $replacement = "  const minimumRenderedGapEm = emergency || finalCompression ? $($candidate.rescue) : $($candidate.strict);"
            [IO.File]::WriteAllText((Resolve-Path web/src/compositor.ts), $text.Replace($base, $replacement), [Text.UTF8Encoding]::new($false))
            npm run build:web *> "build\gap-sweep\build-$($candidate.strict).log"
            if ($LASTEXITCODE -ne 0) { throw "build:web failed for strict floor $($candidate.strict)" }
            node --import tsx scripts/v107-visual-qa.ts *> "build\gap-sweep\qa-$($candidate.strict).log"
            if ($LASTEXITCODE -eq 0) {
              $best = $candidate
              Write-Host "PASS strict=$($candidate.strict) rescue=$($candidate.rescue)"
              break
            }
            Write-Host "FAIL strict=$($candidate.strict) rescue=$($candidate.rescue)"
          }
          if (-not $best) {
            Get-Content build\gap-sweep\qa-*.log | Select-Object -Last 120
            throw 'No candidate rendered-gap floor passed visual/typesetting QA.'
          }
          git checkout -- web/src/compositor.ts
          $text = Get-Content web/src/compositor.ts -Raw
          $replacement = "  const minimumRenderedGapEm = emergency || finalCompression ? $($best.rescue) : $($best.strict);"
          [IO.File]::WriteAllText((Resolve-Path web/src/compositor.ts), $text.Replace($base, $replacement), [Text.UTF8Encoding]::new($false))
          "BEST_STRICT=$($best.strict)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BEST_RESCUE=$($best.rescue)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Full formatter and UI suite with selected floor
        run: npm test

      - name: Build web and server
        run: npm run build

      - name: Final Windows visual and typesetting QA
        run: node --import tsx scripts/v107-visual-qa.ts

      - name: Verify selected candidate cleanliness
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          $diff = git diff -- web/src/compositor.ts
          if (-not ($diff | Select-String -SimpleMatch "minimumRenderedGapEm")) { throw "Rendered-gap floor correction missing from compositor diff." }
          Write-Host "Selected strict=$env:BEST_STRICT rescue=$env:BEST_RESCUE"

      - name: Commit qualified compositor correction
        shell: pwsh
        run: |
          git config user.name "Folio Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/compositor.ts
          if (git diff --cached --quiet) { throw "Compositor correction produced no staged changes." }
          git commit -m "Qualify visible word-gap floor for Folio 1.0.9"
          git push origin HEAD:fix/v1.0.9-remove-black-psalter
