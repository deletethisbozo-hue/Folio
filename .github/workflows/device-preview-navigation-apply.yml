name: Apply grouped device previews and editor navigation

on:
  push:
    branches: ["fix/preview-connection-recovery"]
    paths:
      - ".github/workflows/device-preview-navigation-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preview-connection-recovery
          fetch-depth: 0
      - name: Apply focused source patch
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one block in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          device_profiles = r'''export type PreviewFamily = "kindle" | "kobo" | "phone" | "tablet" | "print";

          export type PreviewMode =
            | "kindle-6"
            | "kindle-6-8"
            | "kindle-7"
            | "kobo-6"
            | "kobo-7"
            | "kobo-8"
            | "phone-6-1"
            | "phone-6-7"
            | "tablet-8"
            | "tablet-11"
            | "tablet-13"
            | "print";

          export type PreviewProfile = {
            value: PreviewMode;
            label: string;
            family: PreviewFamily;
            viewport: { width: number; height: number };
            baseFont: number;
            padding: [number, number, number, number];
            wordsPerPage: number;
            shellMaxWidth: number;
          };

          const profiles: PreviewProfile[] = [
            { value: "kindle-6", label: 'Kindle 6"', family: "kindle", viewport: { width: 400, height: 540 }, baseFont: 17.3, padding: [34, 16, 46, 16], wordsPerPage: 265, shellMaxWidth: 450 },
            { value: "kindle-6-8", label: 'Kindle 6.8"', family: "kindle", viewport: { width: 412, height: 549 }, baseFont: 17.5, padding: [34, 16, 46, 16], wordsPerPage: 270, shellMaxWidth: 475 },
            { value: "kindle-7", label: 'Kindle 7"', family: "kindle", viewport: { width: 421, height: 560 }, baseFont: 17.7, padding: [34, 20, 46, 20], wordsPerPage: 280, shellMaxWidth: 490 },
            { value: "kobo-6", label: 'Kobo 6"', family: "kobo", viewport: { width: 400, height: 540 }, baseFont: 17.3, padding: [32, 18, 44, 18], wordsPerPage: 265, shellMaxWidth: 450 },
            { value: "kobo-7", label: 'Kobo 7"', family: "kobo", viewport: { width: 421, height: 560 }, baseFont: 17.8, padding: [32, 24, 46, 24], wordsPerPage: 282, shellMaxWidth: 490 },
            { value: "kobo-8", label: 'Kobo 8"', family: "kobo", viewport: { width: 450, height: 600 }, baseFont: 18, padding: [38, 30, 52, 30], wordsPerPage: 320, shellMaxWidth: 520 },
            { value: "phone-6-1", label: 'Phone 6.1"', family: "phone", viewport: { width: 390, height: 844 }, baseFont: 18, padding: [38, 25, 58, 25], wordsPerPage: 245, shellMaxWidth: 315 },
            { value: "phone-6-7", label: 'Phone 6.7"', family: "phone", viewport: { width: 430, height: 932 }, baseFont: 18, padding: [42, 28, 64, 28], wordsPerPage: 285, shellMaxWidth: 340 },
            { value: "tablet-8", label: 'Tablet 8"', family: "tablet", viewport: { width: 744, height: 1133 }, baseFont: 18.5, padding: [52, 56, 72, 56], wordsPerPage: 390, shellMaxWidth: 470 },
            { value: "tablet-11", label: 'Tablet 11"', family: "tablet", viewport: { width: 820, height: 1180 }, baseFont: 19, padding: [62, 68, 82, 68], wordsPerPage: 455, shellMaxWidth: 520 },
            { value: "tablet-13", label: 'Tablet 13"', family: "tablet", viewport: { width: 1032, height: 1376 }, baseFont: 20, padding: [72, 84, 96, 84], wordsPerPage: 580, shellMaxWidth: 560 },
            { value: "print", label: "Print · Pages", family: "print", viewport: { width: 576, height: 864 }, baseFont: 16, padding: [0, 0, 0, 0], wordsPerPage: 0, shellMaxWidth: 480 },
          ];

          export const previewProfiles = profiles;

          export const previewProfileGroups: Array<{ label: string; profiles: PreviewProfile[] }> = [
            { label: "Kindle", profiles: profiles.filter((profile) => profile.family === "kindle") },
            { label: "Kobo", profiles: profiles.filter((profile) => profile.family === "kobo") },
            { label: "Phone", profiles: profiles.filter((profile) => profile.family === "phone") },
            { label: "Tablet", profiles: profiles.filter((profile) => profile.family === "tablet") },
            { label: "Print", profiles: profiles.filter((profile) => profile.family === "print") },
          ];

          export function getPreviewProfile(value: string): PreviewProfile | undefined {
            return profiles.find((profile) => profile.value === value);
          }
          '''
          Path("web/src/device-profiles.ts").write_text(device_profiles.replace("          ", ""), encoding="utf-8")

          replace_exact(
              "web/src/App.tsx",
              'import { calibratePreviewFrame, updatePreviewPageCounts } from "./preview-runtime";\nimport { SerialSaveQueue } from "./save-queue";',
              'import { calibratePreviewFrame, updatePreviewPageCounts } from "./preview-runtime";\nimport { getPreviewProfile, previewProfileGroups, previewProfiles, type PreviewMode } from "./device-profiles";\nimport { SerialSaveQueue } from "./save-queue";',
          )
          replace_exact(
              "web/src/App.tsx",
              'type PreviewMode = "kindle-paperwhite" | "kindle-oasis" | "ipad" | "iphone" | "android" | "print";\n',
              '',
          )
          replace_exact(
              "web/src/App.tsx",
              '''const previewProfiles: Array<{ value: PreviewMode; label: string }> = [
  { value: "kindle-paperwhite", label: "Paperwhite · Standard" },
  { value: "kindle-oasis", label: "Oasis · Standard" },
  { value: "ipad", label: "iPad · Standard" },
  { value: "iphone", label: "iPhone · Standard" },
  { value: "android", label: "Android · Standard" },
  { value: "print", label: "Print · Pages" },
];
''',
              '',
          )
          replace_exact(
              "web/src/App.tsx",
              'const [previewMode, setPreviewMode] = useState<PreviewMode>("kindle-paperwhite");',
              'const [previewMode, setPreviewMode] = useState<PreviewMode>("kindle-6-8");',
          )
          replace_exact(
              "web/src/App.tsx",
              '  const fastPreviewComposeTimerRef = useRef<number | null>(null);\n',
              '''  const fastPreviewComposeTimerRef = useRef<number | null>(null);
  const pendingPreviewWordRef = useRef<{ ordinal: number } | null>(null);
  const previewHighlightTimerRef = useRef<number | null>(null);
''',
          )
          replace_exact(
              "web/src/App.tsx",
              '    pendingPreviewScrollRef.current = 0;\n    setPreviewError(null);',
              '''    pendingPreviewScrollRef.current = 0;
    pendingPreviewWordRef.current = null;
    if (previewHighlightTimerRef.current !== null) {
      window.clearTimeout(previewHighlightTimerRef.current);
      previewHighlightTimerRef.current = null;
    }
    setPreviewError(null);''',
          )
          replace_exact(
              "web/src/App.tsx",
              '  const selectedSection = project?.sections.find((s) => s.id === selectedId) ?? null;\n  const chapterIndex = selectedSection?.kind === "chapter" ? chapters.findIndex((s) => s.id === selectedSection.id) + 1 : null;',
              '  const selectedSection = project?.sections.find((s) => s.id === selectedId) ?? null;\n  const previewProfile = getPreviewProfile(previewMode);\n  const chapterIndex = selectedSection?.kind === "chapter" ? chapters.findIndex((s) => s.id === selectedSection.id) + 1 : null;',
          )

          marker = '  function syncLiveChapterLabel(doc: Document) {'
          helper = r'''  function lexicalWordMatches(value: string): RegExpMatchArray[] {
    return Array.from(value.matchAll(/[\p{L}\p{N}]+(?:[’'][\p{L}\p{N}]+)*/gu));
  }

  function editorCaretWordOrdinal(): number | null {
    const editor = editorRef.current;
    const selection = window.getSelection();
    if (!editor || !selection?.focusNode || !editor.contains(selection.focusNode)) return null;
    const before = window.document.createRange();
    before.selectNodeContents(editor);
    try { before.setEnd(selection.focusNode, selection.focusOffset); }
    catch { return null; }
    const text = before.toString().replace(/\u00ad/g, "");
    const matches = lexicalWordMatches(text);
    const previousEndsAtCaret = matches.length > 0
      && (matches.at(-1)?.index ?? -1) + (matches.at(-1)?.[0].length ?? 0) === text.length;
    if (previousEndsAtCaret) return matches.length - 1;

    const focus = selection.focusNode;
    const next = focus.nodeType === Node.TEXT_NODE
      ? (focus as Text).data.slice(selection.focusOffset, selection.focusOffset + 1)
      : "";
    if (/[\p{L}\p{N}]/u.test(next)) return matches.length;
    return matches.length ? matches.length - 1 : null;
  }

  function mappedRangesForText(block: HTMLElement): Range[] {
    const doc = block.ownerDocument;
    const walker = doc.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        return parent && !parent.closest("script,style,.scene-break") ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      },
    });
    const mapping: Array<{ node: Text; offset: number }> = [];
    let text = "";
    while (walker.nextNode()) {
      const node = walker.currentNode as Text;
      for (let index = 0; index < node.data.length; index++) {
        const char = node.data[index];
        if (char === "\u00ad" || char === "\u200b" || char === "\ufeff") continue;
        text += char;
        mapping.push({ node, offset: index });
      }
    }
    const ranges: Range[] = [];
    for (const match of lexicalWordMatches(text)) {
      const start = match.index ?? 0;
      const end = start + match[0].length;
      const first = mapping[start];
      const last = mapping[end - 1];
      if (!first || !last) continue;
      const range = doc.createRange();
      range.setStart(first.node, first.offset);
      range.setEnd(last.node, last.offset + 1);
      ranges.push(range);
    }
    return ranges;
  }

  function composedRangesForText(block: HTMLElement): Range[] {
    const doc = block.ownerDocument;
    const tokens = Array.from(block.querySelectorAll<HTMLElement>(".folio-word"));
    if (!tokens.length) return mappedRangesForText(block);
    const groups: HTMLElement[][] = [];
    let group: HTMLElement[] = [];
    for (const token of tokens) {
      if (group.length && token.dataset.folioSpaceBefore === "true") {
        groups.push(group);
        group = [];
      }
      group.push(token);
    }
    if (group.length) groups.push(group);

    const ranges: Range[] = [];
    const cap = block.querySelector<HTMLElement>(":scope > .dropcap.folio-composed-cap");
    for (const [groupIndex, tokenGroup] of groups.entries()) {
      const mapping: Array<{ node: Text; offset: number }> = [];
      let text = "";
      for (const token of tokenGroup) {
        const walker = doc.createTreeWalker(token, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
          const node = walker.currentNode as Text;
          for (let index = 0; index < node.data.length; index++) {
            const char = node.data[index];
            if (char === "\u00ad" || char === "\u200b" || char === "\ufeff") continue;
            text += char;
            mapping.push({ node, offset: index });
          }
        }
      }
      const matches = lexicalWordMatches(text);
      for (const [matchIndex, match] of matches.entries()) {
        const start = match.index ?? 0;
        const end = start + match[0].length;
        const first = mapping[start];
        const last = mapping[end - 1];
        if (!first || !last) continue;
        if (groupIndex === 0 && matchIndex === 0 && cap?.firstChild?.nodeType === Node.TEXT_NODE) {
          const capText = cap.firstChild as Text;
          if (/[\p{L}\p{N}]/u.test(capText.data)) {
            const capRange = doc.createRange();
            capRange.selectNodeContents(cap);
            ranges.push(capRange);
          }
        }
        const range = doc.createRange();
        range.setStart(first.node, first.offset);
        range.setEnd(last.node, last.offset + 1);
        ranges.push(range);
      }
    }
    return ranges;
  }

  function previewRangeAtWord(ordinal: number): Range[] | null {
    const doc = previewRef.current?.contentDocument;
    if (!doc || !selectedId || ordinal < 0) return null;
    const section = doc.getElementById(selectedId)
      ?? doc.querySelector<HTMLElement>("main.book > section.level1, main.book > section.chapter, main.book > section.backmatter");
    if (!section) return null;
    const blocks = Array.from(section.querySelectorAll<HTMLElement>("p:not(.scene-break),li,h2,h3,h4,h5,h6"))
      .filter((block) => !block.closest(".chapter-subtitle,.scene-break") && !(block.tagName === "P" && block.closest("li")));
    let cursor = ordinal;
    for (const block of blocks) {
      const ranges = block.classList.contains("folio-composed") || block.querySelector(".folio-word")
        ? composedRangesForText(block)
        : mappedRangesForText(block);
      if (cursor < ranges.length) return [ranges[cursor]];
      cursor -= ranges.length;
    }
    return null;
  }

  function clearPreviewHighlight(doc?: Document | null) {
    const view = doc?.defaultView as (Window & { Highlight?: new (...ranges: Range[]) => unknown }) | null;
    const registry = (view?.CSS as unknown as { highlights?: { delete(name: string): boolean } } | undefined)?.highlights;
    registry?.delete("folio-editor-word");
  }

  function highlightPreviewWord(target: { ordinal: number }, retry = false): boolean {
    const frame = previewRef.current;
    const doc = frame?.contentDocument;
    const ranges = doc ? previewRangeAtWord(target.ordinal) : null;
    if (!frame || !doc?.head || !ranges?.length) return false;
    const view = doc.defaultView as (Window & { Highlight?: new (...ranges: Range[]) => unknown }) | null;
    const registry = (view?.CSS as unknown as { highlights?: { set(name: string, value: unknown): void; delete(name: string): boolean } } | undefined)?.highlights;
    const HighlightCtor = view?.Highlight;
    if (!registry || !HighlightCtor) return false;

    let style = doc.getElementById("folio-editor-word-highlight") as HTMLStyleElement | null;
    if (!style) {
      style = doc.createElement("style");
      style.id = "folio-editor-word-highlight";
      style.textContent = "::highlight(folio-editor-word){background:rgba(208,162,74,.62);text-decoration:underline rgba(112,76,25,.55) 1px}";
      doc.head.appendChild(style);
    }
    registry.delete("folio-editor-word");
    registry.set("folio-editor-word", new HighlightCtor(...ranges));

    const range = ranges[0];
    const anchor = range.startContainer.nodeType === Node.TEXT_NODE
      ? range.startContainer.parentElement
      : range.startContainer as HTMLElement;
    anchor?.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });

    if (previewHighlightTimerRef.current !== null) window.clearTimeout(previewHighlightTimerRef.current);
    previewHighlightTimerRef.current = window.setTimeout(() => {
      clearPreviewHighlight(previewRef.current?.contentDocument);
      if (pendingPreviewWordRef.current?.ordinal === target.ordinal) pendingPreviewWordRef.current = null;
      previewHighlightTimerRef.current = null;
    }, 1050);

    if (!retry && previewMode !== "print") {
      window.setTimeout(() => {
        if (pendingPreviewWordRef.current?.ordinal === target.ordinal) highlightPreviewWord(target, true);
      }, 220);
    }
    return true;
  }

  function syncEditorClickToPreview() {
    const ordinal = editorCaretWordOrdinal();
    if (ordinal === null) return;
    const target = { ordinal };
    pendingPreviewWordRef.current = target;
    highlightPreviewWord(target);
  }

'''
          replace_exact("web/src/App.tsx", marker, helper + marker)

          replace_exact(
              "web/src/App.tsx",
              '''    requestAnimationFrame(() => {
      doc.scrollingElement?.scrollTo(0, targetScroll);
      updatePreviewPageCounts(frame);
    });
  }
''',
              '''    requestAnimationFrame(() => {
      doc.scrollingElement?.scrollTo(0, targetScroll);
      updatePreviewPageCounts(frame);
      const pendingWord = pendingPreviewWordRef.current;
      if (pendingWord) window.setTimeout(() => highlightPreviewWord(pendingWord), 70);
    });
  }
''',
          )
          replace_exact(
              "web/src/App.tsx",
              '''  function editorClick(event: React.MouseEvent<HTMLDivElement>) {
    const remove = (event.target as HTMLElement).closest(".editor-scene-break-remove");
    if (!remove) return;
    event.preventDefault();
    remove.closest(".editor-scene-break")?.remove();
    recordEditorDom();
  }
''',
              '''  function editorClick(event: React.MouseEvent<HTMLDivElement>) {
    const remove = (event.target as HTMLElement).closest(".editor-scene-break-remove");
    if (remove) {
      event.preventDefault();
      remove.closest(".editor-scene-break")?.remove();
      recordEditorDom();
      return;
    }
    window.requestAnimationFrame(syncEditorClickToPreview);
  }
''',
          )
          replace_exact(
              "web/src/App.tsx",
              '''<select aria-label="Preview device" value={previewMode} onChange={(e) => setPreviewMode(e.target.value as PreviewMode)}>{previewProfiles.map((profile) => <option key={profile.value} value={profile.value}>{profile.label}</option>)}</select>''',
              '''<select aria-label="Preview device" value={previewMode} onChange={(e) => setPreviewMode(e.target.value as PreviewMode)}>{previewProfileGroups.map((group) => <optgroup key={group.label} label={group.label}>{group.profiles.map((profile) => <option key={profile.value} value={profile.value}>{profile.label}</option>)}</optgroup>)}</select>''',
          )
          replace_exact(
              "web/src/App.tsx",
              '''<div ref={previewStageRef} className={`preview-stage ${previewMode === "print" ? "print-stage" : "device-stage"}`}><div className={"reader-device device-" + previewMode}><div className="reader-screen">''',
              '''<div ref={previewStageRef} className={`preview-stage ${previewMode === "print" ? "print-stage" : "device-stage"}`}><div className={"reader-device device-" + previewMode} data-device-family={previewProfile?.family ?? "kindle"} style={previewMode === "print" || !previewProfile ? undefined : ({ "--folio-device-aspect": String(previewProfile.viewport.width / previewProfile.viewport.height), "--folio-device-max-width": `${previewProfile.shellMaxWidth}px` } as React.CSSProperties)}><div className="reader-screen">''',
          )

          # preview-runtime: one source of truth for every reflow profile.
          p = Path("web/src/preview-runtime.ts")
          runtime = p.read_text(encoding="utf-8")
          runtime = runtime.replace('import { composePreviewDocument } from "./compositor";\n', 'import { composePreviewDocument } from "./compositor";\nimport { getPreviewProfile } from "./device-profiles";\n')
          start = runtime.index('type ReflowProfile = {')
          end = runtime.index('\n\nfunction countWords', start)
          runtime = runtime[:start] + runtime[end+2:]
          runtime = runtime.replace('  const profile = PROFILES[mode()];\n  const doc = frame.contentDocument;\n  if (!profile || !doc?.head || !frame.clientWidth) return false;\n\n  const scale = frame.clientWidth / profile.width;\n  const [top, right, bottom, left] = profile.padding.map((value) => Math.max(1, value * scale)) as [number, number, number, number];', '  const profile = getPreviewProfile(mode());\n  const doc = frame.contentDocument;\n  if (!profile || profile.family === "print" || !doc?.head || !frame.clientWidth) return false;\n\n  const scale = frame.clientWidth / profile.viewport.width;\n  const [top, right, bottom, left] = profile.padding.map((value) => Math.max(1, value * scale)) as [number, number, number, number];')
          runtime = runtime.replace('  const profile = PROFILES[currentMode];\n  if (!profile || frame.clientHeight <= 0) return;', '  const profile = getPreviewProfile(currentMode);\n  if (!profile || profile.family === "print" || frame.clientHeight <= 0) return;')
          p.write_text(runtime, encoding="utf-8")

          # Device shells scale by screen class instead of pretending to be one named model.
          css = Path("web/src/index.css")
          text = css.read_text(encoding="utf-8")
          old = '''.reader-device {
  flex:none; width: min(95%, 480px, calc((100dvh - 112px) * .72)); max-height:100%; aspect-ratio: 0.72; padding: 25px 21px 27px; margin: auto; border-radius: 14px; background: linear-gradient(145deg, #222, #171717 58%, #292929);
  border: 1px solid #50504f; box-shadow: 0 4px 7px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.16), inset 0 -1px 2px rgba(0,0,0,.7);
}
.reader-device.device-kindle-oasis { width:min(96%,510px,calc((100dvh - 112px) * .78)); aspect-ratio:.78; padding:22px 42px 24px 18px; border-radius:10px; background:linear-gradient(135deg,#2c2c2c,#151515); }
.reader-device.device-ipad { width:min(96%,520px,calc((100dvh - 112px) * .74)); aspect-ratio:.74; padding:23px; border-radius:22px; background:linear-gradient(145deg,#c7c8c8,#909292); border-color:#858686; }
.reader-device.device-iphone { width:min(82%,335px,calc((100dvh - 112px) * .49)); aspect-ratio:.49; padding:25px 12px 27px; border-radius:34px; background:#171717; }
.reader-device.device-android { width:min(84%,350px,calc((100dvh - 112px) * .51)); aspect-ratio:.51; padding:19px 11px 22px; border-radius:26px; background:linear-gradient(145deg,#313438,#141517); }
.reader-device.device-print { width:min(95%,480px); aspect-ratio:.667; padding:13px; border-radius:3px; background:#b8b8b5; }
'''
          new = '''.reader-device {
  flex:none; width:min(95%,var(--folio-device-max-width,480px),calc((100dvh - 112px) * var(--folio-device-aspect,.72))); max-height:100%; aspect-ratio:var(--folio-device-aspect,.72); padding:25px 21px 27px; margin:auto; border-radius:14px; background:linear-gradient(145deg,#222,#171717 58%,#292929);
  border:1px solid #50504f; box-shadow:0 4px 7px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.16),inset 0 -1px 2px rgba(0,0,0,.7);
}
.reader-device[data-device-family="kobo"] { padding:20px 18px 23px; border-radius:9px; background:linear-gradient(145deg,#30302f,#181817 62%,#252524); }
.reader-device[data-device-family="phone"] { width:min(84%,var(--folio-device-max-width,340px),calc((100dvh - 112px) * var(--folio-device-aspect,.48))); padding:23px 11px 26px; border-radius:32px; background:linear-gradient(145deg,#25282b,#111214); }
.reader-device[data-device-family="tablet"] { width:min(96%,var(--folio-device-max-width,520px),calc((100dvh - 112px) * var(--folio-device-aspect,.72))); padding:23px; border-radius:22px; background:linear-gradient(145deg,#c7c8c8,#909292); border-color:#858686; }
.reader-device.device-print { width:min(95%,480px); aspect-ratio:.667; padding:13px; border-radius:3px; background:#b8b8b5; }
'''
          if old not in text:
              raise SystemExit("reader-device CSS block not found")
          text = text.replace(old, new)
          text = text.replace('.device-ipad .reader-screen,.device-iphone .reader-screen,.device-android .reader-screen { background:#fff; }\n.device-iphone .reader-screen { border-radius:16px; }\n.device-android .reader-screen { border-radius:11px; }', '.reader-device[data-device-family="tablet"] .reader-screen,.reader-device[data-device-family="phone"] .reader-screen { background:#fff; }\n.reader-device[data-device-family="phone"] .reader-screen { border-radius:14px; }')
          text = text.replace('  .reader-device { width: min(95%, 430px, calc((100dvh - 112px) * .72)); }', '  .reader-device { width:min(95%,var(--folio-device-max-width,430px),calc((100dvh - 112px) * var(--folio-device-aspect,.72))); }')
          css.write_text(text, encoding="utf-8")

          # Browser coverage: grouped profiles, real size switch, and editor -> preview word navigation.
          test = Path("tests/ui-runtime.test.ts")
          text = test.read_text(encoding="utf-8")
          anchor = '  check("typing updates the visible device preview before autosave", true);\n'
          insertion = r'''  check("typing updates the visible device preview before autosave", true);

          const previewGroups = await page.$$eval('select[aria-label="Preview device"] optgroup', (groups) => groups.map((group) => ({ label: group.label, values: [...group.querySelectorAll("option")].map((option) => option.value) })));
          check("preview devices are grouped by Kindle, Kobo, phone, tablet and print size classes",
            ["Kindle", "Kobo", "Phone", "Tablet", "Print"].every((label) => previewGroups.some((group) => group.label === label))
            && previewGroups.some((group) => group.values.includes("kindle-6") && group.values.includes("kindle-6-8") && group.values.includes("kindle-7"))
            && previewGroups.some((group) => group.values.includes("kobo-6") && group.values.includes("kobo-7") && group.values.includes("kobo-8")));

          await page.evaluate(() => {
            const editor = document.querySelector(".rich-editor") as HTMLElement;
            const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
            let node: Text | null = null;
            while (walker.nextNode()) {
              const candidate = walker.currentNode as Text;
              if (candidate.data.includes("BROWSER")) { node = candidate; break; }
            }
            if (!node) throw new Error("BROWSER marker was not found in editor");
            const index = node.data.indexOf("BROWSER") + 2;
            const range = document.createRange();
            range.setStart(node, index); range.collapse(true);
            const selection = window.getSelection();
            selection?.removeAllRanges(); selection?.addRange(range);
            (node.parentElement ?? editor).dispatchEvent(new MouseEvent("click", { bubbles: true }));
          });
          await stage("editor click follows word in preview", () => page.waitForFunction(() => {
            const frame = document.querySelector("iframe") as HTMLIFrameElement | null;
            const registry = (frame?.contentWindow as any)?.CSS?.highlights;
            const highlight = registry?.get("folio-editor-word");
            if (!highlight) return false;
            return [...highlight].some((range: Range) => range.toString().replace(/\u00ad/g, "").includes("BROWSER"));
          }));
