name: Prepare Folio 2.0.7 metadata

on:
  push:
    branches: [fix/v2.0.7-cover-button-image-title]
    paths:
      - .github/workflows/prepare-v207.yml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.7-cover-button-image-title
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Sync package-lock to 2.0.7
        run: npm version 2.0.7 --no-git-tag-version --allow-same-version
      - name: Commit lockfile update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Version metadata already synchronized."
            exit 0
          fi
          git commit -m "Sync package lock for 2.0.7"
          git push origin HEAD:fix/v2.0.7-cover-button-image-title
