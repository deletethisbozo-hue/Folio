name: Folio 2.0 qualification

# Full branch qualification gate for the 2.0 development line.
on:
  workflow_dispatch:
  push:
    branches: ["release/v2.0.0"]
    paths:
      - ".github/workflows/v2-suite.yml"
      - "web/**"
      - "server/**"
      - "tests/**"
      - "themes/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - "server/**"
      - "tests/**"
      - "themes/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: folio-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-lock:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.repair.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - id: repair
        name: Synchronize package-lock release version
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "deletethisbozo-hue"
          git config user.email "deletethisbozo@gmail.com"
          git add package-lock.json
          git commit -m "Synchronize Folio 2.0 package lock"
          git push origin HEAD:release/v2.0.0
          echo "changed=true" >> "$GITHUB_OUTPUT"

  qualify:
    needs: repair-lock
    if: always() && (github.event_name != 'push' || needs.repair-lock.outputs.changed != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Verify package version consistency
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!==l.version||p.version!==l.packages[''].version) throw new Error('package.json/package-lock.json version mismatch')"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
          "$PANDOC_BIN" --version | head -n 1
      - name: Typecheck
        run: npm run typecheck
      - name: Full formatter and UI suite
        run: npm test
      - name: Build web and server
        run: npm run build
