name: Folio 3.x qualification

# Full branch qualification gate for the active Folio 3.x development line.
on:
  workflow_dispatch:
  push:
    branches: ["release/v2.0.0", "release/v2.0.1"]
    paths:
      - ".github/workflows/v2-suite.yml"
      - ".github/workflows/v2-windows-qualification.yml"
      - "web/**"
      - "server/**"
      - "tests/**"
      - "themes/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/v2-suite.yml"
      - ".github/workflows/v2-windows-qualification.yml"
      - "web/**"
      - "server/**"
      - "tests/**"
      - "themes/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: folio-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Verify package version consistency
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!==l.version||p.version!==l.packages[''].version) throw new Error('package.json/package-lock.json version mismatch')"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium runtime
        shell: bash
        run: |
          npx puppeteer browsers install chrome-headless-shell
          chrome=$(find "$PUPPETEER_CACHE_DIR" -type f -path '*156.0.8078.47*' -name chrome-headless-shell -print -quit)
          test -n "$chrome"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
          "$PANDOC_BIN" --version | head -n 1
      - name: Install checksum-pinned offline EPUBCheck runtime
        run: npm run setup:publishing

      - name: Typecheck
        run: npm run typecheck
      - name: Build web and server
        run: npm run build
      - name: Writing Studio interaction and screenshot QA
        run: node --import tsx scripts/v210-writing-studio-preview.ts
      - name: Folio 3.0 Second Draft interaction and screenshot QA
        run: node --import tsx scripts/v300-second-draft-preview.ts

      - name: Upload Halo QA screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Folio-Halo-QA
          path: |
            build/qa-v210-writing-studio/03ac-progress-halo-popover-light.png
            build/qa-v210-writing-studio/03ad-progress-halo-light.png
            build/qa-v210-writing-studio/03de-progress-halo-midnight.png
          if-no-files-found: error
      - name: Focused Writing Studio responsiveness and interaction gate
        run: node --import tsx tests/write-studio-ui.test.ts

      - name: Full formatter and UI suite
        run: npm test
