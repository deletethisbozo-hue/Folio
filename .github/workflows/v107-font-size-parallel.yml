name: v1.0.7 parallel body-size probe

on:
  push:
    branches: [fix/v1.0.7]
    paths:
      - '.github/workflows/v107-font-size-parallel.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        size: ['1.02', '0.98', '0.96', '0.94', '0.92']
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/build/puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}/build/pandoc/bin/pandoc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned Pandoc 3.11
        shell: bash
        run: |
          mkdir -p build/pandoc
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz" -o build/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  build/pandoc-3.11-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf build/pandoc-3.11-linux-amd64.tar.gz -C build/pandoc --strip-components=1
      - run: npx puppeteer browsers install chrome-headless-shell
      - name: Apply checkout-only typography probe
        shell: python
        env:
          PROBE_SIZE: ${{ matrix.size }}
        run: |
          from pathlib import Path
          import os
          size = os.environ['PROBE_SIZE']
          q = Path('scripts/v107-theme-matrix.ts')
          t = q.read_text(encoding='utf-8')
          old = '  const themes = themeList();\n  if (themes.length !== 30) throw new Error(`Expected exactly 30 release themes, found ${themes.length}`);\n'
          new = '  const probeNames = new Set(["modern", "decorative", "editorial", "cloister"]);\n  const themes = themeList().filter((theme) => probeNames.has(theme.name));\n  if (themes.length !== 4) throw new Error(`Expected exactly 4 probe themes, found ${themes.length}`);\n'
          if t.count(old) != 1:
              raise SystemExit('matrix selector changed unexpectedly')
          q.write_text(t.replace(old, new, 1), encoding='utf-8')
          for theme in ('decorative', 'editorial', 'cloister'):
              p = Path(f'themes/{theme}/theme.css')
              s = p.read_text(encoding='utf-8')
              p.write_text(s + f'\n/* checkout-only body-size probe */\nbody {{ font-size: {size}rem; }}\n', encoding='utf-8')
      - run: npm run build
      - name: Run 12-case targeted matrix
        id: matrix
        continue-on-error: true
        run: node --import tsx scripts/v107-theme-matrix.ts
      - name: Summarize
        if: always()
        shell: python
        env:
          PROBE_SIZE: ${{ matrix.size }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          import json, os
          from pathlib import Path
          src = Path('build/qa-v107/theme-matrix.json')
          if not src.exists():
              raise SystemExit('theme-matrix.json missing')
          d = json.loads(src.read_text(encoding='utf-8'))
          out = {
              'size': os.environ['PROBE_SIZE'],
              'matrix': os.environ['MATRIX_OUTCOME'],
              'passed': d['passed'],
              'failed': d['failed'],
              'results': [
                  {'theme': r['theme'], 'scenario': r['scenario'], 'pass': r['pass'], 'failures': r['failures'], 'metrics': {
                      'hyphenRate': r['metrics']['hyphenRate'],
                      'emergencyLines': r['metrics']['emergencyLines'],
                      'oneWordFinalLines': r['metrics']['oneWordFinalLines'],
                      'compositionFailures': r['metrics']['compositionFailures'],
                      'maxRightErrorPx': r['metrics']['maxRightErrorPx'],
                      'maxStrictWordSpacingEm': r['metrics']['maxStrictWordSpacingEm'],
                      'maxRelaxedWordSpacingEm': r['metrics']['maxRelaxedWordSpacingEm'],
                  }} for r in d['results']
              ],
          }
          dst = Path(f"build/qa-v107/body-size-{os.environ['PROBE_SIZE']}.json")
          dst.write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v107-body-size-${{ matrix.size }}
          path: build/qa-v107/body-size-${{ matrix.size }}.json
          if-no-files-found: error

