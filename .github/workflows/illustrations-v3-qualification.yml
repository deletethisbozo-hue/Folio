name: Illustration V3 Layout Qualification

on:
  push:
    branches: [feature/illustrations-v3-layout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-illustrations-v3-layout
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}\build\puppeteer-cache
      PANDOC_BIN: ${{ github.workspace }}\build\pandoc\pandoc.exe

    steps:
      - name: Check out V3 branch
        uses: actions/checkout@v4

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Pandoc 3.11
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\pandoc | Out-Null
          New-Item -ItemType Directory -Force build\pandoc-unpack | Out-Null
          $url = "https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile build\pandoc.zip
          $actual = (Get-FileHash build\pandoc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "2ab72baf2399450e148ddf7a2a8689806c42e1bba71862b57e220fd9b8456d3d") { throw "Pandoc checksum mismatch: $actual" }
          Expand-Archive build\pandoc.zip build\pandoc-unpack -Force
          $exe = Get-ChildItem build\pandoc-unpack -Filter pandoc.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Pandoc executable missing." }
          Copy-Item $exe.FullName build\pandoc\pandoc.exe

      - name: Install Chromium
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: V2 direct-manipulation regression
        run: node --import tsx tests/illustration-v2-ui.test.ts

      - name: V3 alpha contour geometry
        run: node --import tsx tests/illustration-v3-contour.test.ts

      - name: Legacy crop compatibility
        run: node --import tsx tests/illustration-preview-ui.test.ts

      - name: V3 EPUB contour qualification
        run: node --import tsx tests/illustration-v3-epub.test.ts

      - name: Full regression suite
        run: npm test

      - name: Upload V3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Illustration-V3-Preview
          path: build/qa-illustrations-v3/*.png
          if-no-files-found: warn
