name: Folio 1.0.7 one-shot UI test cleanup

on:
  push:
    branches: ["fix/v1.0.7"]
    paths:
      - ".github/workflows/v107-ui-test-patch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Windows qualification follow source and test changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/v107-windows-qualification.yml")
          text = path.read_text(encoding="utf-8")
          needle = '''      - ".github/workflows/v107-windows-qualification.yml"\n      - "scripts/v107-qa-trigger.txt"\n      - "scripts/v107-windows-trigger.txt"'''
          replacement = '''      - ".github/workflows/v107-windows-qualification.yml"\n      - "scripts/v107-qa-trigger.txt"\n      - "scripts/v107-windows-trigger.txt"\n      - "web/**"\n      - "server/**"\n      - "tests/**"\n      - "scripts/v107-visual-qa.ts"\n      - "package.json"\n      - "package-lock.json"'''
          if needle not in text:
              raise SystemExit("Windows qualification trigger block not found")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
          git rm .github/workflows/v107-ui-test-patch.yml
      - name: Commit permanent trigger cleanup
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v107-windows-qualification.yml .github/workflows/v107-ui-test-patch.yml
          git commit -m "Clean UI test patch scaffold and harden Windows qualification triggers"
          git push origin HEAD:fix/v1.0.7
