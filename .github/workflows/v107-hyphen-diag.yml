name: Folio 1.0.7 hyphen diagnostics

on:
  push:
    branches: ["fix/v1.0.7"]
    paths: [".github/workflows/v107-hyphen-diag.yml"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Print English dictionary breakpoints
        run: |
          node --input-type=module <<'NODE'
          import Hypher from 'hypher';
          import english from 'hyphenation.en-us';
          const h = new Hypher(english);
          const corpus = `Looking back, I can see how the ordinary contained the extraordinary all along—how every small choice, every overlooked detail, was leading me here. Professional typesetting should feel calm, even, and almost invisible to the reader.`;
          const words = [...new Set(corpus.match(/\p{L}+/gu) ?? [])];
          for (const word of words) {
            const pieces = h.hyphenate(word);
            const legal = [];
            let offset = 0;
            for (let i = 0; i < pieces.length - 1; i++) {
              offset += pieces[i].length;
              if (word.length >= 7 && offset >= 3 && word.length - offset >= 3) legal.push(offset);
            }
            if (legal.length || ['ordinary','contained','extraordinary','overlooked','Professional','typesetting','invisible'].includes(word)) {
              console.log(`${word.padEnd(22)} pieces=${pieces.join('|')} legal=${legal.join(',')}`);
            }
          }
          NODE
