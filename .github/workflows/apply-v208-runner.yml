name: Run Folio 2.0.8 patch application

on:
  push:
    branches:
      - fix/v2.0.8-ui-style-image-export

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.8-ui-style-image-export
          fetch-depth: 0
      - name: Apply embedded patch script once
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          app = Path('web/src/App.tsx').read_text(encoding='utf-8')
          if 'data-command="add"' not in app and 'Reset to Theme Default' in app:
              print('v2.0.8 patch already applied')
              raise SystemExit(0)
          workflow = Path('.github/workflows/apply-v208-fixes.yml').read_text(encoding='utf-8')
          anchor = '      - name: Apply product and regression fixes\n        shell: python\n        run: |\n'
          if anchor not in workflow:
              raise SystemExit('embedded patch anchor missing')
          script = workflow.split(anchor, 1)[1].split('      - name: Typecheck before commit\n', 1)[0]
          script = textwrap.dedent(script)
          exec(compile(script, 'embedded-v208-patch.py', 'exec'))
      - name: Typecheck
        run: npm ci && npm run typecheck
      - name: Commit product patch if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/src/App.tsx web/src/mockup-ui.ts server/pipeline/ingest.ts server/filters/book.lua server/pipeline/build-doc.ts tests/image-page.test.ts tests/v208-regression.test.ts; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx web/src/mockup-ui.ts server/pipeline/ingest.ts server/filters/book.lua server/pipeline/build-doc.ts tests/image-page.test.ts tests/v208-regression.test.ts
          git commit -m "Fix duplicate Add, theme reset and image-page export [v208-applied]"
          git push origin HEAD:fix/v2.0.8-ui-style-image-export
